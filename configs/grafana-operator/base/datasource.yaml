apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victorialogs
  namespace: monitoring-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: VictoriaLogs
    url: http://vlogs-vlselect.monitoring-system.svc.cluster.local:9471
    type: victoriametrics-logs-datasource
    access: proxy
    isDefault: false
