{
  "apiVersion": "grafana.integreatly.org/v1beta1",
  "kind": "GrafanaDashboard",
  "metadata": {
    "name": "app-slo",
    "namespace": "monitoring-system"
  },
  "spec": {
    "instanceSelector": {
      "matchLabels": {
        "dashboards": "grafana"
      }
    },
    "json": "{\n  \"title\": \"App SLO Overview\",\n  \"uid\": \"app-slo\",\n  \"timezone\": \"utc\",\n  \"refresh\": \"1m\",\n  \"time\": {\n    \"from\": \"now-24h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": []\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"table\",\n      \"title\": \"Availability (30d SLI, 99% objective)\",\n      \"datasource\": {\n        \"type\": \"victoriametrics-metrics-datasource\",\n        \"uid\": \"VictoriaMetricsDS\",\n        \"datasource\": {\n          \"type\": \"victoriametrics-metrics-datasource\",\n          \"uid\": \"VictoriaMetricsDS\"\n        }\n      },\n      \"gridPos\": {\n        \"h\": 18,\n        \"w\": 18,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sort_desc(avg_over_time(probe_success{job=\\\"public-endpoints\\\"}[30d]) * 100)\",\n          \"instant\": true,\n          \"refId\": \"A\",\n          \"format\": \"table\"\n        }\n      ],\n      \"transformations\": [\n        {\n          \"id\": \"organize\",\n          \"options\": {\n            \"excludeByName\": {\n              \"Time\": true,\n              \"__name__\": true,\n              \"job\": true\n            },\n            \"renameByName\": {\n              \"Value\": \"availability %\",\n              \"instance\": \"endpoint\"\n            }\n          }\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {\n            \"align\": \"auto\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 97\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 99\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"showHeader\": true\n      }\n    },\n    {\n      \"id\": 2,\n      \"type\": \"stat\",\n      \"title\": \"Endpoints down now\",\n      \"datasource\": {\n        \"type\": \"victoriametrics-metrics-datasource\",\n        \"uid\": \"VictoriaMetricsDS\",\n        \"datasource\": {\n          \"type\": \"victoriametrics-metrics-datasource\",\n          \"uid\": \"VictoriaMetricsDS\"\n        }\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n          \"expr\": \"count(probe_success{job=\\\"public-endpoints\\\"} == 0) or vector(0)\",\n          \"instant\": true,\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 3,\n      \"type\": \"stat\",\n      \"title\": \"Error budget consumed (30d, fleet avg)\",\n      \"datasource\": {\n        \"type\": \"victoriametrics-metrics-datasource\",\n        \"uid\": \"VictoriaMetricsDS\",\n        \"datasource\": {\n          \"type\": \"victoriametrics-metrics-datasource\",\n          \"uid\": \"VictoriaMetricsDS\"\n        }\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 8\n      },\n      \"targets\": [\n        {\n          \"expr\": \"clamp_min(100 - avg(avg_over_time(probe_success{job=\\\"public-endpoints\\\"}[30d])) * 100, 0)\",\n          \"instant\": true,\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"max\": 1,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 0.5\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 4,\n      \"type\": \"timeseries\",\n      \"title\": \"Probe latency by endpoint\",\n      \"datasource\": {\n        \"type\": \"victoriametrics-metrics-datasource\",\n        \"uid\": \"VictoriaMetricsDS\",\n        \"datasource\": {\n          \"type\": \"victoriametrics-metrics-datasource\",\n          \"uid\": \"VictoriaMetricsDS\"\n        }\n      },\n      \"gridPos\": {\n        \"h\": 10,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 18\n      },\n      \"targets\": [\n        {\n          \"expr\": \"avg_over_time(probe_duration_seconds{job=\\\"public-endpoints\\\"}[5m])\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"{{instance}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        }\n      }\n    },\n    {\n      \"id\": 5,\n      \"type\": \"timeseries\",\n      \"title\": \"Availability by endpoint (1h window)\",\n      \"datasource\": {\n        \"type\": \"victoriametrics-metrics-datasource\",\n        \"uid\": \"VictoriaMetricsDS\",\n        \"datasource\": {\n          \"type\": \"victoriametrics-metrics-datasource\",\n          \"uid\": \"VictoriaMetricsDS\"\n        }\n      },\n      \"gridPos\": {\n        \"h\": 10,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 28\n      },\n      \"targets\": [\n        {\n          \"expr\": \"avg_over_time(probe_success{job=\\\"public-endpoints\\\"}[1h]) * 100\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"{{instance}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 97\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 99\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"min\"\n          ]\n        }\n      }\n    }\n  ],\n  \"schemaVersion\": 41,\n  \"version\": 1\n}"
  }
}
