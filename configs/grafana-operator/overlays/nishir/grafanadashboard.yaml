apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: comin
  namespace: monitoring-system
  labels:
    app.kubernetes.io/part-of: dashboards
spec:
  url: https://raw.githubusercontent.com/shikanime-labs/dashboards/v0.4.32/dashboards/comin.json
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: security
  namespace: monitoring-system
  labels:
    app.kubernetes.io/part-of: dashboards
spec:
  url: https://raw.githubusercontent.com/shikanime-labs/dashboards/v0.4.39/dashboards/security.json
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
