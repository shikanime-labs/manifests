---
apiVersion: v1
kind: Service
metadata:
  name: k8s-nameserver
  namespace: tailscale-system
  labels:
    app.kubernetes.io/part-of: tailscale-egress
spec:
  type: ClusterIP
  clusterIP: 10.96.99.99
  selector:
    app: nameserver
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 1053
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 1053
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-egress-proxy
  namespace: tailscale-system
  labels:
    app.kubernetes.io/part-of: tailscale-egress
  annotations:
    tailscale.com/tailnet-fqdn: matrix.taila659a.ts.net
    tailscale.com/proxy-group: egress
spec:
  type: ExternalName
  externalName: matrix.taila659a.ts.net
  ports:
    - name: https
      port: 443
      protocol: TCP
---
