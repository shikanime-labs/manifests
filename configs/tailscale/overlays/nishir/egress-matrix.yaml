apiVersion: v1
kind: Service
metadata:
  name: ts-egress-matrix
  namespace: tailscale-system
  labels:
    app.kubernetes.io/part-of: tailscale-egress
  annotations:
    tailscale.com/tailnet-fqdn: matrix.taila659a.ts.net
    tailscale.com/proxy-group: egress
spec:
  type: ExternalName
  externalName: matrix.taila659a.ts.net
  ports:
    - name: https
      port: 443
      protocol: TCP
