apiVersion: v1
kind: Service
metadata:
  name: ts-magicdns
  namespace: tailscale-system
  labels:
    app.kubernetes.io/part-of: tailscale-egress
spec:
  type: ClusterIP
  clusterIP: 10.96.99.99
  selector:
    app: nameserver
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 1053
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 1053
