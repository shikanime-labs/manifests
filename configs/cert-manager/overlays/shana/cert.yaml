---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shana-ca
  namespace: cert-manager-trust
spec:
  commonName: cluster.local
  isCA: true
  issuerRef:
    name: shana-selfsigned
    kind: ClusterIssuer
  secretName: shana-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shana-webhook-tls
  namespace: flux-system
spec:
  commonName: shana-webhook
  dnsNames:
    - shana-webhook
  issuerRef:
    name: shana
    kind: ClusterIssuer
  secretName: shana-webhook-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
