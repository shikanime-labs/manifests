apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: flux-operator-receivers
  namespace: flux-system
spec:
  mergeType: StrategicMerge
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: flux-operator-receivers
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: flux-receivers-gateway
          tailscale.com/tags: "tag:flux-operator"
