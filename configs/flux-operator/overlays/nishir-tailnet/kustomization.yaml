resources:
  - ../nishir
  - cert.yaml
  - envoyproxy.yaml
  - gateway.yaml
  - gatewayclass.yaml
patches:
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
          - name: flux-operator-receivers
            sectionName: https
      - op: add
        path: /spec/hostnames
        value:
        - flux-receivers.taila659a.ts.net
    target:
      name: flux-operator-receivers
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
          - name: flux-operator-receivers
            sectionName: http
      - op: add
        path: /spec/hostnames
        value:
        - flux-receivers.taila659a.ts.net
    target:
      name: flux-operator-receivers-redirect
      kind: HTTPRoute
