resources:
  - ../nishir
  - cert.yaml
  - envoyproxy.yaml
  - gateway.yaml
  - gatewayclass.yaml
patches:
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
          - name: flux-operator-receivers
            sectionName: https
      - op: add
        path: /spec/hostnames
        value:
        - flux-receivers.taila659a.ts.net
    target:
      name: flux-operator-receivers
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
          - name: flux-operator-receivers
            sectionName: http
      - op: add
        path: /spec/hostnames
        value:
        - flux-receivers.taila659a.ts.net
    target:
      name: flux-operator-receivers-redirect
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: flux-operator
      app.kubernetes.io/instance: nishir
      app.kubernetes.io/name: flux-operator
      app.kubernetes.io/part-of: nishir-infrastructure
      app.kubernetes.io/version: 0.0.0
