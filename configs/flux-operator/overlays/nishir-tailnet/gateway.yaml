apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: flux-operator-receivers
  namespace: flux-system
  annotations:
    # Pin external-dns to a CNAME at the Tailscale hostname. Without this the
    # Gateway status exposes both an IPAddress and a Hostname, producing
    # conflicting A/CNAME record candidates.
    external-dns.alpha.kubernetes.io/target: flux-receivers-proxy.taila659a.ts.net
spec:
  gatewayClassName: flux-operator-receivers
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: studio-shikanime-i-receivers-flux
            group: ""
            kind: Secret
