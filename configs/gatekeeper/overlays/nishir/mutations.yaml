---
apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: set-pod-nishir-ca-certificates-volume
spec:
  applyTo:
    - groups:
        - ""
      kinds:
        - Pod
      versions:
        - v1
  location: spec.volumes[name:certs]
  match:
    kinds:
      - apiGroups:
          - ""
        kinds:
          - Pod
    namespaces:
      - shikanime
    scope: Namespaced
  parameters:
    assign:
      value:
        name: certs
        configMap:
          name: nishir-ca-certificates.crt
          items:
            - key: ca.crt
              path: ca-certificates.crt
---
apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: set-pod-nishir-ca-certificates-volume-mount
spec:
  applyTo:
    - groups:
        - ""
      kinds:
        - Pod
      versions:
        - v1
  location: spec.containers[name:*].volumeMounts[mountPath:"/etc/ssl/certs"]
  match:
    kinds:
      - apiGroups:
          - ""
        kinds:
          - Pod
    namespaces:
      - shikanime
    scope: Namespaced
  parameters:
    assign:
      value:
        name: certs
        mountPath: /etc/ssl/certs
        readOnly: true
---
apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: set-pod-init-nishir-ca-certificates-volume-mount
spec:
  applyTo:
    - groups:
        - ""
      kinds:
        - Pod
      versions:
        - v1
  location: spec.initContainers[name:*].volumeMounts[mountPath:"/etc/ssl/certs"]
  match:
    kinds:
      - apiGroups:
          - ""
        kinds:
          - Pod
    namespaces:
      - shikanime
    scope: Namespaced
  parameters:
    assign:
      value:
        name: certs
        mountPath: /etc/ssl/certs
        readOnly: true
    pathTests:
      - condition: MustExist
        subPath: spec.initContainers
---
apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: set-pod-avoid-gpu-nodes
spec:
  applyTo:
    - groups:
        - ""
      kinds:
        - Pod
      versions:
        - v1
  location: spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution
  match:
    kinds:
      - apiGroups:
          - ""
        kinds:
          - Pod
    labelSelector:
      matchExpressions:
        - key: app.kubernetes.io/name
          operator: NotIn
          values:
            - llama-cpp
    namespaces:
      - shikanime
    scope: Namespaced
  parameters:
    assign:
      value:
        - preference:
            matchExpressions:
              - key: feature.node.kubernetes.io/pci-0380_1002.present
                operator: In
                values:
                  - "true"
          weight: 1
    pathTests:
      - condition: MustNotExist
        subPath: spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution
