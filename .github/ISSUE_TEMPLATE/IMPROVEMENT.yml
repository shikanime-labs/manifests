name: 🔧 Improvement request
description: Improve an existing thing without changing its purpose.
title: "🔧 [IMPROVEMENT] <title>"
labels: [enhancement]
body:
  - type: textarea
    id: current_state
    attributes:
      label: Current state
      description: Describe the existing behavior as it works today, with the documentation or reference that defines it.
      placeholder: Per https://..., the current behavior is...
    validations:
      required: true

  - type: textarea
    id: expected_state
    attributes:
      label: Expected improvement
      description: Describe the behavior or state expected after the improvement.
      placeholder: After the improvement, ...
    validations:
      required: true

  - type: dropdown
    id: recurrence
    attributes:
      label: Recurrence
      description: Has this improvement need come up before? If yes, list the previous tickets in Expected improvement.
      options:
        - No, first occurrence
        - Yes, reported at least once
        - Yes, reported multiple times
    validations:
      required: true
