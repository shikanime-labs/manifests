name: 📋 Task
description: Track a piece of well-understood work that needs doing.
title: "📋 [TASK] <title>"
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the work to be done and what done looks like.
      placeholder: Do ... so that ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link anything that helps whoever picks this up.
      placeholder: Parent issue, prior discussion, related PRs...
    validations:
      required: false
