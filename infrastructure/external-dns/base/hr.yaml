apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  chart:
    spec:
      version: 1.21.1
      chart: external-dns
      interval: 1h
      sourceRef:
        name: external-dns
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: external-dns
  targetNamespace: external-dns-system
  values:
    provider:
      name: cloudflare
    domainFilters:
      - shikanime.studio
    policy: sync
    registry: txt
    txtOwnerId: nishir-external-dns
    proxied: false
    sources:
      - gateway-httproute
      - ingress
      - service
    deploymentStrategy:
      type: RollingUpdate
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: cloudflare_api_token
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
