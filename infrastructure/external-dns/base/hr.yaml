apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  chart:
    spec:
      version: 9.0.3
      chart: external-dns
      interval: 1h
      sourceRef:
        name: external-dns
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: external-dns
  targetNamespace: external-dns-system
  values:
    provider: cloudflare
    domainFilters:
      - shikanime.studio
      - i.shikanime.studio
    policy: sync
    registry: txt
    txtOwnerId: nishir-external-dns
    proxied: false
    sources:
      - gateway-httproute
      - gateway
      - ingress
      - service
    cloudflare:
      secretName: cloudflare-api-token
