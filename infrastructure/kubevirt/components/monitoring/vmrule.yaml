apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  namespace: monitoring-system
  name: kubevirt
spec:
  groups:
    - name: kubevirt.alerts
      rules:
        - alert: VirtAPIDown
          expr: cluster:kubevirt_virt_api_pods_running:count == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: No running virt-api pods were detected for the last 10 min.
            description: >-
              All virt-api pods are down for more than 10 minutes; the KubeVirt
              API is unavailable.
        - alert: NoReadyVirtAPI
          expr: cluster:kubevirt_virt_api_ready:sum == 0 and cluster:kubevirt_virt_api_pods_running:count > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: No ready virt-api was detected for the last 10 min.
            description: >-
              virt-api pods are running but none are ready for more than 10
              minutes.
        - alert: LowReadyVirtAPICount
          expr: cluster:kubevirt_virt_api_ready:sum < cluster:kubevirt_virt_api_pods_running:count and cluster:kubevirt_virt_api_ready:sum > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Some virt-api pods are running but not ready.
            description: >-
              Fewer virt-api pods are ready than running for more than 10
              minutes.
        - alert: VirtControllerDown
          expr: cluster:kubevirt_virt_controller_pods_running:count == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: No running virt-controller was detected for the last 10 min.
            description: >-
              All virt-controller pods are down for more than 10 minutes; VM/VMI
              reconciliation is stalled.
        - alert: NoReadyVirtController
          expr: cluster:kubevirt_virt_controller_ready:sum == 0 and cluster:kubevirt_virt_controller_pods_running:count > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: No ready virt-controller was detected for the last 10 min.
            description: >-
              virt-controller pods are running but none are ready for more than
              10 minutes.
        - alert: NoLeadingVirtController
          expr: cluster:kubevirt_virt_controller_leading:sum == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: No leading virt-controller was detected for the last 10 min.
            description: >-
              No virt-controller has leader election for more than 10 minutes.
        - alert: VirtHandlerDown
          expr: cluster:kubevirt_virt_handler_pods_running:count == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: No running virt-handler pods were detected for the last 10 min.
            description: >-
              All virt-handler pods are down for more than 10 minutes; no VMs
              can be started or managed on nodes.
        - alert: NoReadyVirtHandler
          expr: cluster:kubevirt_virt_handler_ready:sum == 0 and cluster:kubevirt_virt_handler_pods_running:count > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: No ready virt-handler was detected for the last 10 min.
            description: >-
              virt-handler pods are running but none are ready for more than 10
              minutes.
        - alert: VirtOperatorDown
          expr: cluster:kubevirt_virt_operator_pods_running:count == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: No running virt-operator pods were detected for the last 10 min.
            description: >-
              All virt-operator pods are down for more than 10 minutes; KubeVirt
              upgrades and reconciliation are stalled.
        - alert: NoReadyVirtOperator
          expr: cluster:kubevirt_virt_operator_ready:sum == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: No ready virt-operator was detected for the last 10 min.
            description: >-
              virt-operator pods are running but none are ready for more than 10
              minutes.
        - alert: OrphanedVirtualMachineInstances
          expr: >-
            (((max by (node) (kube_pod_status_ready{condition='true',pod=~'virt-handler.*'}
            * on(pod) group_left(node) max by(pod,node)(kube_pod_info{pod=~'virt-handler.*',node!=''})) ) == 1)
            or (count by (node)( kube_pod_info{pod=~'virt-launcher.*',node!=''})*0)) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: No ready virt-handler pod detected on node {{ $labels.node }} with running vmis for more than 10 minutes
            description: >-
              Node {{ $labels.node }} runs virt-launcher pods but has no ready
              virt-handler.
        - alert: VirtLauncherPodsStuckFailed
          expr: sum(kube_pod_status_phase{phase='Failed', pod=~'virt-launcher-.*'}) >= 200
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: At least 200 virt-launcher pods are stuck in Failed state and not deleted for 10 minutes.
            description: >-
              Cluster-wide count of Failed virt-launcher pods has been at or
              above 200 for 10 minutes.
        - alert: VMCannotBeEvicted
          expr: >-
            label_replace(kubevirt_vmi_non_evictable * on(name, namespace) group_left()
            topk by(name, namespace) (1, kubevirt_vmi_info{phase='running'}) == 1, "vm", "$1", "name", "(.+)")
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: The VM's eviction strategy is set to Live Migration but the VM is not migratable
            description: >-
              Eviction policy for VirtualMachine {{ $labels.name }} in
              namespace {{ $labels.namespace }} (on node {{ $labels.node }}) is
              set to Live Migration but the VM is not migratable
        - alert: KubeVirtVMIExcessiveMigrations
          expr: >-
            label_replace(sum by (vmi, namespace) (topk by (vmi, namespace, vmim) (1,
            max_over_time(kubevirt_vmi_migration_succeeded[1d]))) >= 12, "vm", "$1", "vmi", "(.+)")
          labels:
            severity: warning
          annotations:
            summary: An excessive amount of migrations have been detected on a VirtualMachineInstance in the last 24 hours.
            description: >-
              VirtualMachineInstance {{ $labels.vmi }} in namespace
              {{ $labels.namespace }} has been migrated more than 12 times
              during the last 24 hours
        - alert: OutdatedVirtualMachineInstanceWorkloads
          expr: kubevirt_vmi_number_of_outdated{namespace!=''} != 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: Some running VMIs are still active in outdated pods after KubeVirt control plane update has completed.
            description: >-
              VMIs in namespace {{ $labels.namespace }} still run outdated
              virt-launcher pods 24 hours after the control plane update.
        - alert: VirtualMachineStuckInUnhealthyState
          expr: >-
            label_replace(sum by (name, namespace, status)(kubevirt_vm_info{status='provisioning'}==1
            or kubevirt_vm_info{status='starting'} == 1 or kubevirt_vm_info{status='terminating'} == 1
            or kubevirt_vm_info{status_group='error'} == 1) unless on(name, namespace)
            kubevirt_vmi_info, "vm", "$1", "name", "(.+)")
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Virtual machine in {{ $labels.status }} state for more than 10 minutes
            description: >-
              Virtual machine {{ $labels.name }} in namespace
              {{ $labels.namespace }} has been in {{ $labels.status }} state for
              more than 10 minutes.
        - alert: VMNonRecoverableOSPanic
          expr: >-
            label_replace(floor((sum by (namespace, name) (kubevirt_vmi_guest_os_panic_total)
            unless sum by (namespace, name) (kubevirt_vmi_guest_os_panic_total offset 24h))
            or sum by (namespace, name) (increase(kubevirt_vmi_guest_os_panic_total[24h]))) > 5,
            "vm", "$1", "name", "(.+)")
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: VM {{ $labels.name }} in namespace {{ $labels.namespace }} experienced a non-recoverable guest OS panic
            description: >-
              The VM has experienced {{ $value }} non-recoverable guest OS
              panic(s) in the last 24 hours.
