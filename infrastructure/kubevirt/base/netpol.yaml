# The kube-apiserver is hostNetwork, so its admission-webhook calls to
# kubevirt-operator-webhook / virt-api originate from a node LAN IP
# (192.168.1.0/24), not a pod IP. kubevirt-system otherwise has no ingress
# policy for these pods, so Felix drops the cross-node webhook POST and the
# Flux config-kubevirt dry-run fails with context deadline exceeded.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubevirt-allow-ingress
  namespace: kubevirt-system
spec:
  podSelector:
    matchExpressions:
      - key: kubevirt.io
        operator: In
        values:
          - virt-operator
          - virt-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 8444
        - protocol: TCP
          port: 8443
