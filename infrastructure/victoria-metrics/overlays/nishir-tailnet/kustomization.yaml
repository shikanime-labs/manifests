apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../nishir
  - envoyproxy.yaml
  - gateway.yaml
  - gatewayclass.yaml
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: grafana.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
        - name: grafana
          sectionName: https
    target:
      name: grafana
      kind: HTTPRoute
      namespace: monitoring-system
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: grafana.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
        - name: grafana
          sectionName: http
    target:
      name: grafana-redirect
      kind: HTTPRoute
      namespace: monitoring-system
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: telemetry.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
        - name: grafana
          sectionName: https-telemetry
    target:
      name: telemetry
      kind: HTTPRoute
      namespace: monitoring-system
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: telemetry.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
        - name: grafana
          sectionName: http
    target:
      name: telemetry-redirect
      kind: HTTPRoute
      namespace: monitoring-system
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: victoria-metrics
      app.kubernetes.io/instance: nishir
      app.kubernetes.io/name: victoria-metrics
      app.kubernetes.io/part-of: nishir-infrastructure
      app.kubernetes.io/version: 0.82.0
