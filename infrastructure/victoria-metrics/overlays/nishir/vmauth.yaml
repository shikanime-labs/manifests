---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: telemetry-edge
  namespace: monitoring-system
spec:
  extraArgs:
    enableTCP6: "true"
  unauthorizedUserAccessSpec:
    url_map:
      - src_paths:
          - ^/insert/native.*
        url_prefix: http://vlogs-vlinsert.monitoring-system.svc.cluster.local:9481
      - src_paths:
          - ^/insert/0/prometheus.*
        url_prefix: http://vminsert-vmks-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local:8480
      - src_paths:
          - ^/health$
          - ^/select/vmui.*
        url_prefix: http://vlogs-vlselect.monitoring-system.svc.cluster.local:9471
  userSelector:
    matchLabels:
      vmauth: cli-logs
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: cli-logs
  namespace: monitoring-system
  labels:
    vmauth: cli-logs
spec:
  username: cli
  passwordRef:
    name: cli-logs-auth
    key: password
  targetRefs:
    - static:
        url: http://vlogs-vlinsert.monitoring-system.svc.cluster.local:9481
      paths:
        - ^/insert/native.*
    - static:
        url: http://vminsert-vmks-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local:8480
      paths:
        - ^/insert/0/prometheus.*
    - static:
        url: http://vlogs-vlselect.monitoring-system.svc.cluster.local:9471
      paths:
        - ^/select/logsql/.*
    - static:
        url: http://vmselect-vmks-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local:8481/select/0/prometheus
      paths:
        - ^/api/v1/.*
