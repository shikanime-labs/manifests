apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  values:
    grafana:
      replicas: 1
      persistence:
        storageClassName: nishir-ephemeral
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: 127.0.0.1
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: 127.0.0.1
    vmcluster:
      spec:
        vminsert:
          extraArgs:
            enableTCP6: "true"
        vmselect:
          extraArgs:
            enableTCP6: "true"
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 2Gi
                storageClassName: nishir-ephemeral
        vmstorage:
          extraArgs:
            enableTCP6: "true"
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: nishir-ephemeral
      enabled: true
