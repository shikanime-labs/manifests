apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  values:
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: 127.0.0.1
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: 127.0.0.1
    vmalert:
      spec:
        externalLabels:
          namespace: monitoring-system
        ruleNamespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring-system
    vmalertmanager:
      spec:
        configSelector: {}
    vmcluster:
      spec:
        vminsert:
          extraArgs:
            enableTCP6: "true"
        vmselect:
          extraArgs:
            enableTCP6: "true"
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 2Gi
                storageClassName: longhorn-ephemeral
        vmstorage:
          extraArgs:
            enableTCP6: "true"
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: longhorn-ephemeral
      enabled: true
