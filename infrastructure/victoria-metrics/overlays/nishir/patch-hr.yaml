apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  values:
    defaultRules:
      rules:
        "cluster:node_cpu:ratio":
          enabled: false
        "instance:node_load1_per_cpu:ratio":
          enabled: false
        "node:node_num_cpu:sum":
          enabled: false
        "code_verb:apiserver_request_total:increase30d":
          enabled: false
        "apiserver_request:availability30d":
          enabled: false
        "code:apiserver_request_total:increase30d":
          enabled: false
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: 127.0.0.1
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: 127.0.0.1
    vmalert:
      spec:
        datasource:
          url: http://vmauth-vmalert-datasource.monitoring-system.svc.cluster.local:8427
        externalLabels:
          namespace: monitoring-system
        ruleNamespaceSelector: {}
    vmalertmanager:
      spec:
        configSelector: {}
    vmcluster:
      spec:
        vminsert:
          extraArgs:
            enableTCP6: "true"
            maxLabelsPerTimeseries: "80"
        vmselect:
          extraArgs:
            enableTCP6: "true"
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 8Gi
                storageClassName: longhorn-ephemeral
        vmstorage:
          extraArgs:
            enableTCP6: "true"
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: longhorn-ephemeral
      enabled: true
