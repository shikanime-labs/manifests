apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  values:
    vmsingle:
      spec:
        extraArgs:
          enableTCP6: "true"
        storage:
          resources:
            requests:
              storage: 8Gi
          storageClassName: local-path
      enabled: true
