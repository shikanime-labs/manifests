apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  values:
    alertmanager:
      enabled: false
    vmagent:
      remoteWrite:
        - url: https://ts-metrics-ingest.monitoring-system.svc.cluster.local/insert/0/prometheus/api/v1/write
          tlsConfig:
            serverName: metrics.i.shikanime.studio
          inlineRelabelConfig:
            - action: replace
              targetLabel: cluster
              replacement: shana
    vmalert:
      enabled: false
    vmsingle:
      enabled: false
