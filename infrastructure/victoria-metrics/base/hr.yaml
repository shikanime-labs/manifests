apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  chart:
    spec:
      version: 0.82.0
      chart: victoria-metrics-k8s-stack
      interval: 1h
      sourceRef:
        name: victoriametrics
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: vmks
  targetNamespace: monitoring-system
  values:
    defaultDashboards:
      grafanaOperator:
        enabled: true
    defaultDatasources:
      grafanaOperator:
        enabled: true
    grafana:
      enabled: false
      forceDeployDatasource: true
    kubeEtcd:
      vmScrape:
        enabled: false
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              max_scrape_size: 64MB
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
    kubelet:
      vmScrape:
        spec:
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            - action: labeldrop
              regex: (cpu_feature_node_kubevirt_io_.*|hyperv_node_kubevirt_io_.*|machine_type_node_kubevirt_io_.*|host_model_required_features_node_kubevirt_io_.*|scheduling_node_kubevirt_io_.*|feature_node_kubernetes_io_cpu_cpuid.*)
    vmagent:
      spec:
        extraArgs:
          enableTCP6: "true"
        relabelConfigs:
          - targetLabel: job
            sourceLabels:
              - job
            regex: node
            replacement: node-exporter
    vmalert:
      extraArgs:
        enableTCP6: "true"
      ruleNamespaceSelector: null
    vmcluster:
      spec:
        vmstorage:
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 16Gi
                accessModes:
                  - ReadWriteOncePod
        vmselect:
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOncePod
    vmsingle:
      enabled: false
