apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  chart:
    spec:
      version: 0.82.0
      chart: victoria-metrics-k8s-stack
      interval: 1h
      sourceRef:
        name: victoriametrics
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: vmks
  targetNamespace: monitoring-system
  values:
    defaultDashboards:
      grafanaOperator:
        enabled: true
    defaultDatasources:
      grafanaOperator:
        enabled: true
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: VictoriaMetrics
            isDefault: true
          - name: VictoriaMetrics (DS)
            version: 0.26.1
            isDefault: false
            access: proxy
            uid: VictoriaMetricsDS
            type: victoriametrics-metrics-datasource
    grafana:
      enabled: false
      forceDeployDatasource: true
    kubeEtcd:
      vmScrape:
        enabled: false
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              max_scrape_size: 64MB
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
    prometheus-node-exporter:
      enabled: false
    kubelet:
      vmScrape:
        spec:
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            - action: labeldrop
              regex: (.*node_kubevirt_io_.*|.*node_kubernetes_io_.*|.*node_longhorn_io_.*|kubernetes_io_.*|kubevirt_io_.*|shikanime_dev_.*)
    vmagent:
      spec:
        extraArgs:
          enableTCP6: "true"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
    vmalert:
      extraArgs:
        enableTCP6: "true"
      ruleNamespaceSelector: null
    vmcluster:
      spec:
        vmstorage:
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 32Gi
                accessModes:
                  - ReadWriteOncePod
        vmselect:
          spec:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOncePod
    vmsingle:
      enabled: false
