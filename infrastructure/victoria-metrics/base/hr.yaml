apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  chart:
    spec:
      version: 0.82.0
      chart: victoria-metrics-k8s-stack
      interval: 1h
      sourceRef:
        name: victoriametrics
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: vmks
  targetNamespace: monitoring-system
  values:
    defaultDashboards:
      grafanaOperator:
        enabled: true
    defaultDatasources:
      grafanaOperator:
        enabled: true
    grafana:
      enabled: false
      forceDeployDatasource: true
    kubeEtcd:
      vmScrape:
        enabled: false
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              max_scrape_size: 64MB
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
    prometheus-node-exporter:
      enabled: false
    vmagent:
      extraArgs:
        enableTCP6: "true"
    vmalert:
      extraArgs:
        enableTCP6: "true"
      ruleNamespaceSelector: null
    vmcluster:
      spec:
        vmstorage:
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 16Gi
                accessModes:
                  - ReadWriteOncePod
        vmselect:
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOncePod
    vmsingle:
      enabled: false
