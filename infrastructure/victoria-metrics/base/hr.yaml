apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  chart:
    spec:
      version: 0.82.0
      chart: victoria-metrics-k8s-stack
      interval: 1h
      sourceRef:
        name: victoriametrics
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: vmks
  targetNamespace: monitoring-system
  values:
    defaultDashboards:
      grafanaOperator:
        enabled: true
    defaultDatasources:
      grafanaOperator:
        enabled: true
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: VictoriaMetrics
            isDefault: true
          - name: VictoriaMetrics (DS)
            version: 0.26.1
            isDefault: false
            access: proxy
            uid: VictoriaMetricsDS
            type: victoriametrics-metrics-datasource
    grafana:
      enabled: false
      forceDeployDatasource: true
    kubeEtcd:
      vmScrape:
        enabled: false
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              max_scrape_size: 64MB
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
    prometheus-node-exporter:
      enabled: false
    kubelet:
      vmScrape:
        spec:
          relabelConfigs:
            - source_labels: [__metrics_path__]
              target_label: metrics_path
            - action: labelkeep
              regex: __address__|__scheme__|__metrics_path__|node|job|instance|metrics_path
            - target_label: job
              replacement: kubelet
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            - action: labeldrop
              regex: (.*node_kubevirt_io_.*|.*node_kubernetes_io_.*|.*node_longhorn_io_.*|kubernetes_io_.*|kubevirt_io_.*|shikanime_dev_.*)
    vmagent:
      spec:
        replicaCount: 2
        resources:
          requests:
            cpu: 250m
            memory: 300Mi
        extraArgs:
          enableTCP6: "true"
    vmalert:
      spec:
        replicaCount: 2
      extraArgs:
        enableTCP6: "true"
      ruleNamespaceSelector: null
    vmcluster:
      spec:
        vmstorage:
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 32Gi
                accessModes:
                  - ReadWriteOncePod
        vmselect:
          extraArgs:
            search.maxConcurrentRequests: "16"
            search.maxQueueDuration: "60s"
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOncePod
    kube-state-metrics:
      replicas: 2
    vmsingle:
      enabled: false
