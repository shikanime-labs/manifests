apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  chart:
    spec:
      version: 0.82.0
      chart: victoria-metrics-k8s-stack
      interval: 1h
      sourceRef:
        name: victoriametrics
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: vmks
  targetNamespace: monitoring-system
  values:
    defaultDashboards:
      enabled: true
    grafana:
      enabled: true
      persistence:
        type: pvc
        enabled: true
        size: 2Gi
        accessModes:
          - ReadWriteOncePod
    kubeEtcd:
      vmScrape:
        enabled: false
    prometheus-node-exporter:
      enabled: false
    vmagent:
      extraArgs:
        enableTCP6: "true"
    vmalert:
      extraArgs:
        enableTCP6: "true"
    vmcluster:
      spec:
        vmstorage:
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 16Gi
                accessModes:
                  - ReadWriteOncePod
        vmselect:
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOncePod
    vmsingle:
      enabled: false
