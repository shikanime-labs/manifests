---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vmks-kube-state-metrics
  namespace: monitoring-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vmks-kube-state-metrics
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: kube-state-metrics
        maxAllowed:
          memory: 1Gi
