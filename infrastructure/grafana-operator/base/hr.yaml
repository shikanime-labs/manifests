apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: flux-system
spec:
  chart:
    spec:
      version: 5.24.0
      chart: grafana-operator
      interval: 1h
      sourceRef:
        name: grafana
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: monitoring-system-grafana-operator
  targetNamespace: monitoring-system
  values:
    crds:
      immutable: false
    env:
      - name: WATCH_NAMESPACE_SELECTOR
        value: kubernetes.io/metadata.name
