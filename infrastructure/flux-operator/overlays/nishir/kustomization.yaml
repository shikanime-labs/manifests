resources:
  - ../../base
  - cert.yaml
  - clusterrolebinding.yaml
  - gateway.yaml
patches:
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
        - name: flux-operator
          sectionName: https
      - op: add
        path: /spec/hostnames
        value:
        - flux.i.shikanime.studio
    target:
      name: flux-operator
      kind: HTTPRoute
      namespace: flux-system
secretGenerator:
  # Consumed by the operator's --web-config-secret-name, so the name must stay
  # stable across content changes (no hash suffix).
  - name: flux-web-config
    namespace: flux-system
    files:
      - config.yaml=flux-web-config/config.enc.yaml
    options:
      disableNameSuffixHash: true
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: flux-operator
      app.kubernetes.io/instance: nishir
      app.kubernetes.io/name: flux-operator
      app.kubernetes.io/part-of: nishir-infrastructure
      app.kubernetes.io/version: 0.0.0
