resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
patches:
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
        - name: flux-operator
          sectionName: https
      - op: add
        path: /spec/hostnames
        value:
        - flux.i.shikanime.studio
    target:
      name: flux-operator
      kind: HTTPRoute
      namespace: flux-system
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: flux-operator
      app.kubernetes.io/instance: nishir
      app.kubernetes.io/name: flux-operator
      app.kubernetes.io/part-of: nishir-infrastructure
      app.kubernetes.io/version: 0.0.0
