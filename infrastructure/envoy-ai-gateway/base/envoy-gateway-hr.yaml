apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  chart:
    spec:
      version: v1.4.3
      chart: envoy-gateway-helm
      interval: 1h
      sourceRef:
        name: envoyproxy
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: envoy-gateway
  targetNamespace: envoy-gateway-system
  values:
    # AI Gateway extends Envoy Gateway; install EG control plane + CRDs.
    provider:
      type: Kubernetes
    gateway:
      controller:
        image:
          pullPolicy: IfNotPresent
