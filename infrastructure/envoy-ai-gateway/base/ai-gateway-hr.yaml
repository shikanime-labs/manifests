apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
  namespace: flux-system
spec:
  chart:
    spec:
      version: 1.1.0
      chart: ai-gateway-helm
      interval: 1h
      sourceRef:
        name: envoyproxy
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: ai-gateway
  targetNamespace: envoy-gateway-system
  dependsOn:
    - name: envoy-gateway
      namespace: flux-system
    - name: ai-gateway-crds
      namespace: flux-system
  values:
    controller:
      replicaCount: 1
