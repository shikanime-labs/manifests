apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-static-provisioner
  namespace: flux-system
spec:
  chart:
    spec:
      version: 2.9.0
      chart: local-static-provisioner
      interval: 1h
      sourceRef:
        name: kubernetes-sigs-sig-storage
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: local-static-provisioner
  targetNamespace: local-provisioner
  values:
    rbac:
      create: true
    classes:
      - name: local-nvme-llama-cpp
        hostDir: /var/lib/local-nvme/llama-cpp
        volumeMode: Filesystem
        fsType: xfs
        storageClass:
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
      - name: local-nvme-ds4
        hostDir: /var/lib/local-nvme/ds4
        volumeMode: Filesystem
        fsType: xfs
        storageClass:
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
