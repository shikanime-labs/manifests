apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpa-metrics
  namespace: autoscaler-system
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: metrics
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vertical-pod-autoscaler
  policyTypes:
    - Ingress
