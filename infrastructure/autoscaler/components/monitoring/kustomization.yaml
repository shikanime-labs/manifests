apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: vmagent
          ports:
            - port: prometheus
              protocol: TCP
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: vpa-metrics
