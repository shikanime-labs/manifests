---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs
  namespace: monitoring-system
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /insert
      backendRefs:
        - name: vmauth-telemetry-edge
          port: 8427
    - backendRefs:
        - name: vmauth-telemetry-edge
          port: 8427
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs-ui
  namespace: monitoring-system
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /select/vmui
      backendRefs:
        - name: vmauth-telemetry-edge
          port: 8427
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs-redirect
  namespace: monitoring-system
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
