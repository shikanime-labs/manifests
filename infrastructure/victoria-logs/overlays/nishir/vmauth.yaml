apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: vmalert-datasource
  namespace: monitoring-system
spec:
  extraArgs:
    enableTCP6: "true"
  unauthorizedUserAccessSpec:
    url_map:
      - src_paths:
          - ^/select/logsql/.*
        url_prefix: http://vlogs-vlselect.monitoring-system.svc.cluster.local:9471
      - src_paths:
          - ^/api/v1/.*
        url_prefix: http://vmselect-vmks-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local:8481/select/0/prometheus
