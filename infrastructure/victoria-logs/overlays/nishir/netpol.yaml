---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vlogs-select
  namespace: monitoring-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-cluster
      app: vlselect
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
        # Grafana reads this datasource in-cluster; its own OIDC-gated UI is
        # the identity layer, so it keeps a direct path rather than a token.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9471
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vlogs-insert
  namespace: monitoring-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-cluster
      app: vlinsert
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
      ports:
        - port: 9481
          protocol: TCP
