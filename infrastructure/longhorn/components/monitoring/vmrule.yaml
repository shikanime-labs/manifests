apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: longhorn
  namespace: monitoring-system
spec:
  groups:
    - name: longhorn.rules
      rules:
        - alert: LonghornVolumeActualSpaceUsedWarning
          expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn Volume Actual Space Used Warning"
            description: "The actual space used by Longhorn volume {{ $labels.volume }} on {{ $labels.node }} is at {{ $value }}% of its capacity."
        - alert: LonghornVolumeStatusCritical
          expr: longhorn_volume_robustness == 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn Volume Status Critical"
            description: "Longhorn volume {{ $labels.volume }} on {{ $labels.node }} is in Faulted state."
        - alert: LonghornVolumeStatusWarning
          expr: longhorn_volume_robustness == 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn Volume Status Warning"
            description: "Longhorn volume {{ $labels.volume }} on {{ $labels.node }} is in Degraded state."
        - alert: LonghornNodeStorageWarning
          expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 70
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn Node Storage Warning"
            description: "The used storage of node {{ $labels.node }} is at {{ $value }}% of its capacity."
        - alert: LonghornDiskStorageWarning
          expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 70
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn Disk Storage Warning"
            description: "The used storage of disk {{ $labels.disk }} on node {{ $labels.node }} is at {{ $value }}% of its capacity."
        - alert: LonghornNodeDown
          expr: ((avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"}) == 1) or on() vector(0)) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn Node Down"
            description: "Longhorn node {{ $labels.node }} has been down for more than 5 minutes."
        - alert: LonghornInstanceManagerCPUUsageWarning
          expr: (longhorn_instance_manager_cpu_usage_millicpu / longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn Instance Manager CPU Usage Warning"
            description: "The CPU usage of Longhorn instance manager {{ $labels.instance_manager }} on node {{ $labels.node }} is at {{ $value }}% of its request."
        - alert: LonghornNodeCPUUsageWarning
          expr: (longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu) * 100 > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn Node CPU Usage Warning"
            description: "The CPU usage of Longhorn node {{ $labels.node }} is at {{ $value }}% of its capacity."
