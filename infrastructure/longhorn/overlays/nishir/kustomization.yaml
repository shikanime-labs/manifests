resources:
  - ../../base
  - gateway.yaml
  - httproute.yaml
components:
  - ../../components/monitoring
patches:
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
        - name: longhorn
          sectionName: https
      - op: add
        path: /spec/hostnames
        value:
        - longhorn.i.shikanime.studio
    target:
      name: longhorn
      kind: HTTPRoute
      namespace: longhorn-system
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
        - name: longhorn
          sectionName: http
      - op: add
        path: /spec/hostnames
        value:
        - longhorn.i.shikanime.studio
    target:
      name: longhorn-redirect
      kind: HTTPRoute
      namespace: longhorn-system
  - path: patch-hr.yaml
secretGenerator:
  - name: longhorn-hetzner-backups
    namespace: longhorn-system
    envs:
      - longhorn-hetzner-backups/.enc.env
    options:
      annotations:
        longhorn.io/backup-target: s3://shikanime-studio-nishir-longhorn-backups-e9750005@fsn1/
      disableNameSuffixHash: true
