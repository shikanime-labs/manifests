apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-oidc-client
  namespace: longhorn-system
spec:
  targetRefs:
    - name: longhorn
      kind: HTTPRoute
      group: gateway.networking.k8s.io
  oidc:
    provider:
      issuer: https://accounts.i.shikanime.studio
    # offline_access + refreshToken: Envoy silently refreshes the session at
    # access-token expiry instead of 302-ing live SPA fetches to authelia
    # (a cross-origin redirect Firefox reports as a fake CORS failure).
    scopes:
      - openid
      - offline_access
    refreshToken: true
    clientID: longhorn
    clientSecret:
      name: longhorn-oidc-client
    redirectURL: https://longhorn.i.shikanime.studio/oauth2/callback
