apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              - op: add
                path: /spec/ingress/0/from/-
                value:
                  namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: envoy-gateway-system
            target:
              name: longhorn-ui-frontend
              version: v1
              kind: NetworkPolicy
