---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: gatekeeper-audit
  namespace: gatekeeper-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gatekeeper-audit
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: manager
        maxAllowed:
          memory: 1Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: gatekeeper-controller-manager
  namespace: gatekeeper-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gatekeeper-controller-manager
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: manager
        maxAllowed:
          memory: 1Gi
