apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatekeeper
  namespace: flux-system
spec:
  chart:
    spec:
      version: 3.22.2
      chart: gatekeeper
      interval: 1h
      sourceRef:
        name: gatekeeper
        kind: HelmRepository
        namespace: flux-system
  install:
    crds: Create
  interval: 10m
  releaseName: gatekeeper
  targetNamespace: gatekeeper-system
  upgrade:
    crds: CreateReplace
  values:
    controllerManager:
      resources:
        requests:
          cpu: 60m
          memory: 320Mi
      networkPolicy:
        enabled: true
        ingress:
          - from:
              - ipBlock:
                  cidr: 0.0.0.0/0
    defaultCreateVAPBindingForConstraints: false
    defaultCreateVAPForTemplates: false
    enableK8sNativeValidation: false
    pdb:
      controllerManager:
        minAvailable: 1
    upgradeCRDs:
      enabled: false
    # x509 escape window: chart default of 1s admitted pods unmutated on slow
    # webhook responses (manifests#3409).
    mutatingWebhookTimeoutSeconds: 5
    # Plain pod UPDATEs must stay out of the mutating webhook: re-mutating a
    # terminated pod on finalizer-removal updates wedged the job-tracking
    # finalizer and stalled the CronJob (manifests#3409). Ephemeral containers
    # only ever arrive through pods/ephemeral, so hardening survives.
    mutatingWebhookCustomRules:
      - apiGroups: ['*']
        apiVersions: ['*']
        operations: [CREATE]
        resources: ['*']
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [UPDATE]
        resources: ['pods/ephemeral']
