---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy
  namespace: flux-system
spec:
  chart:
    spec:
      # The cluster's Gateway API CRDs are bundle v1.5.0, and the
      # safe-upgrades ValidatingAdmissionPolicy denies any chart shipping an
      # older bundle (v1.6.x/v1.7.x ship v1.4.1). v1.8.3 is the floor
      # (bundles v1.5.1).
      version: v1.8.3
      chart: gateway-helm
      interval: 1h
      sourceRef:
        name: envoyproxy
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: envoy-gateway
  targetNamespace: envoy-system
  values:
    # Wire the ai-gateway extension into Envoy Gateway's xDS translation so the
    # inference Gateway actually emits its ext-proc filter bundle. Without this,
    # the ai-gateway controller never gets called back and the data plane mounts
    # a non-existent filter-config-bundle ConfigMap -> empty route table ->
    # universal direct_response 500 on every request (incl. the local floor).
    config:
      envoyGateway:
        # Enable the Backend API so EG accepts Backend refs (incl. the Z.ai
        # MCP backends). Without this, generated routes fail ResolvedRefs with
        # "Backend is disabled in Envoy Gateway configuration" -> 500.
        extensionApis:
          enableBackend: true
        extensionManager:
          hooks:
            xdsTranslator:
              translation:
                listener:
                  includeAll: true
                route:
                  includeAll: true
                cluster:
                  includeAll: true
                secret:
                  includeAll: true
              post:
                - Translation
                - Cluster
                - Route
          service:
            fqdn:
              hostname: ai-gateway-controller.envoy-system.svc.cluster.local
              port: 1063
    envoyDeployment:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: feature.node.kubernetes.io/cpu-model.vendor_id
                      operator: In
                      values:
                        - Intel
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway-crds
  namespace: flux-system
spec:
  chart:
    spec:
      version: 1.1.0
      chart: ai-gateway-crds-helm
      interval: 1h
      sourceRef:
        name: envoyproxy
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: ai-gateway-crds
  targetNamespace: envoy-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
  namespace: flux-system
spec:
  chart:
    spec:
      version: 1.1.0
      chart: ai-gateway-helm
      interval: 1h
      sourceRef:
        name: envoyproxy
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: ai-gateway
  targetNamespace: envoy-system
  dependsOn:
    - name: envoy
      namespace: flux-system
    - name: ai-gateway-crds
      namespace: flux-system
  values:
    controller:
      replicaCount: 2
      leaderElection:
        enabled: true
  valuesFrom:
    - name: ai-gateway-session-seed
      kind: Secret
      valuesKey: seed
      targetPath: controller.mcp.sessionEncryption.seed
      optional: false
