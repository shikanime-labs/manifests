apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: local-path-provisioner
  namespace: local-path-provisioner
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: local-path-provisioner
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: local-path-provisioner
        maxAllowed:
          memory: 1Gi
