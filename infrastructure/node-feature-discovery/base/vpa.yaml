apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: node-feature-discovery-gc
  namespace: node-feature-discovery-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: node-feature-discovery-gc
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
    - containerName: gc
      maxAllowed:
        memory: 1Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: node-feature-discovery-master
  namespace: node-feature-discovery-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: node-feature-discovery-master
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
    - containerName: master
      maxAllowed:
        memory: 1Gi
