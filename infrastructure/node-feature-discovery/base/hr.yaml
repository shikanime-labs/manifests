apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: flux-system
spec:
  chart:
    spec:
      version: 0.18.0
      chart: node-feature-discovery
      interval: 1h
      sourceRef:
        name: kubernetes-sigs-nfd
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: node-feature-discovery
  targetNamespace: node-feature-discovery-system
  values:
    featureGates:
      NodeFeatureGroupAPI: true
    master:
      extraArgs:
        - -feature-gates=NodeFeatureGroupAPI=true
      replicaCount: 1
    worker:
      config:
        core:
          labelSources:
            - system
            - kernel
            - network
            - cpu
            - local
            - pci
        custom:
          - name: network.2.5g
            labels:
              network.speed.2.5g: "true"
            matchFeatures:
              - feature: network.device
                matchExpressions:
                  speed:
                    op: In
                    value:
                      - "2500"
                  operstate:
                    op: In
                    value:
                      - up
          - name: network.10g
            labels:
              network.speed.10g: "true"
            matchFeatures:
              - feature: network.device
                matchExpressions:
                  speed:
                    op: In
                    value:
                      - "10000"
                  operstate:
                    op: In
                    value:
                      - up
        featureSources:
          - system
          - kernel
          - network
          - cpu
          - local
          - pci
