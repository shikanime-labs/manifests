apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-flux
  namespace: flux-system
spec:
  commonName: flux.i.shikanime.studio
  dnsNames:
    - flux.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-flux
  usages:
    - digital signature
    - key encipherment
    - server auth
