---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vlogs-vlinsert
  namespace: monitoring-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vlogs-vlinsert
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: vlinsert
        minAllowed:
          memory: 1Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vlogs-vlselect
  namespace: monitoring-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vlogs-vlselect
  updatePolicy:
    updateMode: InPlaceOrRecreate
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vlogs-vlstorage
  namespace: monitoring-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: vlogs-vlstorage
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: vlstorage
        minAllowed:
          memory: 1Gi
