---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway-crds
  namespace: flux-system
spec:
  chart:
    spec:
      version: 1.1.0
      chart: ai-gateway-crds-helm
      interval: 1h
      sourceRef:
        name: envoyproxy
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: ai-gateway-crds
  targetNamespace: envoy-ai-gateway-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
  namespace: flux-system
spec:
  chart:
    spec:
      version: 1.1.0
      chart: ai-gateway-helm
      interval: 1h
      sourceRef:
        name: envoyproxy
        kind: HelmRepository
        namespace: flux-system
  interval: 10m
  releaseName: ai-gateway
  targetNamespace: envoy-ai-gateway-system
  dependsOn:
    - name: envoy
      namespace: flux-system
    - name: ai-gateway-crds
      namespace: flux-system
  values:
    controller:
      replicaCount: 2
      leaderElection:
        enabled: true
      # Empty string disables the default agent-session-id header_to_metadata
      # listener filter. That injection hard-fails on non-HTTP filter chains
      # (syncthing TCP/UDP listeners) whenever the extension hook receives
      # listener IR (envoy-gateway listener.includeAll: true).
      logRequestHeaderAttributes: ""
  valuesFrom:
    - name: ai-gateway-session-seed
      kind: Secret
      valuesKey: seed
      targetPath: controller.mcp.sessionEncryption.seed
      optional: false
