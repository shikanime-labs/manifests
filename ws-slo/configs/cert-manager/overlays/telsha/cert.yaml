---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: telsha-ca
  namespace: cert-manager-trust
spec:
  commonName: cluster.local
  isCA: true
  issuerRef:
    name: telsha-selfsigned
    kind: ClusterIssuer
  secretName: telsha-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: telsha-webhook-tls
  namespace: flux-system
spec:
  commonName: telsha-webhook
  dnsNames:
    - telsha-webhook
  issuerRef:
    name: telsha
    kind: ClusterIssuer
  secretName: telsha-webhook-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
