apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llama-cpp-rpc-worker
  namespace: shikanime
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes:
          - ReadWriteOncePod
        storageClassName: local-path
        resources:
          requests:
            storage: 256Gi
  serviceName: llama-cpp-rpc-worker
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp-rpc-worker
      app.kubernetes.io/process: llama-cpp-rpc-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: llama-cpp
        app.kubernetes.io/name: llama-cpp-rpc-worker
        app.kubernetes.io/process: llama-cpp-rpc-worker
      annotations:
        k8s.v1.cni.cncf.io/networks: shikanime/llama-cpp-rpc-worker
    spec:
      securityContext:
        fsGroup: 65532
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: llama-cpp-rpc-head
                  app.kubernetes.io/name: llama-cpp-rpc-head
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-0380_1002.present
                    operator: In
                    values:
                      - "true"
      containers:
        - name: llama-cpp-rpc-worker
          image: llama-cpp-rpc-worker
          command:
            - ggml-rpc-server
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          args:
            - --host
            - 0.0.0.0
            - --port
            - "50052"
            - --cache
          env:
            - name: LLAMA_CACHE
              value: /cache
          ports:
            - name: rpc
              containerPort: 50052
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-dri
              mountPath: /dev/dri
      volumes:
        - name: dev-kfd
          hostPath:
            type: CharDevice
            path: /dev/kfd
        - name: dev-dri
          hostPath:
            type: Directory
            path: /dev/dri
