---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp
spec:
  rules:
    - backendRefs:
        - name: llama-cpp
          port: 9931
      # 10m cap: generous for long generations, still bounds a stuck stream
      # (Envoy's default 15s cap resets mid-generation; 0s was effectively
      # infinite and let hung streams run forever).
      timeouts:
        request: 600s
---
# Browser clients (the llama.cpp web UI) call /v1 cross-origin with an API
# key, not the OIDC session cookie the UI routes use. A separate route keeps
# /v1 under apiKeyAuth with CORS so browser calls get 401 JSON with CORS
# headers instead of an OIDC 302 that the browser reports as a CORS failure.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp-api
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: llama-cpp
          port: 9931
      # Same 10m cap as the UI route: /v1 carries the streaming chat
      # completions. 0s (infinite) let hung streams run forever.
      timeouts:
        request: 600s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp-redirect
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
