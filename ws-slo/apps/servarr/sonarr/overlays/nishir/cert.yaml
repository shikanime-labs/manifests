---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sonarr-tls
spec:
  commonName: sonarr
  dnsNames:
    - sonarr
    - sonarr.shikanime
    - sonarr.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: sonarr-pkcs12-password
        key: password
      profile: Modern2023
  secretName: sonarr-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-sonarr
  namespace: shikanime
spec:
  commonName: sonarr.i.shikanime.studio
  dnsNames:
    - sonarr.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-sonarr
  usages:
    - digital signature
    - key encipherment
    - server auth
