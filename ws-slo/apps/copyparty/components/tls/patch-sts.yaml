apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: copyparty
spec:
  template:
    spec:
      containers:
        - name: copyparty
          volumeMounts:
            - name: tls
              mountPath: /cfg/copyparty/cert.pem
              readOnly: true
              subPath: cert.pem
      volumes:
        - name: tls
          secret:
            items:
              - key: tls-combined.pem
                path: cert.pem
            secretName: copyparty-tls
