apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-external-dns
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  deletionPolicy: Orphan
  dependsOn:
    - name: infrastructure-envoy-gateway
    - name: infrastructure-envoy-ai-gateway
    - name: config-cert-manager
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns
      namespace: flux-system
  interval: 10m
  path: ./infrastructure/external-dns/overlays/nishir
  prune: true
  sourceRef:
    name: flux-system
    kind: GitRepository
