apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-envoy-ai-gateway
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  deletionPolicy: Orphan
  dependsOn:
    - name: infrastructure-envoy-gateway
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ai-gateway-crds
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ai-gateway
      namespace: flux-system
  interval: 10m
  path: ./infrastructure/envoy-ai-gateway/overlays/nishir
  prune: true
  sourceRef:
    name: flux-system
    kind: GitRepository
