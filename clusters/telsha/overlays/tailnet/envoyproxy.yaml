apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: telsha-webhook
  namespace: flux-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: telsha-webhook
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: telsha-webhook
          tailscale.com/hostname: telsha-webhook.i.shikanime.studio
          tailscale.com/tags: "tag:web"
