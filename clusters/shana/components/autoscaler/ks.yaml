---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-autoscaler
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  deletionPolicy: Orphan
  dependsOn:
    - name: config-cert-manager
    - name: infrastructure-victoria-metrics
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vpa
      namespace: flux-system
  interval: 10m
  path: ./infrastructure/autoscaler/overlays/shana
  prune: true
  sourceRef:
    name: flux-system
    kind: GitRepository
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config-autoscaler
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  deletionPolicy: Orphan
  dependsOn:
    - name: infrastructure-autoscaler
  interval: 10m
  path: ./configs/autoscaler/overlays/shana
  prune: true
  sourceRef:
    name: flux-system
    kind: GitRepository
