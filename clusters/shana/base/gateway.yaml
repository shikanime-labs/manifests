apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shana-webhook
  namespace: flux-system
spec:
  gatewayClassName: shana-webhook
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: shana-webhook-tls
            group: ""
            kind: Secret
