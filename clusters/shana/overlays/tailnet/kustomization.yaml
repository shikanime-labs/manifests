resources:
  - ../../base
components:
  - ../../components/autoscaler
  - ../../components/cert-manager
  - ../../components/envoy-gateway
  - ../../components/gatekeeper
  - ../../components/victoria-metrics
  - ../../components/victoria-logs
  - ../../components/grafana-operator
  - ../../components/tailscale
  - ../../components/trust-manager
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: cluster
      app.kubernetes.io/instance: shana
      app.kubernetes.io/name: shana
      app.kubernetes.io/part-of: shana-infrastructure
      app.kubernetes.io/version: 0.0.0
secretGenerator:
  - name: discord-webhook
    namespace: flux-system
    envs:
      - discord-webhook/.enc.env
  - name: receiver-token
    namespace: flux-system
    envs:
      - receiver-token/.enc.env
