apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: shana-webhook
  namespace: flux-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: shana-webhook
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: shana-webhook-gateway
          tailscale.com/tags: "tag:shana-webhook"
