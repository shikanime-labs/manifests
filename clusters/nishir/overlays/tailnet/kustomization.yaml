resources:
  - ../../base
  - envoyproxy.yaml
  - gatewayclass.yaml
  - ks.yaml
components:
  - ../../components/autoscaler
  - ../../components/cert-manager
  - ../../components/cluster-api
  - ../../components/descheduler
  - ../../components/envoy-gateway
  - ../../components/envoy-ai-gateway
  - ../../components/gatekeeper
  - ../../components/longhorn
  - ../../components/lws
  - ../../components/victoria-metrics
  - ../../components/victoria-logs
  - ../../components/kubevirt
  - ../../components/node-feature-discovery
  - ../../components/tailscale
  - ../../components/trust-manager
  - ../../components/external-dns
patches:
  - path: patch-netpol.yaml
    target:
      name: default
      namespace: shikanime
      kind: NetworkPolicy
  - path: patch-gateway.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: cluster
      app.kubernetes.io/instance: nishir
      app.kubernetes.io/name: nishir
      app.kubernetes.io/part-of: nishir-infrastructure
      app.kubernetes.io/version: 0.0.0
secretGenerator:
  - name: discord-webhook
    namespace: flux-system
    envs:
      - discord-webhook/.enc.env
  - name: receiver-token
    namespace: flux-system
    envs:
      - receiver-token/.enc.env
