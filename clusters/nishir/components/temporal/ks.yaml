apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-temporal
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: apps-temporal-postgres
    - name: infrastructure-autoscaler
    - name: infrastructure-cert-manager
    - name: infrastructure-envoy-gateway
    - name: infrastructure-victoria-metrics
    - name: infrastructure-tailscale
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: temporal
      namespace: flux-system
  interval: 10m
  path: ./apps/temporal/overlays/nishir-tailnet
  prune: true
  sourceRef:
    name: flux-system
    kind: GitRepository
