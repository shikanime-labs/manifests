apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-autoscaler
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  deletionPolicy: Orphan
  dependsOn:
    - name: infrastructure-cert-manager
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: vpa-admission-controller
      namespace: autoscaler-system
    - apiVersion: apps/v1
      kind: Deployment
      name: vpa-recommender
      namespace: autoscaler-system
    - apiVersion: apps/v1
      kind: Deployment
      name: vpa-updater
      namespace: autoscaler-system
  interval: 10m
  path: ./infrastructure/autoscaler/overlays/nishir
  prune: true
  sourceRef:
    name: flux-system
    kind: GitRepository
  timeout: 5m
