apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-cdi
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  deletionPolicy: Orphan
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cdi-operator
      namespace: cdi
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: CDI
      name: cdi
  interval: 10m
  path: ./infrastructure/cdi/base
  prune: true
  sourceRef:
    name: flux-system
    kind: GitRepository
