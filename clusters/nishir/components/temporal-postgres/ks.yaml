apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-temporal-postgres
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infrastructure-autoscaler
    - name: infrastructure-cert-manager
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: temporal-postgres
      namespace: shikanime
  interval: 10m
  path: ./apps/temporal-postgres/overlays/nishir-tailnet
  prune: true
  sourceRef:
    name: flux-system
    kind: GitRepository
