apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-victoria-metrics
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  deletionPolicy: Orphan
  dependsOn:
    - name: infrastructure-longhorn
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: victoriametrics
      namespace: flux-system
  interval: 10m
  path: ./infrastructure/victoria-metrics/overlays/nishir
  prune: true
  sourceRef:
    name: flux-system
    kind: GitRepository
