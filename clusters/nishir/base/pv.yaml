---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: archives-data
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 64Gi
  claimRef:
    name: archives-data
    namespace: shikanime
  csi:
    driver: driver.longhorn.io
    fsType: xfs
    volumeHandle: archives-data
    volumeAttributes:
      diskSelector: nearline
      fsType: xfs
      numberOfReplicas: "2"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-capacity
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: downloads-data
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 64Gi
  claimRef:
    name: downloads-data
    namespace: shikanime
  csi:
    driver: driver.longhorn.io
    fsType: xfs
    volumeHandle: downloads-data
    volumeAttributes:
      diskSelector: standard
      migratable: "false"
      nodeSelector: storage
      numberOfReplicas: "2"
      staleReplicaTimeout: "20"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-ephemeral
  volumeMode: Filesystem
