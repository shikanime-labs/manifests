---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: inference-critical
value: 100000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: Primary inference serving (halogen-flash) — preempts sibling inference workloads when the 105Gi Flash pod needs its node back.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: shikanime-critical
value: 1000000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: Cluster-critical user-facing services (authelia SSO, blocky DNS) — preempts regular workloads so authentication and DNS resolution survive node pressure.
