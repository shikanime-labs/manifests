apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nishir-flux-webhook-tls
  namespace: flux-system
spec:
  commonName: nishir-flux-webhook
  dnsNames:
    - nishir-flux-webhook
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  secretName: nishir-flux-webhook-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
