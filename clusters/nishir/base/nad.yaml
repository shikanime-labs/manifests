apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan
  namespace: shikanime
spec:
  config: |-
    {
      "cniVersion": "0.4.0",
      "type": "macvlan",
      "master": "br0",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "datastore": "kubernetes",
        "range": "192.168.1.0/24",
        "range_start": "192.168.1.200",
        "range_end": "192.168.1.250",
        "gateway": "192.168.1.1",
        "routes": [
          { "dst": "0.0.0.0/0" }
        ]
      }
    }
