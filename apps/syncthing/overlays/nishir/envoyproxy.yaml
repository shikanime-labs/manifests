# EnvoyProxy stays in the Gateway's namespace: infrastructure.parametersRef
# is same-namespace only (GEP-3262), and kustomize pins namespace: shikanime.
# The pinned envoyService name gives the data plane a stable Service.
# BYOD: expose the data plane straight through the Tailscale operator (L4).
# Tailscale leads outside the cluster; the gateway terminates UI TLS inside,
# which an L7 Ingress cannot carry for the sync protocol on the same ports.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: syncthing
  namespace: shikanime
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Stable name (default is envoy-<ns>-<name>-<hash>) so the tailnet
        # hostname below is independent of EG's generated names.
        name: syncthing
        # BYOD: expose the data plane straight through the Tailscale operator
        # (L4). Tailscale leads outside the cluster; the mTLS listener does
        # client-cert validation inside, which an L7 Ingress cannot carry.
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          # The 'syncthing' tailnet device is freed once machines drops its
          # tailscale.serve syncthing service, so the data plane takes the
          # canonical name and cert SAN + route hostname line up.
          tailscale.com/hostname: syncthing
