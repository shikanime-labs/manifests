apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: syncthing
  annotations:
    external-dns.alpha.kubernetes.io/target: syncthing-gateway.taila659a.ts.net
spec:
  gatewayClassName: syncthing
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: studio-shikanime-i-syncthing
            group: ""
            kind: Secret
    - name: syncthing
      port: 22000
      protocol: TCP
    - name: syncthing-udp
      port: 22000
      protocol: UDP
