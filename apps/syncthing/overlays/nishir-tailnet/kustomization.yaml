resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - netpol.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: backup
      app.kubernetes.io/instance: syncthing
      app.kubernetes.io/name: syncthing
      app.kubernetes.io/part-of: nishir-operation
      app.kubernetes.io/version: 2.1.3
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: syncthing.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: syncthing
            sectionName: http
    target:
      name: syncthing-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: syncthing.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: syncthing
            sectionName: https
    target:
      name: syncthing
      kind: HTTPRoute
