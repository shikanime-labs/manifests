apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: syncthing
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        # Envoy Gateway data plane (envoy-system) and Tailscale proxy
        # (tailscale-system) must reach the pod for the BYOD L4 gateway.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale-system
      ports:
        - port: http
          protocol: TCP
        - port: sync
          protocol: TCP
        - port: sync-udp
          protocol: UDP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: syncthing
      app.kubernetes.io/name: syncthing
  policyTypes:
    - Ingress
