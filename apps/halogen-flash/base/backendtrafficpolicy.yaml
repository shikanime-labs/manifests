# Keep a conversation's turns on the replica holding its prompt cache
# (manifests#2712): clients send `x-sks-session-id` via hermes'
# `session_affinity_header`; requests without it balance as before.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: halogen-flash-affinity
  namespace: shikanime
spec:
  targetRefs:
    - name: default
      group: gateway.networking.k8s.io
      kind: HTTPRoute
  # One attempt per priority: when a backend stalls (streamIdleTimeout fires
  # before the first token) or resets the connection, move to the next
  # priority instead of retrying the same backend. The affinity hash stays
  # per-attempt, so each failover attempt re-hashes to a fresh backend.
  retry:
    numRetries: 2
    numAttemptsPerPriority: 1
    retryOn:
      triggers:
        - reset
        - reset-before-request
        - connect-failure
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Headers
      headers:
        - name: x-sks-session-id
