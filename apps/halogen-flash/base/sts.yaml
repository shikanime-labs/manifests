apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: halogen-flash
spec:
  serviceName: halogen-flash
  replicas: 2
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: halogen-flash
      app.kubernetes.io/name: halogen-flash
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: halogen-flash
        app.kubernetes.io/name: halogen-flash
    spec:
      priorityClassName: inference-critical
      securityContext:
        fsGroup: 65532
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-0380_1002.present
                    operator: In
                    values:
                      - "true"
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: halogen-flash
                  app.kubernetes.io/name: halogen-flash
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: shikanime.studio/inference
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: halogen-flash
          image: halogen-flash
          resources:
            requests:
              memory: 96Gi
              cpu: 1554m
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            seccompProfile:
              type: Unconfined
          ports:
            - name: http
              containerPort: 8731
          livenessProbe:
            failureThreshold: 30
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 15
          startupProbe:
            failureThreshold: 180
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models
            - name: cache-huggingface
              mountPath: /root/.cache/huggingface
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-dri
              mountPath: /dev/dri
          env:
            - name: HALOGEN_DOWNLOAD
              value: peonist-ai/halogen-qwen3.8-flash-next
            - name: HALOGEN_KV_POOL_POSITIONS
              value: "524288"
            - name: HALOGEN_KV8
              value: "1"
            - name: HALOGEN_KV_SLOTS
              value: "6"
            - name: HALOGEN_MAX_TOK
              value: "16384"
      volumes:
        - name: dev-kfd
          hostPath:
            type: CharDevice
            path: /dev/kfd
        - name: dev-dri
          hostPath:
            type: Directory
            path: /dev/dri
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        resources:
          requests:
            storage: 256Gi
        storageClassName: local-path
        accessModes:
          - ReadWriteOncePod
    - metadata:
        name: cache-huggingface
      spec:
        resources:
          requests:
            storage: 128Gi
        storageClassName: local-path
        accessModes:
          - ReadWriteOncePod
