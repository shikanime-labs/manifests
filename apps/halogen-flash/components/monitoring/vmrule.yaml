apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: halogen-flash
spec:
  groups:
    - name: halogen-flash
      rules:
        - alert: HalogenFlashDown
          expr: up{job="halogen-flash"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: halogen-flash has been down for 5 minutes
        - alert: HalogenFlashGpuQueuesEvicted
          expr: increase(halogen:gpu_queues_evicted_seconds_total[30m]) > 120
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.instance }} lost {{ $value | humanize }}s of GPU service to driver queue eviction in 30m: host memory compaction or reclaim moved pages the GPU maps, and every in-flight request stalled for them. This is the #3079 stall class as a metric, not a crash; the node's budget line is what moved, and #3084/#3086 own the memory.
        - alert: HalogenFlashQueueSaturated
          expr: halogen:queue_wait_longest_seconds > 300
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.instance }} has queued requests past 300s for 15m. Demand exceeds the admitted slots; check halogen:queue_gave_up_total for clients that already left.
        - alert: HalogenFlashDrops
          expr: |
            sum by (pod) (rate(halogen:queue_gave_up_total[10m]))
              / clamp_min(sum by (pod) (rate(halogen:requests_total[10m])), 0.01) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.pod }} is dropping {{ $value | humanizePercentage }} of admitted requests — clients gave up waiting for pool room or a slot. Capacity, not faults: check HalogenFlashQueueSaturated and halogen:kv_pool_waiting_for_room for which bound.
        - alert: HalogenFlashPoolWaiting
          expr: halogen:kv_pool_waiting_for_room > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.pod }} has requests held waiting for KV pool room for 15m — the pool is the binding constraint and gave-up drops follow. This signature preceded the #3143 pool raise.
