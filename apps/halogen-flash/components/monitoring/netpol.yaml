apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: halogen-flash-metrics
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: http
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: halogen-flash
      app.kubernetes.io/name: halogen-flash
  policyTypes:
    - Ingress
