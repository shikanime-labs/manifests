apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qwen3-embedding
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: qwen3-embedding
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-agent
      ports:
        - port: 8000
