apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: shana-workers
spec:
  clusterName: shana
  replicas: 2
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: shana
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: shana
    spec:
      version: v1.33.13+rke2r2
      clusterName: shana
      failureDomain: fsn1
      infrastructureRef:
        name: shana-workers
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: HCloudMachineTemplate
      bootstrap:
        configRef:
          name: shana
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: RKE2ConfigTemplate
