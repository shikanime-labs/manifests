apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerCluster
metadata:
  name: shana
spec:
  controlPlaneEndpoint:
    host: ""
    port: 443
  controlPlaneLoadBalancer:
    enabled: true
    region: fsn1
    extraServices:
      - protocol: tcp
        listenPort: 9345
        destinationPort: 9345
  controlPlaneRegions:
    - fsn1
  hcloudNetwork:
    enabled: false
  hcloudPlacementGroups:
    - name: control-plane
      type: spread
    - name: workers
      type: spread
  hetznerSecretRef:
    name: hetzner
    key:
      hcloudToken: hcloud
  sshKeys:
    hcloud:
      - name: shikanimedeva@telsha
