apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: RKE2ControlPlane
metadata:
  name: shana
spec:
  version: v1.33.13+rke2r2
  replicas: 1
  registrationMethod: control-plane-endpoint
  manifestsConfigMapReference:
    name: shana-manifests
    namespace: shana
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  machineTemplate:
    spec:
      infrastructureRef:
        name: shana-control-plane
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: HCloudMachineTemplate
  serverConfig:
    cloudProviderName: external
    cni: canal
    disableComponents:
      kubernetesComponents:
        - cloudController
    kubeControllerManager:
      extraArgs:
        - --cloud-provider=external
        - --leader-elect=true
  agentConfig:
    kubelet:
      extraArgs:
        - --cloud-provider=external
