resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - path: patch-pvc.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - maintainerr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: maintainerr
          sectionName: https
    target:
      name: maintainerr
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - maintainerr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: maintainerr
          sectionName: http
    target:
      name: maintainerr-redirect
      kind: HTTPRoute
