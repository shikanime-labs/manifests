---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maintainerr-tls
spec:
  commonName: maintainerr
  dnsNames:
    - maintainerr
    - maintainerr.shikanime
    - maintainerr.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  secretName: maintainerr-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-maintainerr
  namespace: shikanime
spec:
  commonName: maintainerr.i.shikanime.studio
  dnsNames:
    - maintainerr.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-maintainerr
  usages:
    - digital signature
    - key encipherment
    - server auth
