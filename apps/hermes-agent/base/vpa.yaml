apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hermes-agent
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: hermes-agent
  updatePolicy:
    updateMode: InPlace
  resourcePolicy:
    containerPolicies:
      - containerName: hermes-agent
        maxAllowed:
          memory: 8Gi
