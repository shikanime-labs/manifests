---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/instance: automata
    app.kubernetes.io/name: automata
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-agent-flux-reader
rules:
  - resources:
      - kustomizations
    apiGroups:
      - kustomize.toolkit.fluxcd.io
    verbs:
      - get
      - list
      - watch
  - resources:
      - helmreleases
    apiGroups:
      - helm.toolkit.fluxcd.io
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-agent-flux-reader
  namespace: shikanime
roleRef:
  name: hermes-agent-flux-reader
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
subjects:
  - name: automata
    kind: ServiceAccount
