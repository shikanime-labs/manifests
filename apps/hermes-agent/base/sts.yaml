apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: hermes-agent
      app.kubernetes.io/name: hermes-agent
  serviceName: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hermes-agent
        app.kubernetes.io/name: hermes-agent
    spec:
      containers:
        - name: hermes-agent
          image: hermes-agent
          args:
            - gateway
            - run
            - --replace
          env:
            - name: DISCORD_ALLOW_BOTS
              value: mentions
          volumeMounts:
            - name: data
              mountPath: /home/hermes/.hermes
            - name: profiles-data
              mountPath: /home/hermes/.hermes/profiles
            - name: skills-data
              mountPath: /home/hermes/.hermes/skills
            - name: run
              mountPath: /run
            - name: ssh-key
              mountPath: /root/.ssh
              readOnly: true
          envFrom:
            - secretRef:
                name: hermes-agent
          lifecycle:
            preStop:
              exec:
                command:
                  - hermes
                  - gateway
                  - stop
                  - --all
      initContainers:
        - name: config-sync
          image: rclone
          args:
            - copy
            - --copy-links
            - --filter
            - + config.yaml
            - --filter
            - + SOUL.md
            - /mnt/startup-config
            - /home/hermes/.hermes
          volumeMounts:
            - name: data
              mountPath: /home/hermes/.hermes
            - name: rclone-config
              mountPath: /config/rclone/rclone.conf
              readOnly: true
              subPath: rclone.conf
            - name: startup-config
              mountPath: /mnt/startup-config
              readOnly: true
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
      securityContext:
        fsGroup: 65532
      volumes:
        - name: profiles-data
          persistentVolumeClaim:
            claimName: hermes-agent-profiles-data
        - name: skills-data
          persistentVolumeClaim:
            claimName: hermes-agent-skills-data
        - name: rclone-config
          configMap:
            name: hermes-agent-rclone
        - name: run
          emptyDir:
            medium: Memory
        - name: startup-config
          projected:
            sources:
              - secret:
                  name: hermes-agent-startup-config
        - name: ssh-key
          secret:
            defaultMode: 400
            secretName: hermes-agent-ssh
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        resources:
          requests:
            storage: 16Gi
        storageClassName: longhorn-standard
        volumeMode: Filesystem
        accessModes:
          - ReadWriteOncePod
