resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: agent
      app.kubernetes.io/instance: hermes-agent
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/part-of: nishir-automata
      app.kubernetes.io/version: 2026.6.5
patches:
  - path: patch-httproute-hermes-agent-dashboard.yaml
    target:
      name: hermes-agent-dashboard
      kind: HTTPRoute
  - path: patch-httproute-hermes-agent-api-server.yaml
    target:
      name: hermes-agent-api-server
      kind: HTTPRoute
  - path: patch-httproute-hermes-agent-a2a.yaml
    target:
      name: hermes-agent-a2a
      kind: HTTPRoute
  - path: patch-httproute-hermes-agent-dashboard-redirect.yaml
    target:
      name: hermes-agent-dashboard-redirect
      kind: HTTPRoute
  - path: patch-httproute-hermes-agent-api-server-redirect.yaml
    target:
      name: hermes-agent-api-server-redirect
      kind: HTTPRoute
  - path: patch-httproute-hermes-agent-a2a-redirect.yaml
    target:
      name: hermes-agent-a2a-redirect
      kind: HTTPRoute
