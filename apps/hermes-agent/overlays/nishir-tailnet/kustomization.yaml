resources:
  - ../nishir
  - gatewayclass.yaml
  - netpol.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
          - name: hermes-agent
            sectionName: a2a
    target:
      name: hermes-agent-a2a
      kind: TCPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: hermes-agent.taila659a.ts.net
    target:
      name: hermes-agent-dashboard
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: hermes-agent.taila659a.ts.net
    target:
      name: hermes-agent-dashboard-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: api.hermes-agent.taila659a.ts.net
    target:
      name: hermes-agent-api-server
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: api.hermes-agent.taila659a.ts.net
    target:
      name: hermes-agent-api-server-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: a2a.hermes-agent.taila659a.ts.net
    target:
      name: hermes-agent-a2a
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: a2a.hermes-agent.taila659a.ts.net
    target:
      name: hermes-agent-a2a-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: hermes-agent.taila659a.ts.net
    target:
      name: hermes-agent-webhook
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: hermes-agent-webhook.taila659a.ts.net
    target:
      name: hermes-agent-webhook
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: backend-service
      app.kubernetes.io/instance: hermes-agent
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/part-of: telsha-workstation
      app.kubernetes.io/version: latest
secretGenerator:
  - name: hermes-agent-sops-key
    envs:
      - sops-key/.enc.env
