- op: add
  path: /spec/ingress/-
  value:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: envoy-gateway-system
        podSelector:
          matchLabels:
            app.kubernetes.io/name: envoy
    ports:
      - port: api-server
      - port: a2a
      - port: dashboard
- op: add
  path: /spec/ingress/-
  value:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring-system
        podSelector:
          matchLabels:
            app.kubernetes.io/name: vmagent
    ports:
      - port: metrics
