resources:
  - ../../base
namespace: shikanime
components:
  - ../../components/api
  - ../../components/browser
  - ../../components/dashboard
  - ../../components/webhook
patches:
  - path: patch-pvc.yaml
configMapGenerator:
  - name: hermes-agent-dreamer
    files:
      - config.yaml=hermes-agent-dreamer/config.yaml
      - SOUL.md=hermes-agent-dreamer/SOUL.md
  - name: hermes-agent-operator
    files:
      - config.yaml=hermes-agent-operator/config.yaml
      - SOUL.md=hermes-agent-operator/SOUL.md
  - name: hermes-agent-coder
    files:
      - config.yaml=hermes-agent-coder/config.yaml
      - SOUL.md=hermes-agent-coder/SOUL.md
  - name: hermes-agent-auxiliary
    files:
      - config.yaml=hermes-agent-auxiliary/config.yaml
      - SOUL.md=hermes-agent-auxiliary/SOUL.md
secretGenerator:
  - name: hermes-agent-startup-config
    files:
      - .env=hermes-agent/.enc.env
      - hermes-agent/config.yaml
      - hermes-agent/SOUL.md
  - name: hermes-agent-ssh
    files:
      - id_ed25519=hermes-agent-ssh/id_ed25519.enc
    options:
      disableNameSuffixHash: true
