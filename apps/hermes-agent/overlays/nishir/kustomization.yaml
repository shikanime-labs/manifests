resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
  - netpol.yaml
namespace: shikanime
components:
  - ../../components/api-server
  - ../../components/a2a
  - ../../components/browser
  - ../../components/dashboard
  - ../../components/honcho
  - ../../components/webhook
patches:
  - path: patch-pvc.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: hermes-agent
          sectionName: https
    target:
      name: hermes-agent-dashboard
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - api.automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: hermes-agent
          sectionName: https
    target:
      name: hermes-agent-api-server
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - a2a.automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: hermes-agent
          sectionName: https
    target:
      name: hermes-agent-a2a
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: hermes-agent
          sectionName: http
    target:
      name: hermes-agent-dashboard-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - api.automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: hermes-agent
          sectionName: http
    target:
      name: hermes-agent-api-server-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - a2a.automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: hermes-agent
          sectionName: http
    target:
      name: hermes-agent-a2a-redirect
      kind: HTTPRoute
secretGenerator:
  - name: hermes-agent-env
    envs:
      - hermes-agent-env/.enc.env
  - name: hermes-agent-startup-config
    files:
      - hermes-agent-env/config.yaml
      - hermes-agent-env/SOUL.md
  - name: hermes-agent-ssh
    files:
      - id_ed25519=hermes-agent-ssh/id_ed25519.enc
    options:
      disableNameSuffixHash: true
