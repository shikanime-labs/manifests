memory:
  flush_min_turns: 6
  nudge_interval: 10
  provider: honcho
model:
  base_url: https://ai.taila659a.ts.net/v1
  default: tencent/hy3:free
  provider: custom:aperture-openai
platform_toolsets:
  cli:
    - hermes-cli
  discord:
    - hermes-discord
  homeassistant:
    - hermes-homeassistant
  signal:
    - hermes-signal
  slack:
    - hermes-slack
  telegram:
    - hermes-telegram
  whatsapp:
    - hermes-whatsapp
platforms:
  webhook:
    enabled: true
    extra:
      port: 8644
      routes:
        github-issue:
          deliver: github_comment
          deliver_extra:
            issue_number: "{issue.number}"
            repo: "{repository.full_name}"
          events:
            - issues
            - issue_comment
          prompt: |-
            Triage and respond to this GitHub issue:
            Repository: {repository.full_name}
            Issue #{issue.number}: {issue.title}
            Author: {issue.user.login}
            URL: {issue.html_url}
            Action: {action}
            Body:
            {issue.body}
            Comment (if present):
            {comment.body}
          skills:
            - github-issue
        github-pr:
          deliver: github_comment
          deliver_extra:
            pr_number: "{number}"
            repo: "{repository.full_name}"
          events:
            - pull_request
          prompt: |-
            Review this pull request:
            Repository: {repository.full_name}
            PR #{number}: {pull_request.title}
            Author: {pull_request.user.login}
            URL: {pull_request.html_url}
            Diff URL: {pull_request.diff_url}
            Action: {action}
          skills:
            - github-code-review
session_reset:
  at_hour: 4
  idle_minutes: 1440
  mode: both
skills:
  creation_nudge_interval: 15
smart_model_routing:
  cheap_model: {}
  enabled: false
  max_simple_chars: 160
  max_simple_words: 28
streaming:
  fresh_final_after_seconds: 60
terminal:
  env_passthrough:
    - GITHUB_TOKEN
  lifetime_seconds: 300
  modal_mode: managed
web:
  backend: ddgs
