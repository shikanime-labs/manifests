apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent-gateway
spec:
  template:
    spec:
      containers:
        - name: hermes-agent-gateway
          env:
            - name: HERMES_DASHBOARD
              value: "1"
          ports:
            - name: dashboard
              containerPort: 9119
      shareProcessNamespace: true
