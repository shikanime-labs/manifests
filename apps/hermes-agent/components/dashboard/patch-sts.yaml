apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
spec:
  template:
    spec:
      containers:
        - name: dashboard
          image: hermes-agent
          command:
            - hermes
            - dashboard
            - --host
            - 0.0.0.0
            - --port
            - "9119"
            - --no-open
            - --skip-build
          ports:
            - name: dashboard
              containerPort: 9119
          env:
            - name: HOME
              value: /home/hermes
          volumeMounts:
            - name: data
              mountPath: /home/hermes/.hermes
          readinessProbe:
            httpGet:
              path: /api/status
              port: 9119
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: hermes-agent-env
