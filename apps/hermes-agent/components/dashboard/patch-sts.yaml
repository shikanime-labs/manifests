apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
spec:
  template:
    spec:
      containers:
        - name: hermes-agent
          env:
            - name: HERMES_DASHBOARD
              value: "1"
          ports:
            - name: dashboard
              containerPort: 9119
# ponytail: shared PID namespace forced the pause container to PID 1,
# breaking s6-overlay (/init must be PID 1 -> "can only run as pid 1").
# Dashboard reaches the gateway over the network, so the share is unneeded.
