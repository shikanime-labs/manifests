apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - httproute.yaml
patches:
  - patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/part-of: nishir-automata
                  app.kubernetes.io/name: a2a
          ports:
            - port: a2a
            - port: api-server
    target:
      name: hermes-agent
      version: v1
      kind: NetworkPolicy
  - path: patch-sts.yaml
  - path: patch-svc.yaml
