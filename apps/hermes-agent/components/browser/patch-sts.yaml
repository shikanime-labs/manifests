apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
spec:
  template:
    spec:
      containers:
        - name: chrome
          image: chrome
          args:
            - --no-sandbox
            - --disable-gpu
            - --disable-dev-shm-usage
            - --remote-debugging-address=127.0.0.1
            - --remote-debugging-port=9222
            - --remote-allow-origins=*
          livenessProbe:
            initialDelaySeconds: 15
            tcpSocket:
              port: cdp
            timeoutSeconds: 5
          readinessProbe:
            initialDelaySeconds: 5
            tcpSocket:
              port: cdp
            timeoutSeconds: 5
