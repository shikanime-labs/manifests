resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: version-control-server
      app.kubernetes.io/instance: gitea-mirror
      app.kubernetes.io/name: gitea-mirror
      app.kubernetes.io/part-of: nishir-platform
      app.kubernetes.io/version: 3.26.2
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: gitea-mirror.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: gitea-mirror
            sectionName: http
    target:
      name: gitea-mirror-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: gitea-mirror.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: gitea-mirror
            sectionName: https
    target:
      name: gitea-mirror
      kind: HTTPRoute
secretGenerator:
  - name: gitea-mirror
    envs:
      - gitea-mirror/.enc.env
