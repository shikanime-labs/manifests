resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: version-control-server
      app.kubernetes.io/instance: gitea-mirror
      app.kubernetes.io/name: gitea-mirror
      app.kubernetes.io/part-of: nishir-platform
      app.kubernetes.io/version: 3.17.1
patches:
  - path: patch-httproute-gitea-mirror.yaml
    target:
      name: gitea-mirror
      kind: HTTPRoute
  - path: patch-httproute-gitea-mirror-redirect.yaml
    target:
      name: gitea-mirror-redirect
      kind: HTTPRoute
secretGenerator:
  - name: gitea-mirror
    envs:
      - gitea-mirror/.enc.env
