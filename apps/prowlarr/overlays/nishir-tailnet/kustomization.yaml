resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
patches:
  - path: patch-httproute-prowlarr.yaml
    target:
      name: prowlarr
      kind: HTTPRoute
  - path: patch-httproute-prowlarr-redirect.yaml
    target:
      name: prowlarr-redirect
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: torrent-tracker
      app.kubernetes.io/instance: prowlarr
      app.kubernetes.io/name: prowlarr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 2.4.0
