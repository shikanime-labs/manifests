---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prowlarr-tls
spec:
  commonName: prowlarr
  dnsNames:
    - prowlarr
    - prowlarr.shikanime
    - prowlarr.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: prowlarr-pkcs12-password
        key: password
      profile: Modern2023
  secretName: prowlarr-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-prowlarr
  namespace: shikanime
spec:
  commonName: prowlarr.i.shikanime.studio
  dnsNames:
    - prowlarr.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-prowlarr
  usages:
    - digital signature
    - key encipherment
    - server auth
