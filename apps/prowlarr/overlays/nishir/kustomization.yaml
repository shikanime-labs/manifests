resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
  - securitypolicy.yaml
namespace: shikanime
components:
  - ../../components/tls
configurations:
  - namereference.yaml
patches:
  - patch: "- op: add\n  path: /spec/hostnames\n  value:\n  - prowlarr.i.shikanime.studio\n- op: add\n  path: /spec/parentRefs\n  value:\n  - name: prowlarr\n    sectionName: https"
    target:
      name: prowlarr
      kind: HTTPRoute
  - patch: "- op: add\n  path: /spec/hostnames\n  value:\n  - prowlarr.i.shikanime.studio\n- op: add\n  path: /spec/parentRefs\n  value:\n  - name: prowlarr\n    sectionName: http"
    target:
      name: prowlarr-redirect
      kind: HTTPRoute
secretGenerator:
  - name: prowlarr-pkcs12-password
    envs:
      - prowlarr-pkcs12-password/.enc.env
  - name: prowlarr-oidc-client
    envs:
      - prowlarr-oidc-client/.enc.env
