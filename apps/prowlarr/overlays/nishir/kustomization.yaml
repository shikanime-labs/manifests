resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
  - securitypolicy.yaml
namespace: shikanime
components:
  - ../../components/tls
configurations:
  - namereference.yaml
patches:
  - path: patch-pvc.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - prowlarr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: prowlarr
          sectionName: https
    target:
      kind: HTTPRoute
      name: prowlarr
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - prowlarr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: prowlarr
          sectionName: http
    target:
      kind: HTTPRoute
      name: prowlarr-redirect
secretGenerator:
  - name: prowlarr-pkcs12-password
    envs:
      - prowlarr-pkcs12-password/.enc.env
  - name: prowlarr-oidc-client
    envs:
      - prowlarr-oidc-client/.enc.env
