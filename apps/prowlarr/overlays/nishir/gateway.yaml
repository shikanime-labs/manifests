apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: prowlarr
  annotations:
    external-dns.alpha.kubernetes.io/target: prowlarr-gateway.taila659a.ts.net
spec:
  gatewayClassName: prowlarr
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: studio-shikanime-i-prowlarr
            group: ""
            kind: Secret
