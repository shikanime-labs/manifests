apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prowlarr
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: prowlarr
      app.kubernetes.io/name: prowlarr
  serviceName: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: prowlarr
        app.kubernetes.io/name: prowlarr
    spec:
      initContainers:
        - name: config-sync
          image: rclone
          args:
            - copyto
            - --copy-links
            - /mnt/startup-config/config.xml
            - /mnt/config/config.xml
          command:
            - rclone
          volumeMounts:
            - name: config
              mountPath: /mnt/config
            - name: startup-config
              mountPath: /mnt/startup-config
              readOnly: true
          securityContext:
            capabilities:
              add:
                - FOWNER
      containers:
        - name: prowlarr
          image: prowlarr
          resources:
            requests:
              cpu: 25m
              memory: 260Mi
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: S6_READ_ONLY_ROOT
              value: "1"
            - name: TZ
              value: Europe/Paris
            - name: PROWLARR__AUTH__METHOD
              value: External
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 5
          ports:
            - name: http
              containerPort: 9696
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 180
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: run
              mountPath: /run
          securityContext:
            capabilities:
              add:
                - CHOWN
                - SETGID
                - SETUID
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
      volumes:
        - name: run
          emptyDir:
            medium: Memory
        - name: startup-config
          secret:
            secretName: prowlarr
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        resources:
          requests:
            storage: 2Gi
        storageClassName: longhorn-standard
        volumeMode: Filesystem
        accessModes:
          - ReadWriteOncePod
