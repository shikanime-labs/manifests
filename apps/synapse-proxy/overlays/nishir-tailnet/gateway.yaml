apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: synapse-proxy
spec:
  gatewayClassName: synapse-proxy
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: synapse-proxy-i-shikanime-studio-tls
            group: ""
            kind: Secret
