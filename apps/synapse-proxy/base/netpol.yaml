apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synapse-proxy
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: synapse
      ports:
        - port: https
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: synapse-proxy
      app.kubernetes.io/name: synapse-proxy
  policyTypes:
    - Ingress
