---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix
spec:
  rules:
    - backendRefs:
        - name: synapse
          port: 8448
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: matrix.taila659a.ts.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-discord-media
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix/server
        - path:
            type: PathPrefix
            value: /_matrix/federation/v1/media/download
        - path:
            type: PathPrefix
            value: /_matrix/client/v1/media
        - path:
            type: PathPrefix
            value: /_matrix/media
        - path:
            type: PathPrefix
            value: /_matrix/key
        - path:
            type: PathPrefix
            value: /_matrix/federation/v1/version
      backendRefs:
        - name: mautrix-discord
          port: 29334
    - backendRefs:
        - name: synapse
          port: 8448
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: matrix.taila659a.ts.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-redirect
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
