apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: blackbox
spec:
  groups:
    - name: blackbox
      interval: 30s
      rules:
        - record: blackbox:availability_ir
          expr: |
            avg_over_time(probe_success{job="blackbox"}[1h])
        - alert: SLOAvailabilityPage
          expr: |
            avg_over_time(probe_success{job="blackbox"}[5m]) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "SLO: {{ $labels.instance }} down"
        - alert: SLOBurnRateFast
          expr: |
            (
              (1 - avg_over_time(probe_success{job="blackbox"}[1h])) > (14.4 * 0.01)
              and
              (1 - avg_over_time(probe_success{job="blackbox"}[5m])) > (14.4 * 0.01)
            )
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "SLO burn rate fast: {{ $labels.instance }} (99% availability objective)"
        - alert: SLOBurnRateSlow
          expr: |
            (
              (1 - avg_over_time(probe_success{job="blackbox"}[6h])) > (6 * 0.01)
              and
              (1 - avg_over_time(probe_success{job="blackbox"}[30m])) > (6 * 0.01)
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SLO burn rate slow: {{ $labels.instance }} (99% availability objective)"
        - alert: SLOLatencyHigh
          expr: |
            avg_over_time(probe_duration_seconds{job="blackbox"}[10m]) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SLO latency: {{ $labels.instance }} p50 probe > 1s"
    - name: blackbox-dns
      interval: 30s
      rules:
        - alert: DNSResolutionDown
          expr: |
            absent(probe_success{instance=~"blocky\\..*"})
            or
            probe_success{instance=~"blocky\\..*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "DNS: blocky probe failing or absent"
            description: |
              The DNS probe against blocky failed or its series went absent,
              so blocky is not answering the probe or the probe itself died.
              A hang on this leg has taken the resolver down for every
              consumer behind it before; triage this alert first, not the app
              SLO burn-rates that follow.
              Runbook: check blocky-side envoy access logs in
              envoy-gateway-system for duration 60001 / response_code 0 per
              query (upstream DoH hang), then node systemd-resolved udp
              timeouts to 127.0.0.53. Heal DNS FIRST: replacement pods
              (coredns, vmalert) sit in ImagePullBackOff through the broken
              DNS, so deleting wedged pods before the resolver recovers just
              re-triggers the same failed pull.
        - alert: DNSResolutionSLOBurnRateFast
          expr: |
            (1 - avg_over_time(probe_success{instance=~"blocky\\..*"}[15m])) > (14.4 * 0.01)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "DNS SLO burn rate fast: {{ $labels.instance }} (99% availability objective)"
        - alert: TailnetResolutionDown
          expr: |
            absent(probe_success{instance=~"k8s-nameserver\\..*",module="dns_tailnet"})
            or
            probe_success{instance=~"k8s-nameserver\\..*",module="dns_tailnet"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "DNS: tailnet ts.net resolution failing"
            description: |
              The ts.net resolution leg (glue service -> operator nameserver)
              is failing or its series went absent. The in-cluster blocky leg
              is separately alerted; triage this one by walking the chain:
              k8s-nameserver glue service endpoints, DNSConfig nameserver pods.
              Stays warning-level: apps keep dialing via the host-level hack
              until U5 removes it, so this failing degrades the new path only.

