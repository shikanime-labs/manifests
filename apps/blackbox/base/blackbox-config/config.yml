modules:
  http_2xx:
    prober: http
    timeout: 9s
    http:
      valid_status_codes:
        - 200
        - 401
        - 403
        - 404
      preferred_ip_protocol: ip4
      follow_redirects: true
  dns_blocky:
    prober: dns
    timeout: 9s
    dns:
      # Cache-expiring name, 5m cadence: the entry expires between probes, so
      # every probe forces a real blocky-to-upstream round-trip and an upstream
      # hang flips probe_success (#3230: github.com is fleet-warmed and always
      # served from cache, which stayed green through the 2026-11-02 outage).
      query_name: whoami.akamai.net
      preferred_ip_protocol: ip4
