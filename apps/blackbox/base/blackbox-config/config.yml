modules:
  http_2xx:
    prober: http
    timeout: 9s
    http:
      valid_status_codes:
        - 200
        - 401
        - 403
        - 404
      preferred_ip_protocol: ip4
      follow_redirects: true
  dns_blocky:
    prober: dns
    timeout: 9s
    dns:
      # Only name in the fleet not queried elsewhere: cache expires between
      # probes, every probe must reach the upstream (#3230).
      query_name: whoami.akamai.net
      preferred_ip_protocol: ip4
