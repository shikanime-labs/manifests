modules:
  http_2xx:
    prober: http
    timeout: 9s
    http:
      valid_status_codes:
        - 200
        - 401
        - 403
        - 404
      preferred_ip_protocol: ip4
      follow_redirects: true
  dns_blocky:
    prober: dns
    timeout: 9s
    dns:
      query_name: whoami.akamai.net
      preferred_ip_protocol: ip4
  dns_tailnet:
    prober: dns
    timeout: 9s
    dns:
      query_name: blocky.taila659a.ts.net
      query_type: A
      preferred_ip_protocol: ip4
