apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox
    spec:
      containers:
        - name: exporter
          image: docker.io/prom/blackbox-exporter:v0.26.0
          args:
            - --config.file=/etc/blackbox_exporter/config.yml
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox_exporter
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 250Mi
      volumes:
        - name: config
          configMap:
            name: blackbox-config
