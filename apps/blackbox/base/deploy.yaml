apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  namespace: monitoring-system
  labels:
    app.kubernetes.io/instance: blackbox
    app.kubernetes.io/name: blackbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: blackbox
      app.kubernetes.io/name: blackbox
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: blackbox
        app.kubernetes.io/name: blackbox
    spec:
      containers:
        - name: exporter
          image: docker.io/prom/blackbox-exporter:v0.26.0
          args:
            - --config.file=/etc/blackbox_exporter/config.yml
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
