apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmblackbox-exporter
  namespace: monitoring-system
  labels:
    app.kubernetes.io/name: vmblackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmblackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmblackbox-exporter
    spec:
      containers:
        - name: exporter
          image: docker.io/prom/blackbox-exporter:v0.26.0
          args:
            - --config.file=/etc/blackbox_exporter/config.yml
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vmblackbox-exporter
  namespace: monitoring-system
  labels:
    app.kubernetes.io/name: vmblackbox-exporter
spec:
  selector:
    app.kubernetes.io/name: vmblackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
