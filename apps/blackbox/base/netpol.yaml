apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blackbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blackbox
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
      ports:
        - port: 9115
          protocol: TCP
