    \   \"renameByName\": {\n              \"Value\": \"availability %\",\n      \
    \        \"instance\": \"endpoint\"\n            }\n          }\n        }\n \
    \     ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\"\
    : {\n            \"align\": \"auto\"\n          },\n          \"thresholds\":\
    \ {\n            \"mode\": \"absolute\",\n            \"steps\": [\n         \
    \     {\n                \"color\": \"red\",\n                \"value\": null\n\
    \              },\n              {\n                \"color\": \"yellow\",\n \
    \               \"value\": 97\n              },\n              {\n           \
    \     \"color\": \"green\",\n                \"value\": 99\n              }\n\
    \            ]\n          }\n        },\n        \"overrides\": []\n      },\n\
    \      \"options\": {\n        \"showHeader\": true\n      }\n    },\n    {\n\
    \      \"id\": 8,\n      \"type\": \"table\",\n      \"title\": \"TLS certificate\
    \ expiry\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n    \
    \    \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\"\
    : 18,\n        \"w\": 10,\n        \"x\": 14,\n        \"y\": 19\n      },\n \
    \     \"targets\": [\n        {\n          \"expr\": \"sort_asc((probe_ssl_earliest_cert_expiry{job=\\\
    \"blackbox\\\"} - time()) / 86400)\",\n          \"instant\": true,\n        \
    \  \"refId\": \"A\",\n          \"format\": \"table\"\n        }\n      ],\n \
    \     \"transformations\": [\n        {\n          \"id\": \"organize\",\n   \
    \       \"options\": {\n            \"excludeByName\": {\n              \"Time\"\
    : true,\n              \"__name__\": true,\n              \"job\": true\n    \
    \        },\n            \"renameByName\": {\n              \"Value\": \"days\
    \ left\",\n              \"instance\": \"endpoint\"\n            }\n         \
    \ }\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n\
    \          \"unit\": \"d\",\n          \"custom\": {\n            \"align\": \"\
    auto\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\"\
    ,\n            \"steps\": [\n              {\n                \"color\": \"red\"\
    ,\n                \"value\": null\n              },\n              {\n      \
    \          \"color\": \"yellow\",\n                \"value\": 14\n           \
    \   },\n              {\n                \"color\": \"green\",\n             \
    \   \"value\": 30\n              }\n            ]\n          }\n        },\n \
    \       \"overrides\": []\n      },\n      \"options\": {\n        \"showHeader\"\
    : true\n      }\n    },\n    {\n      \"id\": 9,\n      \"type\": \"row\",\n \
    \     \"title\": \"Latency\",\n      \"gridPos\": {\n        \"h\": 1,\n     \
    \   \"w\": 24,\n        \"x\": 0,\n        \"y\": 37\n      },\n      \"collapsed\"\
    : false,\n      \"panels\": []\n    },\n    {\n      \"id\": 10,\n      \"type\"\
    : \"timeseries\",\n      \"title\": \"Probe latency by endpoint\",\n      \"datasource\"\
    : {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n \
    \     },\n      \"gridPos\": {\n        \"h\": 10,\n        \"w\": 24,\n     \
    \   \"x\": 0,\n        \"y\": 38\n      },\n      \"targets\": [\n        {\n\
    \          \"expr\": \"avg_over_time(probe_duration_seconds{job=\\\"blackbox\\\
    \"}[5m])\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"{{endpoint}}\"\
    \n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n   \
    \       \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n   \
    \   \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\"\
    ,\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"\
    lastNotNull\",\n            \"max\"\n          ]\n        }\n      }\n    },\n\
    \    {\n      \"id\": 11,\n      \"type\": \"timeseries\",\n      \"title\": \"\
    HTTP duration phases (fleet p95)\",\n      \"datasource\": {\n        \"type\"\
    : \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\"\
    : {\n        \"h\": 10,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\"\
    : 48\n      },\n      \"targets\": [\n        {\n          \"expr\": \"quantile_over_time(0.95,\
    \ probe_http_duration_seconds{job=\\\"blackbox\\\", phase=\\\"connect\\\"}[5m])\"\
    ,\n          \"refId\": \"A\",\n          \"legendFormat\": \"connect {{endpoint}}\"\
    \n        },\n        {\n          \"expr\": \"quantile_over_time(0.95, probe_http_duration_seconds{job=\\\
    \"blackbox\\\", phase=\\\"processing\\\"}[5m])\",\n          \"refId\": \"B\"\
    ,\n          \"legendFormat\": \"processing {{endpoint}}\"\n        },\n     \
    \   {\n          \"expr\": \"quantile_over_time(0.95, probe_http_duration_seconds{job=\\\
    \"blackbox\\\", phase=\\\"tls\\\"}[5m])\",\n          \"refId\": \"C\",\n    \
    \      \"legendFormat\": \"tls {{endpoint}}\"\n        }\n      ],\n      \"fieldConfig\"\
    : {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"\
    overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n     \
    \     \"displayMode\": \"table\",\n          \"placement\": \"right\",\n     \
    \     \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n      \
    \    ]\n        }\n      }\n    }\n  ],\n  \"schemaVersion\": 41,\n  \"version\"\
    : 1\n}"
