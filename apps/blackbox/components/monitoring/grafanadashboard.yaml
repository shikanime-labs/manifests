apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: blackbox
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: "{\n  \"title\": \"Blackbox\",\n  \"uid\": \"blackbox\",\n  \"timezone\":\
    \ \"utc\",\n  \"refresh\": \"1m\",\n  \"time\": {\n    \"from\": \"now-24h\",\n\
    \    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n  \
    \      \"current\": {\n          \"text\": \"VictoriaMetrics\",\n          \"\
    value\": \"VictoriaMetrics\",\n          \"selected\": true\n        },\n    \
    \    \"hide\": 2,\n        \"includeAll\": false,\n        \"label\": \"Datasource\"\
    ,\n        \"name\": \"datasource\",\n        \"options\": [],\n        \"query\"\
    : \"prometheus\",\n        \"refresh\": 1,\n        \"regex\": \"\",\n       \
    \ \"type\": \"datasource\"\n      }\n    ]\n  },\n  \"panels\": [\n    {\n   \
    \   \"id\": 1,\n      \"type\": \"stat\",\n      \"title\": \"Endpoints up\",\n\
    \      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\":\
    \ \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 4,\n     \
    \   \"w\": 6,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"targets\"\
    : [\n        {\n          \"expr\": \"count(probe_success{job=\\\"blackbox\\\"\
    } == 1)\",\n          \"instant\": true,\n          \"refId\": \"A\"\n       \
    \ }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"\
    thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n\
    \              {\n                \"color\": \"red\",\n                \"value\"\
    : null\n              },\n              {\n                \"color\": \"green\"\
    ,\n                \"value\": 38\n              }\n            ]\n          }\n\
    \        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\":\
    \ 2,\n      \"type\": \"stat\",\n      \"title\": \"Endpoints down now\",\n  \
    \    \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"\
    ${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 4,\n        \"\
    w\": 6,\n        \"x\": 6,\n        \"y\": 0\n      },\n      \"targets\": [\n\
    \        {\n          \"expr\": \"count(probe_success{job=\\\"blackbox\\\"} ==\
    \ 0) or vector(0)\",\n          \"instant\": true,\n          \"refId\": \"A\"\
    \n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n   \
    \       \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"\
    steps\": [\n              {\n                \"color\": \"green\",\n         \
    \       \"value\": null\n              },\n              {\n                \"\
    color\": \"red\",\n                \"value\": 1\n              }\n           \
    \ ]\n          }\n        },\n        \"overrides\": []\n      }\n    },\n   \
    \ {\n      \"id\": 3,\n      \"type\": \"stat\",\n      \"title\": \"Fleet availability\
    \ (30d)\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n     \
    \   \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\"\
    : 4,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 0\n      },\n    \
    \  \"targets\": [\n        {\n          \"expr\": \"avg(avg_over_time(probe_success{job=\\\
    \"blackbox\\\"}[30d])) * 100\",\n          \"instant\": true,\n          \"refId\"\
    : \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\":\
    \ {\n          \"unit\": \"percent\",\n          \"thresholds\": {\n         \
    \   \"mode\": \"absolute\",\n            \"steps\": [\n              {\n     \
    \           \"color\": \"red\",\n                \"value\": null\n           \
    \   },\n              {\n                \"color\": \"yellow\",\n            \
    \    \"value\": 97\n              },\n              {\n                \"color\"\
    : \"green\",\n                \"value\": 99\n              }\n            ]\n\
    \          }\n        },\n        \"overrides\": []\n      }\n    },\n    {\n\
    \      \"id\": 4,\n      \"type\": \"stat\",\n      \"title\": \"Error budget\
    \ consumed (30d, fleet avg)\",\n      \"datasource\": {\n        \"type\": \"\
    prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\"\
    : {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\":\
    \ 0\n      },\n      \"targets\": [\n        {\n          \"expr\": \"clamp_min(100\
    \ - avg(avg_over_time(probe_success{job=\\\"blackbox\\\"}[30d])) * 100, 0)\",\n\
    \          \"instant\": true,\n          \"refId\": \"A\"\n        }\n      ],\n\
    \      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\"\
    ,\n          \"max\": 1,\n          \"thresholds\": {\n            \"mode\": \"\
    absolute\",\n            \"steps\": [\n              {\n                \"color\"\
    : \"green\",\n                \"value\": null\n              },\n            \
    \  {\n                \"color\": \"yellow\",\n                \"value\": 0.5\n\
    \              },\n              {\n                \"color\": \"red\",\n    \
    \            \"value\": 1\n              }\n            ]\n          }\n     \
    \   },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 5,\n\
    \      \"type\": \"row\",\n      \"title\": \"Uptime\",\n      \"gridPos\": {\n\
    \        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 4\n\
    \      },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n\
    \      \"id\": 6,\n      \"type\": \"state-timeline\",\n      \"title\": \"Uptime\
    \ timeline\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n  \
    \      \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"\
    h\": 14,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 5\n      },\n\
    \      \"targets\": [\n        {\n          \"expr\": \"probe_success{job=\\\"\
    blackbox\\\"}\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"\
    {{endpoint}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n      \
    \      \"steps\": [\n              {\n                \"color\": \"red\",\n  \
    \              \"value\": null\n              },\n              {\n          \
    \      \"color\": \"green\",\n                \"value\": 1\n              }\n\
    \            ]\n          }\n        },\n        \"overrides\": []\n      },\n\
    \      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\"\
    ,\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"\
    lastNotNull\"\n          ]\n        }\n      }\n    },\n    {\n      \"id\": 7,\n\
    \      \"type\": \"table\",\n      \"title\": \"Availability (30d SLI, 99% objective)\"\
