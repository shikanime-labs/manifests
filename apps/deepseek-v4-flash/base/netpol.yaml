apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deepseek-v4-flash
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: deepseek-v4-flash-rpc-server
      ports:
        - port: rpc
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: deepseek-v4-flash
      app.kubernetes.io/name: deepseek-v4-flash
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deepseek-v4-flash-rpc-server
spec:
  ingress: []  # ponytail: closed ingress; RPC shard reached only via proxy if needed.
  egress: []   # ponytail: no egress; weights are pre-staged on Longhorn PVC.
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: deepseek-v4-flash-rpc-server
      app.kubernetes.io/name: deepseek-v4-flash-rpc-server
  policyTypes:
    - Ingress
    - Egress
