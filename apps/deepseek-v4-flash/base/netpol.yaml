apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deepseek-v4-flash
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: deepseek-v4-flash
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-agent
      ports:
        - port: 8000
