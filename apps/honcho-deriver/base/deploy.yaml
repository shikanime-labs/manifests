apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-deriver
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: honcho-deriver
      app.kubernetes.io/name: honcho-deriver
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: honcho-deriver
        app.kubernetes.io/name: honcho-deriver
    spec:
      containers:
        - name: deriver
          image: honcho
          command:
            - python
            - -m
            - src.deriver
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 25m
              memory: 363Mi
          env:
            - name: DB_CONNECTION_URI
              value: postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@honcho-postgres.shikanime.svc.cluster.local:5432/$(DB_NAME)
