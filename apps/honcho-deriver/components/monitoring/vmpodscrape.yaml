apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: honcho-deriver
  labels:
    app.kubernetes.io/instance: honcho-deriver
    app.kubernetes.io/name: honcho-deriver
    app.kubernetes.io/part-of: honcho-deriver
spec:
  podMetricsEndpoints:
    - interval: 60s
      path: /metrics
      port: metrics
      scrapeTimeout: 30s
  namespaceSelector:
    matchNames:
      - shikanime
  selector:
    matchLabels:
      app.kubernetes.io/instance: honcho-deriver
      app.kubernetes.io/name: honcho-deriver
