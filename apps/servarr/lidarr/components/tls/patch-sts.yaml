apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lidarr
spec:
  template:
    spec:
      containers:
        - name: lidarr
          livenessProbe:
            httpGet:
              port: https
              scheme: HTTPS
          ports:
            - name: https
              containerPort: 6868
          readinessProbe:
            httpGet:
              port: https
              scheme: HTTPS
          startupProbe:
            httpGet:
              port: https
              scheme: HTTPS
          volumeMounts:
            - name: tls
              mountPath: /etc/ssl/private
              readOnly: true
          env:
            - name: LIDARR__SERVER__ENABLESSL
              value: "True"
            - name: LIDARR__SERVER__SSLCERTPATH
              value: /etc/ssl/private/keystore.p12
            - name: LIDARR__SERVER__SSLCERTPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lidarr-env
                  key: ssl-cert-password
            - name: LIDARR__SERVER__SSLPORT
              value: "9898"
      volumes:
        - name: tls
          secret:
            items:
              - key: keystore.p12
                mode: 416
                path: keystore.p12
            secretName: lidarr-tls
