apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lidarr
spec:
  gatewayClassName: lidarr
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: lidarr-i-shikanime-studio-tls
            group: ""
            kind: Secret
