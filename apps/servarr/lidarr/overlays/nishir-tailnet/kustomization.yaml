resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: lidarr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: lidarr
            sectionName: http
    target:
      name: lidarr-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: lidarr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: lidarr
            sectionName: https
    target:
      name: lidarr
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: library-manager
      app.kubernetes.io/instance: lidarr
      app.kubernetes.io/name: lidarr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 3.1.0
