apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: lidarr-oidc-client
  namespace: shikanime
spec:
  targetRefs:
    - name: lidarr
      kind: HTTPRoute
      group: gateway.networking.k8s.io
  oidc:
    provider:
      issuer: https://accounts.i.shikanime.studio
    clientID: lidarr
    clientSecret:
      name: lidarr-oidc-client
    redirectURL: https://lidarr.i.shikanime.studio/oauth2/callback
