apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lidarr-tls
spec:
  commonName: lidarr
  dnsNames:
    - lidarr
    - lidarr.shikanime
    - lidarr.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: lidarr-pkcs12-password
        key: password
      profile: Modern2023
  secretName: lidarr-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-lidarr
  namespace: shikanime
spec:
  commonName: lidarr.i.shikanime.studio
  dnsNames:
    - lidarr.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-lidarr
  usages:
    - digital signature
    - key encipherment
    - server auth
