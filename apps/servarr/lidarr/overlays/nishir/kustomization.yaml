resources:
  - ../../base
  - cert.yaml
namespace: shikanime
components:
  - ../../components/tls
configurations:
  - namereference.yaml
patches:
  - path: patch-pvc.yaml
  - path: patch-sts.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - lidarr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: lidarr
          sectionName: https
    target:
      kind: HTTPRoute
      name: lidarr
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - lidarr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: lidarr
          sectionName: http
    target:
      kind: HTTPRoute
      name: lidarr-redirect
secretGenerator:
  - name: lidarr-env
    envs:
      - lidarr-env/.enc.env
  - name: lidarr-pkcs12-password
    envs:
      - lidarr-pkcs12-password/.enc.env
