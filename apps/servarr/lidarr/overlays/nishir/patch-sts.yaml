apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lidarr
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: network.speed.2.5g
                    operator: In
                    values:
                      - "true"
              weight: 50
      containers:
        - name: lidarr
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    XML=/config/config.xml
                    [ -f "$XML" ] || exit 0
                    grep -q "<EnableSsl>False</EnableSsl>" "$XML" || exit 0
                    sed -i \
                      -e "s|<EnableSsl>False</EnableSsl>|<EnableSsl>True</EnableSsl>|" \
                      -e "s|<SslCertPath></SslCertPath>|<SslCertPath>${LIDARR__SERVER__SSLCERTPATH}|" \
                      -e "s|<SslCertPassword></SslCertPassword>|<SslCertPassword>${LIDARR__SERVER__SSLCERTPASSWORD}|" \
                      "$XML"
          volumeMounts:
            - name: music-data
              mountPath: /data/music
            - name: downloads-lidarr-data
              mountPath: /downloads/lidarr
              subPath: lidarr
          envFrom:
            - secretRef:
                name: lidarr-env
      volumes:
        - name: music-data
          persistentVolumeClaim:
            claimName: music-data
        - name: downloads-lidarr-data
          persistentVolumeClaim:
            claimName: downloads-lidarr-data
