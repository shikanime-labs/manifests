apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: radarr
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: radarr
  updatePolicy:
    updateMode: InPlace
  resourcePolicy:
    containerPolicies:
    - containerName: radarr
      maxAllowed:
        memory: 4Gi
