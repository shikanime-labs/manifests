resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: radarr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: radarr
            sectionName: http
    target:
      name: radarr-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: radarr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: radarr
            sectionName: https
    target:
      name: radarr
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: library-manager
      app.kubernetes.io/instance: radarr
      app.kubernetes.io/name: radarr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 6.2.1
