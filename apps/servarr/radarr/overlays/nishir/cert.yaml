apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radarr-tls
spec:
  commonName: radarr
  dnsNames:
    - radarr
    - radarr.shikanime
    - radarr.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: radarr-pkcs12-password
        key: password
      profile: Modern2023
  secretName: radarr-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-radarr
  namespace: shikanime
spec:
  commonName: radarr.i.shikanime.studio
  dnsNames:
    - radarr.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-radarr
  usages:
    - digital signature
    - key encipherment
    - server auth
