resources:
  - ../../base
  - cert.yaml
  - securitypolicy.yaml
namespace: shikanime
components:
  - ../../components/tls
configurations:
  - namereference.yaml
patches:
  - path: patch-pvc.yaml
  - path: patch-sts.yaml
  - path: patch-httproute.yaml
secretGenerator:
  - name: whisparr
    files:
      - config.xml=whisparr/config.enc.xml
  - name: whisparr-pkcs12-password
    envs:
      - whisparr-pkcs12-password/.enc.env
  - name: whisparr-oidc-client
    envs:
      - whisparr-oidc-client/.enc.env
