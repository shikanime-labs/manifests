resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - path: patch-httproute-whisparr.yaml
    target:
      name: whisparr
      kind: HTTPRoute
  - path: patch-httproute-whisparr-redirect.yaml
    target:
      name: whisparr-redirect
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: library-manager
      app.kubernetes.io/instance: whisparr
      app.kubernetes.io/name: whisparr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 3-3.1.0.2040
