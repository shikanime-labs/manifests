resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: whisparr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: whisparr
            sectionName: http
    target:
      name: whisparr-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: whisparr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: whisparr
            sectionName: https
    target:
      name: whisparr
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: library-manager
      app.kubernetes.io/instance: whisparr
      app.kubernetes.io/name: whisparr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 3-3.1.0.2040
