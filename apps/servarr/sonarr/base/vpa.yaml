apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: sonarr
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: sonarr
  updatePolicy:
    updateMode: InPlace
  resourcePolicy:
    containerPolicies:
    - containerName: sonarr
      maxAllowed:
        memory: 4Gi
