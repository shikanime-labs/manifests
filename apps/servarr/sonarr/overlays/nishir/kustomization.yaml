resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
  - securitypolicy.yaml
namespace: shikanime
components:
  - ../../components/tls
configurations:
  - namereference.yaml
patches:
  - path: patch-pvc.yaml
  - path: patch-sts.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - sonarr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: sonarr
          sectionName: https
    target:
      name: sonarr
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - sonarr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: sonarr
          sectionName: http
    target:
      name: sonarr-redirect
      kind: HTTPRoute
secretGenerator:
  - name: sonarr-env
    envs:
      - sonarr-env/.enc.env
  - name: sonarr-pkcs12-password
    envs:
      - sonarr-pkcs12-password/.enc.env
  - name: sonarr-oidc-client
    envs:
      - sonarr-oidc-client/.enc.env
