resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: sonarr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: sonarr
            sectionName: http
    target:
      name: sonarr-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: sonarr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: sonarr
            sectionName: https
    target:
      name: sonarr
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: library-manager
      app.kubernetes.io/instance: sonarr
      app.kubernetes.io/name: sonarr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 4.0.19
