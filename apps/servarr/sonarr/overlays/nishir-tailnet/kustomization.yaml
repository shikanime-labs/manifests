resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - path: patch-httproute-sonarr.yaml
    target:
      name: sonarr
      kind: HTTPRoute
  - path: patch-httproute-sonarr-redirect.yaml
    target:
      name: sonarr-redirect
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: library-manager
      app.kubernetes.io/instance: sonarr
      app.kubernetes.io/name: sonarr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 4.0.17
