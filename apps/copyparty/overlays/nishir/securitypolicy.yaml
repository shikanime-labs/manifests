apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: copyparty-oidc
  namespace: shikanime
spec:
  targetRefs:
    - name: copyparty
      kind: HTTPRoute
      group: gateway.networking.k8s.io
  oidc:
    provider:
      issuer: https://accounts.i.shikanime.studio
    clientID: copyparty
    clientSecret:
      name: copyparty-oidc-client
    redirectURL: https://copyparty.i.shikanime.studio/oauth2/callback
    scopes:
      - openid
      - profile
    # Envoy's oauth2 filter deletes the inbound Authorization header by default;
    # forward it so non-browser WebDAV clients carrying credentials still work.
    passThroughAuthHeader: true
    # Re-emit the validated ID token on a dedicated header: this is the only
    # token the jwt provider below can see on browser requests (they carry the
    # Envoy session cookie, not an Authorization header).
    forwardIDToken:
      header: X-Id-Token
  jwt:
    providers:
      - name: authelia
        issuer: https://accounts.i.shikanime.studio
        # Extract from the forwarded ID token — default extraction (Bearer in
        # Authorization) is empty on browser requests, which made jwt_authn
        # reject every browser session with "Jwt is missing".
        extractFrom:
          - name: X-Id-Token
        remoteJWKS:
          uri: https://accounts.i.shikanime.studio/jwks.json
        audiences:
          - copyparty
        claimToHeaders:
          - claim: preferred_username
            header: X-WEBAUTH-USER
