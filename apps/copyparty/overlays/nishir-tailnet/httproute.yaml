apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty-tailnet
spec:
  hostnames:
    - copyparty.taila659a.ts.net
  parentRefs:
    - name: copyparty
      sectionName: https
  rules:
    - backendRefs:
        - name: copyparty
          port: 3923
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Id-Token
              - X-WEBAUTH-USER
      timeouts:
        request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty-tailnet-sso
spec:
  hostnames:
    - copyparty.taila659a.ts.net
  parentRefs:
    - name: copyparty
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - type: RegularExpression
              name: Cookie
              value: '.*(^|; *)(OauthHMAC|OauthExpires|IdToken|AccessToken)-[^=;]+=[^;]*.*'
        - path:
            type: PathPrefix
            value: /
          queryParams:
            - type: RegularExpression
              name: h
              value: '.*'
        - path:
            type: Exact
            value: /oauth2/callback
        - path:
            type: Exact
            value: /oauth2/logout
      backendRefs:
        - name: copyparty
          port: 3923
      timeouts:
        request: 0s
