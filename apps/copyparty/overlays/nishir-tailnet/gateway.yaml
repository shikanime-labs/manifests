apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: copyparty
spec:
  gatewayClassName: copyparty
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: copyparty-i-shikanime-studio-tls
            group: ""
            kind: Secret
    - name: ftp-control
      port: 21
      protocol: TCP
    - name: ftps
      port: 990
      protocol: TCP
    - name: sftp
      port: 22
      protocol: TCP
