resources:
  - ../nishir
  - gatewayclass.yaml
namespace: shikanime
configMapGenerator:
  - name: copyparty
    files:
      - ./copyparty/config.conf
secretGenerator:
  - name: copyparty-oidc
    envs:
      - ./copyparty-oidc/.enc.env
    options:
      disableNameSuffixHash: true
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: file-server
      app.kubernetes.io/instance: copyparty
      app.kubernetes.io/name: copyparty
      app.kubernetes.io/part-of: nishir-operation
      app.kubernetes.io/version: 1.20.18
patches:
  - path: patch-netpol.yaml
    target:
      name: copyparty
      version: v1
      kind: NetworkPolicy
