resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
configMapGenerator:
  - name: copyparty
    files:
      - ./copyparty/config.conf
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: file-server
      app.kubernetes.io/instance: copyparty
      app.kubernetes.io/name: copyparty
      app.kubernetes.io/part-of: nishir-operation
      app.kubernetes.io/version: 1.20.18
patches:
  - path: patch-httproute-copyparty.yaml
    target:
      name: copyparty
      kind: HTTPRoute
  - path: patch-httproute-copyparty-redirect.yaml
    target:
      name: copyparty-redirect
      kind: HTTPRoute
