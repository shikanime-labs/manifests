[global]
  # System settings
  ansi
  hist: /cfg/hists/
  name: copyparty
  no-fpool
  no-robots
  shr: /share
  write-uplog

  # 4MB buffer for file transfers
  iobuf: 4194304

  # Auto-detect number of CPU cores for jobs
  j: 0

  # TLS — cert+key combined PEM (mounted from the copyparty-tls secret)
  cert: /cfg/copyparty/cert.pem

  # Auth — Envoy OIDC identity headers
  ah-alg: argon2
  dav-auth
  # Envoy SecurityPolicy validates the authelia ID token and emits
  # X-WEBAUTH-USER (preferred_username claim); [groups] maps identities below.
  idp-h-usr: X-WEBAUTH-USER
  idp-login: /?h
  idp-logout: /oauth2/logout

  # Reverse Proxy — Envoy is the single trusted proxy hop (rproxy: 1);
  # real client IP is read from x-forwarded-for
  rproxy: 1
  xff-hdr: x-forwarded-for
  xff-src: 127.0.0.1, 169.254.0.0/16, 10.244.0.0/16

  # FTP/SFTP settings
  ftp: 3921
  ftps: 3990
  ftp-nat: 100.68.52.27
  ftp-pr: 12000-12058
  sftp: 3922
  sftp-pw
  sftp-key: shikanime.deva ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH+tp1Xfz7NomHCZuDPlfj3XW5hm9t0TiCyEeudRraoe

# DAV/FTP/SFTP basic-auth accounts (IdP headers only cover HTTP through the
# gateway); hashes are argon2 over the live ah-salt, rotate via the pwhash recipe
[accounts]
  shikanime.deva: +5xdG2Xr8PyAApWi9_qmtugW0kpwTQ9ZB
  meika.deva: +tC3rEhguNSLKMcpIqbyyX7cjTZ7_uoYq
  automata: +PgwYHKGdv8TPFcx623-SW88HzgEtYjsS

[groups]
  users: shikanime.deva
  users: meika.deva
  users: automata
  admins: admin

[/]
  /data
  accs:
    r: @users
    ra.: @admins

[/archives]
  /data/archives
  accs:
    rwmd: @users
    rwmda.: @admins
  flags:
    dedup
    e2dsa
    e2ts
    reflink

