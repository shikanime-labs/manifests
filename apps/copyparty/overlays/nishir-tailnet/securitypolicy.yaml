# Tailscale Funnel auth gate for copyparty: the Tailscale operator injects
# Tailscale-User-L on requests forwarded from the LB to the backend when
# tailscale.com/auth: "true" is set on the EnvoyProxy service annotations.
# Envoy Gateway checks for the presence of that header via CEL; requests
# without it are denied (fail-closed). copyparty reads the same header via
# idp-h-usr to establish user identity.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: copyparty-tailscale-auth
spec:
  targetRefs:
    - name: copyparty
      group: gateway.networking.k8s.io
      kind: HTTPRoute
  authorization:
    defaultAction: Deny
    rules:
      - name: tailscale-authenticated
        action: Allow
        cel:
          expression: has(request.headers['Tailscale-User-L'])
