# OIDC SSO gate for copyparty: Envoy redirects browsers to Dex
# (https://accounts.i.shikanime.studio, backed by LLDAP) and only forwards
# authenticated requests to the copyparty backend. The ID token is forwarded
# upstream in x-dex-id-token; the JWT filter then extracts the email claim
# into x-webauth-user, which copyparty reads via idp-h-usr. The client secret
# apps/dex/overlays/nishir-tailnet/dex/config.enc.yaml.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: copyparty-oidc
spec:
  targetRefs:
    - name: copyparty
      group: gateway.networking.k8s.io
      kind: HTTPRoute
  oidc:
    provider:
      issuer: https://accounts.i.shikanime.studio
    clientID: copyparty
    clientSecret:
      name: copyparty-oidc
      group: ""
      kind: Secret
    redirectURL: https://copyparty.i.shikanime.studio/oauth2/callback
    logoutPath: /logout
    forwardIDToken:
      header: x-dex-id-token
  jwt:
    providers:
      - name: dex
        issuer: https://accounts.i.shikanime.studio
        extractFrom:
          headers:
            - name: x-dex-id-token
        remoteJWKS:
          uri: https://accounts.i.shikanime.studio/keys
        claimToHeaders:
          - header: x-webauth-user
            claim: email
