---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty
spec:
  rules:
    - backendRefs:
        - name: copyparty
          port: 3923
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Id-Token
              - X-WEBAUTH-USER
      # mid-body.
      timeouts:
        request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty-health
spec:
  rules:
    - matches:
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: copyparty
          port: 3923
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Id-Token
              - X-WEBAUTH-USER
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty-redirect
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copyparty-sso
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: Cookie
              type: RegularExpression
              value: ".*(^|; *)(OauthHMAC|OauthExpires|IdToken|AccessToken)-[^=;]+=[^;]*.*"
        - path:
            type: PathPrefix
            value: /
          queryParams:
            - name: h
              type: RegularExpression
              value: ".*"
        - path:
            type: Exact
            value: /oauth2/callback
        - path:
            type: Exact
            value: /oauth2/logout
      backendRefs:
        - name: copyparty
          port: 3923
      timeouts:
        request: 0s
