apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: copyparty
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: copyparty
      app.kubernetes.io/name: copyparty
  serviceName: copyparty
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: copyparty
        app.kubernetes.io/name: copyparty
    spec:
      containers:
        - name: copyparty
          image: copyparty
          livenessProbe:
            httpGet:
              path: /?reset=/._
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 5
          ports:
            - name: http
              containerPort: 3923
          readinessProbe:
            httpGet:
              path: /?reset=/._
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 180
            httpGet:
              path: /?reset=/._
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /cfg
            - name: startup-config
              mountPath: /cfg/config.conf
              readOnly: true
              subPath: config.conf
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: copyparty-config
        - name: startup-config
          configMap:
            name: copyparty
