apiVersion: v1
kind: Service
metadata:
  name: blocky
spec:
  selector:
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/name: blocky
  ports:
    - name: dns-udp
      appProtocol: dns
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dns
      appProtocol: dns
      port: 53
      targetPort: dns
    - name: http
      appProtocol: http
      port: 4000
      targetPort: http
