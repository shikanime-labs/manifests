apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blocky
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: dns-udp
        - port: dns
        - port: http
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: blocky
      app.kubernetes.io/name: blocky
  policyTypes:
    - Ingress
