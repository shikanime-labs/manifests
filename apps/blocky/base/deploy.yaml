apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: blocky
      app.kubernetes.io/name: blocky
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: blocky
        app.kubernetes.io/name: blocky
    spec:
      containers:
        - name: blocky
          image: blocky
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns
              protocol: TCP
              containerPort: 53
            - name: http
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
