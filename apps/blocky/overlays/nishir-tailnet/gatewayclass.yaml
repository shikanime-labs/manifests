---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: blocky
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    name: blocky
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    namespace: shikanime
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: blocky
  namespace: shikanime
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      envoyService:
        name: blocky
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: blocky
          tailscale.com/tags: "tag:blocky"
