upstreams:
  strategy: strict
  groups:
    default:
      - https://dns.adguard-dns.com/dns-query
      - https://dns.quad9.net/dns-query
      - https://security.cloudflare-dns.com/dns-query
conditional:
  mapping:
    # Node-local MagicDNS: blocky runs hostNetwork on the tailscale-equipped
    # nodes, so 100.100.100.100 is reachable and answers *.taila659a.ts.net
    # with real tailnet IPs. Public upstreams cannot resolve these names.
    taila659a.ts.net: 100.100.100.100
blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    fakenews:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews/hosts
  clientGroupsBlock:
    default:
      - ads
      - fakenews
ports:
  dns: 5353
  http: 4000
prometheus:
  enable: true
redis:
  address: blocky-valkey.shikanime.svc.cluster.local:6379
  required: true
