---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-dns
  namespace: shikanime
spec:
  commonName: dns.i.shikanime.studio
  dnsNames:
    - dns.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-dns
  usages:
    - digital signature
    - key encipherment
    - server auth
