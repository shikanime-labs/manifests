apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: blocky
spec:
  gatewayClassName: blocky
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: studio-shikanime-i-ns
            group: ""
            kind: Secret
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns
      port: 53
      protocol: TCP
