apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shikanime
resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
components:
  - ../../components/tls
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - authelia.i.shikanime.studio
        - accounts.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: authelia
          sectionName: https
    target:
      kind: HTTPRoute
      name: authelia
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - authelia.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: authelia
          sectionName: http
    target:
      kind: HTTPRoute
      name: authelia-redirect
  - path: patch-pvc.yaml
secretGenerator:
  - name: authelia
    files:
      - authelia/configuration.enc.yaml
