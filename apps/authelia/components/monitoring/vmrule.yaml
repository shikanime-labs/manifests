spec:
  groups:
    - name: authelia
      rules:
        - alert: AutheliaDown
          expr: up{job="authelia"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Authelia has been down for 2 minutes
        - alert: AutheliaHigh5xxRate
          expr: sum(rate(authelia_request{code=~"5.."}[5m])) by (job) / sum(rate(authelia_request[5m])) by (job) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Authelia 5xx response rate above 5% for 10 minutes
        - alert: AutheliaOIDCSlow
          expr: histogram_quantile(0.99, sum(rate(authelia_request_duration_openid_connect_bucket[5m])) by (le)) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Authelia OIDC p99 latency above 1s for 10 minutes
