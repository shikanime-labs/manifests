apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authelia
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: authelia
      app.kubernetes.io/name: authelia
  serviceName: authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: authelia
        app.kubernetes.io/name: authelia
    spec:
      containers:
        - name: authelia
          image: authelia
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
          ports:
            - name: http
              containerPort: 9091
            - name: metrics
              containerPort: 9959
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config-secret
              readOnly: true
            - name: data
              mountPath: /config
          env:
            - name: X_AUTHELIA_CONFIG_FILTER
              value: "template"
            - name: X_AUTHELIA_CONFIG_FILE
              value: /config-secret/configuration.enc.yaml
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: config
          secret:
            secretName: authelia
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        resources:
          requests:
            storage: 512Mi
        volumeMode: Filesystem
        accessModes:
          - ReadWriteOncePod
