apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: authelia
      app.kubernetes.io/name: authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: authelia
        app.kubernetes.io/name: authelia
    spec:
      priorityClassName: shikanime-critical
      containers:
        - name: authelia
          image: authelia
          args:
            - --config
            - /config/configuration.yaml
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
          ports:
            - name: http
              containerPort: 9091
            - name: metrics
              containerPort: 9959
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
          env:
            - name: X_AUTHELIA_CONFIG_FILTER
              value: template
          resources:
            requests:
              cpu: 25m
              memory: 250Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
