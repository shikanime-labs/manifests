apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-ml
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  serviceName: immich-ml
  selector:
    matchLabels:
      app.kubernetes.io/instance: immich-ml
      app.kubernetes.io/name: immich-ml
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: immich-ml
        app.kubernetes.io/name: immich-ml
    spec:
      containers:
        - name: immich-ml
          image: immich-machine-learning
          env:
            - name: TZ
              value: Europe/Paris
            - name: IMMICH_MACHINE_LEARNING_PORT
              value: "3003"
          livenessProbe:
            initialDelaySeconds: 30
            tcpSocket:
              port: http
            timeoutSeconds: 5
          ports:
            - name: http
              containerPort: 3003
          readinessProbe:
            initialDelaySeconds: 10
            tcpSocket:
              port: http
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 60
            tcpSocket:
              port: http
            timeoutSeconds: 5
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: cache-huggingface
              mountPath: /root/.cache/huggingface
            - name: cache-matplotlib
              mountPath: /root/.cache/matplotlib
            - name: config-matplotlib
              mountPath: /root/.config/matplotlib
      volumes:
        - name: config-matplotlib
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        resources:
          requests:
            storage: 16Gi
        volumeMode: Filesystem
        storageClassName: nishir-ephemeral
        accessModes:
          - ReadWriteOncePod
    - metadata:
        name: cache-huggingface
      spec:
        resources:
          requests:
            storage: 512Mi
        volumeMode: Filesystem
        storageClassName: nishir-ephemeral
        accessModes:
          - ReadWriteOncePod
    - metadata:
        name: cache-matplotlib
      spec:
        resources:
          requests:
            storage: 512Mi
        volumeMode: Filesystem
        storageClassName: nishir-ephemeral
        accessModes:
          - ReadWriteOncePod
