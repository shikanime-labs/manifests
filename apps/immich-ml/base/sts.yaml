apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: immich-ml
      app.kubernetes.io/name: immich-ml
  serviceName: immich-ml
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: immich-ml
        app.kubernetes.io/name: immich-ml
    spec:
      containers:
        - name: immich-ml
          image: immich-machine-learning
          env:
            - name: TZ
              value: Europe/Paris
            - name: IMMICH_MACHINE_LEARNING_PORT
              value: "3003"
          livenessProbe:
            initialDelaySeconds: 30
            tcpSocket:
              port: http
            timeoutSeconds: 5
          ports:
            - name: http
              containerPort: 3003
          readinessProbe:
            initialDelaySeconds: 10
            tcpSocket:
              port: http
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 60
            tcpSocket:
              port: http
            timeoutSeconds: 5
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir: {}
