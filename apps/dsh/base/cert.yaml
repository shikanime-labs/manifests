apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-dsh
  namespace: shikanime
spec:
  commonName: chat.i.shikanime.studio
  dnsNames:
    - chat.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-dsh
  usages:
    - digital signature
    - key encipherment
    - server auth
