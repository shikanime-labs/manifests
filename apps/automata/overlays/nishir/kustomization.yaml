resources:
  - ../../base
  - cert.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: automata
          sectionName: https
      - op: replace
        path: /spec/rules/0/backendRefs
        value:
        - name: automata
          port: 9119
    target:
      name: automata-dashboard
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - api.automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: automata
          sectionName: https
      - op: replace
        path: /spec/rules/0/backendRefs
        value:
        - name: automata
          port: 8642
    target:
      name: automata-api-server
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - a2a.automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: automata
          sectionName: https
      - op: replace
        path: /spec/rules/0/backendRefs
        value:
        - name: automata
          port: 9900
    target:
      name: automata-a2a
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: automata
          sectionName: https
    target:
      name: automata-webhook
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: automata
          sectionName: http
    target:
      name: automata-dashboard-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - api.automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: automata
          sectionName: http
    target:
      name: automata-api-server-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - a2a.automata.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: automata
          sectionName: http
    target:
      name: automata-a2a-redirect
      kind: HTTPRoute
