apiVersion: pool.kubevirt.io/v1beta1
kind: VirtualMachinePool
metadata:
  name: automata
spec:
  virtualMachineTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: rootdisk
              containerDisk:
                image: ghcr.io/shikanime-labs/machines/automata:dabebdf3@sha256:58220d987188a7415f8353d46c809d945de2e8eeb3153bac097864a3fd7f8ac2
            - name: workspaces
              dataVolume:
                name: workspaces
            - name: sops-key
              secret:
                secretName: automata-sops-key
            - name: cloudinit
              cloudInitNoCloud:
                secretRef:
                  name: automata-authorized-keys
            - name: serviceaccount
              serviceAccount:
                serviceAccountName: automata
