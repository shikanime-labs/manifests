apiVersion: pool.kubevirt.io/v1beta1
kind: VirtualMachinePool
metadata:
  name: automata
spec:
  virtualMachineTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: rootdisk
              containerDisk:
                image: ghcr.io/shikanime-labs/machines/automata:b9c7ea9b@sha256:d30d0a26cdd99015a6ac33c55a502e91d41c1bcfd56bb50d3c5ebe3e456d5150
            - name: workspaces
              dataVolume:
                name: workspaces
            - name: sops-key
              secret:
                secretName: automata-sops-key
            - name: cloudinit
              cloudInitNoCloud:
                secretRef:
                  name: automata-authorized-keys
            - name: serviceaccount
              serviceAccount:
                serviceAccountName: automata
