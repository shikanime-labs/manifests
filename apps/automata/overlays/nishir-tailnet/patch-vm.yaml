apiVersion: pool.kubevirt.io/v1beta1
kind: VirtualMachinePool
metadata:
  name: automata
spec:
  virtualMachineTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: rootdisk
              containerDisk:
                image: ghcr.io/shikanime-labs/machines/automata:v1.0.2-11-gb0ccdf06@sha256:b00004671bfa705643790a60de80939d0e214a5b6c262b9b6b5e2a880259a71b
            - name: workspaces
              dataVolume:
                name: workspaces
            - name: sops-key
              secret:
                secretName: automata-sops-key
            - name: cloudinit
              cloudInitNoCloud:
                secretRef:
                  name: automata-authorized-keys
            - name: serviceaccount
              serviceAccount:
                serviceAccountName: automata
