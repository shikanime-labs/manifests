apiVersion: pool.kubevirt.io/v1beta1
kind: VirtualMachinePool
metadata:
  name: automata
spec:
  virtualMachineTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: rootdisk
              containerDisk:
                image: ghcr.io/shikanime-labs/machines/automata:5d908e3f@sha256:13bf1fd3d8c8858a16c261f056f8da3eb3aadf9af55ebbdea6d60999d699a115
            - name: workspaces
              dataVolume:
                name: workspaces
            - name: sops-key
              secret:
                secretName: automata-sops-key
            - name: cloudinit
              cloudInitNoCloud:
                secretRef:
                  name: automata-authorized-keys
            - name: serviceaccount
              serviceAccount:
                serviceAccountName: automata
