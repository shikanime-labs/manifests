apiVersion: pool.kubevirt.io/v1beta1
kind: VirtualMachinePool
metadata:
  name: automata
spec:
  virtualMachineTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: rootdisk
              containerDisk:
                image: ghcr.io/shikanime-labs/machines/automata:v1.0.2-18-gc02d53c9-dirty@sha256:113f2d509508f17e0860402455befe9f7939130ad8039ddd9801e3de89bdc7be
            - name: workspaces
              dataVolume:
                name: workspaces
            - name: sops-key
              secret:
                secretName: automata-sops-key
            - name: cloudinit
              cloudInitNoCloud:
                secretRef:
                  name: automata-authorized-keys
            - name: serviceaccount
              serviceAccount:
                serviceAccountName: automata
