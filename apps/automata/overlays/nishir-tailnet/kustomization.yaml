resources:
  - ../nishir
  - gatewayclass.yaml
  - netpol.yaml
  - netpol-cdi-upload.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/virtualMachineTemplate/spec/template/spec/volumes/2
        value:
          name: sops-key
          secret:
            secretName: automata-sops-key
    target:
      name: automata
      kind: VirtualMachinePool
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
          - name: automata
            sectionName: ssh
    target:
      name: automata-ssh
      kind: TCPRoute
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
          - name: automata
            sectionName: a2a
    target:
      name: automata-a2a
      kind: TCPRoute
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
          - name: automata
            sectionName: mdns
    target:
      name: automata-mdns
      kind: UDPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: automata.taila659a.ts.net
    target:
      name: automata-dashboard
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: automata.taila659a.ts.net
    target:
      name: automata-dashboard-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: api.automata.taila659a.ts.net
    target:
      name: automata-api-server
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: api.automata.taila659a.ts.net
    target:
      name: automata-api-server-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: a2a.automata.taila659a.ts.net
    target:
      name: automata-a2a
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: a2a.automata.taila659a.ts.net
    target:
      name: automata-a2a-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: automata.taila659a.ts.net
    target:
      name: automata-webhook
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: automata-webhook.taila659a.ts.net
    target:
      name: automata-webhook
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: backend-service
      app.kubernetes.io/instance: automata
      app.kubernetes.io/name: automata
      app.kubernetes.io/part-of: telsha-workstation
      app.kubernetes.io/version: latest
secretGenerator:
  - name: automata-sops-key
    envs:
      - sops-key/.enc.env
