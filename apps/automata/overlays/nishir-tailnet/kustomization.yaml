resources:
  - ../nishir
  - gatewayclass.yaml
  - netpol.yaml
namespace: shikanime
patches:
  - path: patch-svc.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: a2a.automata.taila659a.ts.net
    target:
      name: hermes-agent-a2a-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: a2a.automata.taila659a.ts.net
    target:
      name: hermes-agent-a2a
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: api.automata.taila659a.ts.net
    target:
      name: hermes-agent-api-server-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: api.automata.taila659a.ts.net
    target:
      name: hermes-agent-api-server
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: automata.taila659a.ts.net
    target:
      name: hermes-agent-webhook
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: automata.taila659a.ts.net
    target:
      name: hermes-agent-dashboard-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: automata.taila659a.ts.net
    target:
      name: hermes-agent-dashboard
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: backend-service
      app.kubernetes.io/instance: automata
      app.kubernetes.io/name: automata
      app.kubernetes.io/part-of: telsha-workstation
      app.kubernetes.io/version: latest
secretGenerator:
  - name: automata-sops-key
    envs:
      - sops-key/.enc.env
