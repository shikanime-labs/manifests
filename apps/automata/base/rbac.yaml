apiVersion: v1
kind: ServiceAccount
metadata:
  name: automata
  labels:
    app.kubernetes.io/instance: automata
    app.kubernetes.io/name: automata
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: automata-flux-reader
rules:
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: automata-flux-reader
  namespace: shikanime
subjects:
  - kind: ServiceAccount
    name: automata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: automata-flux-reader
