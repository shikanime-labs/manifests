      - op: replace
        path: /spec/virtualMachineTemplate/spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/automata:1769d9ef@sha256:25ff60ad8e030ebe8fd692d8e588ec4556ecbaaaad5534d88e2c74c32243f869
    target:
      name: automata
      kind: VirtualMachinePool
