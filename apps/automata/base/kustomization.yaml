resources:
  - httproutes.yaml
  - pvc.yaml
  - svc.yaml
  - vm.yaml
secretGenerator:
  - name: automata-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
configurations:
  - namereference.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/automata:latest@sha256:d37b6ff5ca7224b68ab0406d4978bf57e518305a0d7fd2ec8fc52809623e96d7
    target:
      name: automata
      kind: VirtualMachine
