resources:
  - httproutes.yaml
  - pvc.yaml
  - svc.yaml
  - vm.yaml
secretGenerator:
  - name: automata-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
configurations:
  - namereference.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/automata:latest@sha256:dcf04db185aca51ffd27d87ae6a462ec23495202d4e2fb487c2bd503f9bc475e
    target:
      name: automata
      kind: VirtualMachine
