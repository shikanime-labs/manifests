resources:
  - httproutes.yaml
  - pvc.yaml
  - rbac.yaml
  - svc.yaml
  - vmpool.yaml
configurations:
  - namereference.yaml
secretGenerator:
  - name: automata-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
patches:
  - patch: |-
      - op: replace
        path: /spec/virtualMachineTemplate/spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/automata:v1.0.2-13-g85907535@sha256:6cdbac2f7d04f1e09594ae10daf73a00be3e592bc294e29bfbc75a7162757191
    target:
      name: automata
      kind: VirtualMachinePool
