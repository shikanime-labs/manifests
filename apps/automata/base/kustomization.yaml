resources:
  - httproutes.yaml
  - pvc.yaml
  - rbac.yaml
  - svc.yaml
  - vmpool.yaml
secretGenerator:
  - name: automata-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
configurations:
  - namereference.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/virtualMachineTemplate/spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/automata:56e9ceb1@sha256:56e9ceb147fd7917415dfc4be97a086b21b3556c6acd382b07f7b8e1022f0950
    target:
      name: automata
      kind: VirtualMachinePool
