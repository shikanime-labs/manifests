  - pvc.yaml
  - rbac.yaml
  - svc.yaml
  - vmpool.yaml
secretGenerator:
  - name: automata-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
configurations:
  - namereference.yaml
patches:
