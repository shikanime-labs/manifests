resources:
  - httproutes.yaml
  - pvc.yaml
  - rbac.yaml
  - svc.yaml
  - vmpool.yaml
configurations:
  - namereference.yaml
secretGenerator:
  - name: automata-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
patches:
  - patch: |-
      - op: replace
        path: /spec/virtualMachineTemplate/spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/automata:v1.0.2-11-gb0ccdf06@sha256:b00004671bfa705643790a60de80939d0e214a5b6c262b9b6b5e2a880259a71b
    target:
      name: automata
      kind: VirtualMachinePool
