resources:
  - httproutes.yaml
  - pvc.yaml
  - rbac.yaml
  - svc.yaml
  - vmpool.yaml
secretGenerator:
  - name: automata-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
configurations:
  - namereference.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/virtualMachineTemplate/spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/automata:5d908e3f@sha256:13bf1fd3d8c8858a16c261f056f8da3eb3aadf9af55ebbdea6d60999d699a115
    target:
      name: automata
      kind: VirtualMachinePool
