resources:
  - httproutes.yaml
  - pvc.yaml
  - rbac.yaml
  - svc.yaml
  - vmpool.yaml
secretGenerator:
  - name: automata-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
configurations:
  - namereference.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/virtualMachineTemplate/spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/automata:c80645b1@sha256:c80645b1c190bebc84f51c5f37a7c656221b2939c9d046b40ccd126069ac3e7c
    target:
      name: automata
      kind: VirtualMachinePool
