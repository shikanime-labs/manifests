apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ds4-coordinator
spec:
  serviceName: ds4-coordinator
  replicas: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: ds4-coordinator
      app.kubernetes.io/name: ds4-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ds4-coordinator
        app.kubernetes.io/name: ds4-coordinator
      annotations:
        k8s.v1.cni.cncf.io/networks: shikanime/ds4-coordinator
    spec:
      nodeSelector:
        kubernetes.io/hostname: kushira
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: fetch
          image: huggingface
          workingDir: /models
          command:
            - hf
            - download
            - antirez/deepseek-v4-gguf
            - --include
            - "DeepSeek-V4-Flash-Q4KExperts-F16HC-F16Compressor-F16Indexer-Q8Attn-Q8Shared-Q8Out-chat-v2.gguf"
            - --local-dir
            - /models/deepseek-v4-flash
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: models
              mountPath: /models/deepseek-v4-flash
              subPath: deepseek-v4-flash
            - name: cache-huggingface
              mountPath: /home/huggingface/.cache/huggingface
          envFrom:
            - secretRef:
                name: ds4-env
      containers:
        - name: ds4
          image: ds4
          command:
            - ds4-server
          args:
            - -m
            - /models/deepseek-v4-flash/DeepSeek-V4-Flash-Q4KExperts-F16HC-F16Compressor-F16Indexer-Q8Attn-Q8Shared-Q8Out-chat-v2.gguf
            - --role
            - coordinator
            - --layers
            - 0:19
            - --listen
            - 0.0.0.0
            - "9911"
            - --ctx
            - "1048576"
            - --host
            - 0.0.0.0
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          ports:
            - name: http
              containerPort: 8000
            - name: pipeline
              containerPort: 9911
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 120
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-dri
              mountPath: /dev/dri
      volumes:
        - name: cache-huggingface
          hostPath:
            type: DirectoryOrCreate
            path: /var/lib/ds4/cache
        - name: models
          hostPath:
            type: DirectoryOrCreate
            path: /var/lib/ds4/models
        - name: dev-kfd
          hostPath:
            type: CharDevice
            path: /dev/kfd
        - name: dev-dri
          hostPath:
            type: Directory
            path: /dev/dri
