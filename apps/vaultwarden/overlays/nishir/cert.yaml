---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-tls
spec:
  commonName: vaultwarden
  dnsNames:
    - vaultwarden
    - vaultwarden.shikanime
    - vaultwarden.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  secretName: vaultwarden-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-vaultwarden
  namespace: shikanime
spec:
  commonName: vaultwarden.i.shikanime.studio
  dnsNames:
    - vaultwarden.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-vaultwarden
  usages:
    - digital signature
    - key encipherment
    - server auth
