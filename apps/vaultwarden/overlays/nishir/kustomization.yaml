resources:
  - ../../base
  - backendtlspolicy.yaml
  - cert.yaml
  - gateway.yaml
namespace: shikanime
components:
  - ../../components/tls
patches:
  - patch: "- op: add\n  path: /spec/hostnames\n  value:\n  - vaultwarden.i.shikanime.studio\n- op: add\n  path: /spec/parentRefs\n  value:\n  - name: vaultwarden\n    sectionName: https"
    target:
      name: vaultwarden
      kind: HTTPRoute
  - patch: "- op: add\n  path: /spec/hostnames\n  value:\n  - vaultwarden.i.shikanime.studio\n- op: add\n  path: /spec/parentRefs\n  value:\n  - name: vaultwarden\n    sectionName: http"
    target:
      name: vaultwarden-redirect
      kind: HTTPRoute
secretGenerator:
  - name: vaultwarden
    envs:
      - vaultwarden/.enc.env
