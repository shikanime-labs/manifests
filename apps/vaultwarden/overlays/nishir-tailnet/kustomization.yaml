resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - backendtlspolicy.yaml
namespace: shikanime
patches:
  - path: patch-httproute-vaultwarden.yaml
    target:
      name: vaultwarden
      kind: HTTPRoute
  - path: patch-httproute-vaultwarden-redirect.yaml
    target:
      name: vaultwarden-redirect
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: secret-manager
      app.kubernetes.io/instance: vaultwarden
      app.kubernetes.io/name: vaultwarden
      app.kubernetes.io/part-of: nishir-security
      app.kubernetes.io/version: 1.37.0
