resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - backendtlspolicy.yaml
namespace: shikanime
patches:
  - target:
      name: vaultwarden
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [vaultwarden.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: vaultwarden
            sectionName: https
  - target:
      name: vaultwarden-redirect
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [vaultwarden.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: vaultwarden
            sectionName: http
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: secret-manager
      app.kubernetes.io/instance: vaultwarden
      app.kubernetes.io/name: vaultwarden
      app.kubernetes.io/part-of: nishir-security
      app.kubernetes.io/version: 1.37.0
