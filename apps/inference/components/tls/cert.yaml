apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: inference-tls
spec:
  commonName: inference
  dnsNames:
    - inference
    - inference.shikanime
    - inference.shikanime.svc.cluster.local
    # Tailscale operator hostname (envoyService annotation); the operator is
    # an L4 passthrough, so this cert also serves the tailnet name.
    - inference.taila659a.ts.net
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  secretName: inference-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
