apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shikanime
resources:
- ../../base
secretGenerator:
- name: inference-nous
  namespace: shikanime
  options:
    disableNameSuffixHash: true
  envs:
  - inference-nous/.enc.env
- name: inference-openrouter
  namespace: shikanime
  options:
    disableNameSuffixHash: true
  envs:
  - inference-openrouter/.enc.env
components:
- ../../components/tls
