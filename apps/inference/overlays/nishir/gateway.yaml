apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference
  annotations:
    external-dns.alpha.kubernetes.io/target: inference-gateway.taila659a.ts.net
    aigateway.envoyproxy.io/gateway-config: inference
spec:
  gatewayClassName: inference
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: studio-shikanime-i-inference
