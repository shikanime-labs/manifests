nameReference:
  - version: v1
    kind: Secret
    fieldSpecs:
      - kind: BackendSecurityPolicy
        path: spec/apiKey/secretRef/name
        group: aigateway.envoyproxy.io
      - kind: BackendSecurityPolicy
        path: spec/anthropicAPIKey/secretRef/name
        group: aigateway.envoyproxy.io
      - kind: MCPRoute
        path: spec/backendRefs/securityPolicy/apiKey/secretRef/name
        group: aigateway.envoyproxy.io
      - kind: HTTPRouteFilter
        path: spec/credentialInjection/credential/valueRef/name
        group: gateway.envoyproxy.io
      - kind: SecurityPolicy
        path: spec/apiKeyAuth/credentialRefs/name
        group: gateway.envoyproxy.io
      - kind: SecurityPolicy
        path: spec/oidc/clientSecret/name
        group: gateway.envoyproxy.io
