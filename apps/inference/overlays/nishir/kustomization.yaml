resources:
  - ../../base
  - cert.yaml
  - clienttrafficpolicy.yaml
  - gateway.yaml
  - gatewayconfig.yaml
  - securitypolicy.yaml
namespace: shikanime
configurations:
  - namereference.yaml
secretGenerator:
  - name: z-ai-key
    namespace: shikanime
    envs:
      - z-ai-key/.enc.env
  - name: nous-key
    namespace: shikanime
    envs:
      - nous-key/.enc.env
  - name: openrouter-key
    namespace: shikanime
    envs:
      - openrouter-key/.enc.env
  - name: mistral-key
    namespace: shikanime
    envs:
      - mistral-key/.enc.env
  - name: inference-key
    namespace: shikanime
    envs:
      - inference-key/.enc.env
patches:
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
          - name: inference
            kind: Gateway
            group: gateway.networking.k8s.io
    target:
      name: default
      version: v1beta1
      group: aigateway.envoyproxy.io
      kind: AIGatewayRoute
