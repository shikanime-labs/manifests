resources:
  - ../../base
  - cert.yaml
  - clienttrafficpolicy.yaml
  - gateway.yaml
  - gatewayconfig.yaml
  - securitypolicy.yaml
namespace: shikanime
configurations:
  - namereference.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: inference
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: "3.8"
secretGenerator:
  - name: llama-cpp-oidc-client
    envs:
      - llama-cpp-oidc-client/.enc.env
  - name: z-ai-key
    namespace: shikanime
    envs:
      - z-ai-key/.enc.env
  - name: nous-key
    namespace: shikanime
    envs:
      - nous-key/.enc.env
  - name: openrouter-key
    namespace: shikanime
    envs:
      - openrouter-key/.enc.env
  - name: mistral-key
    namespace: shikanime
    envs:
      - mistral-key/.enc.env
  - name: inference-key
    namespace: shikanime
    envs:
      - inference-key/.enc.env
patches:
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
          - name: inference
            kind: Gateway
            group: gateway.networking.k8s.io
    target:
      name: default
      version: v1beta1
      group: aigateway.envoyproxy.io
      kind: AIGatewayRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - chat.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
          - name: llama-cpp
            sectionName: https
    target:
      name: llama-cpp
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - chat.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
          - name: llama-cpp
            sectionName: https
    target:
      name: llama-cpp-api
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - chat.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
          - name: llama-cpp
            sectionName: http
    target:
      name: llama-cpp-redirect
      kind: HTTPRoute
