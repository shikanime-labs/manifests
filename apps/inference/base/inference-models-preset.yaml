apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-models-preset
  namespace: shikanime
data:
  models-preset.ini: |
    version = 1

    ; Global defaults inherited by all models.
    [*]
    n-gpu-layers = 99
    flash-attn = on
    no-mmap = on
    ctx-size = 32000
    cache-type-k = q8_0
    cache-type-v = q8_0
    batch-size = 2048
    ubatch-size = 512
    mtp-n = 1
    jinja = true
    stop-timeout = 2
    sleep-idle-seconds = 0

    ; Qwen3.8-Flash-Next-GGUF (UD-Q4_K_XL) — local floor, fast.
    [qwen/qwen-flash]
    model = /models/qwen-flash-Q4_K_XL.gguf

    ; Qwen3.8-27B-GGUF (Q8_0) — local floor, slower but larger.
    [qwen/qwen3.8-27b]
    model = /models/qwen-27b-Q8_0.gguf
    mm = /models/mmproj-Qwen3.8-27B-Q8_0.gguf

    ; DeepSeek-V4-Flash-0731-GGUF — merged into a single model since the
    ; flash tier (Q4_K_XL @ ~70 GB) fits one AMD GPU.
    [deepseek/v4-flash]
    model = /models/deepseek-v4-flash-Q4_K_XL.gguf

    ; Qwen3-Embedding-8B-GGUF (Q5_K_M) — multimodal embedding. 8 GB VRAM,
    ; MTEB 75.22, strong code retrieval. 8k context suffices for chunks.
    [embeddings/qwen-embed]
    model = /models/qwen3-embed-8b-Q5_K_M.gguf
