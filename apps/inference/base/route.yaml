apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: default
  namespace: shikanime
spec:
  parentRefs:
    - name: inference
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    # Harmonized model naming: one logical model per rule, mapped to each
    # provider's native model id via modelNameOverride. The extProc extracts
    # the request body model and matches it against these x-ai-eg-model
    # Exact headers.
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: qwen/qwen3.8-27b
      backendRefs:
        - name: qwen-27b
          priority: 0
          modelNameOverride: unsloth/Qwen3.8-27B-GGUF:Q8_0
        - name: nous
          priority: 1
          modelNameOverride: qwen/qwen3.8-27b
        - name: openrouter
          priority: 2
          modelNameOverride: qwen/qwen3.8-27b
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: deepseek/deepseek-v4-flash
      backendRefs:
        - name: deepseek-flash
          priority: 0
          modelNameOverride: unsloth/DeepSeek-V4-Flash-0731-GGUF:Q4_K_M
        - name: nous
          priority: 1
          modelNameOverride: deepseek/deepseek-v4-flash-latest
        - name: openrouter
          priority: 2
          modelNameOverride: deepseek/deepseek-v4-flash-latest
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: z-ai/glm-4.7
      backendRefs:
        - name: zai
          priority: 0
          modelNameOverride: glm-4.7
        - name: nous
          priority: 1
          modelNameOverride: z-ai/glm-4.7
        - name: openrouter
          priority: 2
          modelNameOverride: z-ai/glm-4.7
