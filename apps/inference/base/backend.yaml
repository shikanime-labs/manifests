---
# Free-tier remote backends, one per provider: failover is per-Backend and
# each provider needs its own key, so aggregating hosts under one Backend
# 401s instead of failing over. Local floors point at real llama-cpp
# Services in this namespace.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: nous
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: api.nousresearch.com
        port: 443
  tls:
    wellKnownCACertificates: System
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openrouter
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: openrouter.ai
        port: 443
  tls:
    wellKnownCACertificates: System
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: zai
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: api.z.ai
        port: 443
  tls:
    wellKnownCACertificates: System
    sni: api.z.ai
---
# Local floor: in-cluster router-mode llama-cpp serving.
# The single router pod exposes a dynamic /models API. Deployers run
# curl /models/load POST against the pod once it's up, then load the desired
# model via the models-preset.ini preset file.
# The env-override block preserves presets while allowing per-node config:
#   env:
#     - name: LLAMA_CPP_MODELS_PRESET
#       value: /etc/llama-cpp/models-preset.ini
#     - name: LLAMA_CPP_MODELS_DIR
#       value: /models
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: inference
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: inference.shikanime.svc.cluster.local
        port: 8080
