---
# Free-tier remote backends, one per provider: failover is per-Backend and
# each provider needs its own key, so aggregating hosts under one Backend
# 401s instead of failing over. Local floors point at real llama-cpp
# Services in this namespace.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: nous
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: api.nousresearch.com
        port: 443
  tls:
    wellKnownCACertificates: System
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openrouter
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: openrouter.ai
        port: 443
  tls:
    wellKnownCACertificates: System
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: zai
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: api.z.ai
        port: 443
  tls:
    wellKnownCACertificates: System
    sni: api.z.ai
---
# Local floor: in-cluster llama-cpp serving (no API key, never 429s).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: qwen-27b
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: qwen-27b.shikanime.svc.cluster.local
        port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: deepseek-flash
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: deepseek-flash.shikanime.svc.cluster.local
        port: 8080
