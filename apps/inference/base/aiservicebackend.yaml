---
# AIServiceBackend backendRefs must be Envoy Gateway Backend resources
# (k8s Service refs are disabled — ai-gateway #902, CEL in #1328).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: nous
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: nous
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openrouter
  namespace: shikanime
spec:
  schema:
    name: OpenAI
    # OpenRouter's OpenAI-compatible base is openrouter.ai/api/v1, not /v1.
    prefix: api/v1
  backendRef:
    name: openrouter
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: zai
  namespace: shikanime
spec:
  schema:
    name: OpenAI
    # z.ai coding-plan key: base is api.z.ai/api/coding/paas/v4, not /v1.
    prefix: api/coding/paas/v4
  backendRef:
    name: zai
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: qwen-27b
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: qwen-27b
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: deepseek-flash
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: deepseek-flash
    kind: Backend
    group: gateway.envoyproxy.io
