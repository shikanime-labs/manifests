# EnvoyProxy stays in the Gateway's namespace: infrastructure.parametersRef
# is same-namespace only (GEP-3262), and kustomize pins namespace: shikanime.
# The pinned envoyService name gives the data plane a stable Service.
# ponytail: EG's 32kiB listener buffer may stall huge LLM contexts; no
# schema-valid knob in v1alpha1 — re-add one when upstream exposes it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: inference
  namespace: shikanime
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Stable name (default is envoy-<ns>-<name>-<hash>) so the tailnet
        # hostname below is independent of EG's generated names.
        name: inference
        # BYOD: expose the data plane straight through the Tailscale operator
        # (L4). Tailscale leads outside the cluster; the mTLS listener does
        # client-cert validation inside, which an L7 Ingress cannot carry.
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: inference
      envoyDeployment:
        pod:
          # Constrain to ARM edge nodes. rpi4 has 3 GiB; envoy's tcmalloc
          # SIGTRAPs (exit 133) when mmap fails under node memory pressure,
          # so the container limit below caps envoy's address space and
          # keeps the node's PSI under the OOM-killer threshold.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.kubernetes.io/instance-type
                        operator: In
                        values:
                          - rpi4-model-b
                          - rpi5
        container:
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"

