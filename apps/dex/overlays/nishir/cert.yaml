apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dex-tls
spec:
  commonName: dex
  dnsNames:
    - dex
    - dex.shikanime
    - dex.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  secretName: dex-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
