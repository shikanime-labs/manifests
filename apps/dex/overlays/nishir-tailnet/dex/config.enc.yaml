        nameAttr: cn
        userMatchers:
          - groupAttr: member
            userAttr: DN
      host: lldap.shikanime.svc.cluster.local:6360
      insecureNoSSL: false
      insecureSkipVerify: true
      userSearch:
        baseDN: ou=people,dc=shikanime,dc=studio
        emailAttr: mail
        idAttr: uid
        nameAttr: displayName
        preferredUsernameAttr: uid
        username: uid
