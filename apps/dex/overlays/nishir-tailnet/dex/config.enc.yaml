connectors:
  - name: LDAP
    type: ldap
    id: ldap
    config:
      bindDN: uid=admin,ou=people,dc=shikanime,dc=studio
      bindPW: ENC[AES256_GCM,data:DhoZ0HrR4YTLFxaG2PNgbXAQrpLuoWUahPtMtQ==,iv:mUdtUoVG3M+95bk4ezTNNyctOz5fVyIjTL8kAozCEnU=,tag:DAQ+frwjsIKJSzOZH6h2ug==,type:str]
