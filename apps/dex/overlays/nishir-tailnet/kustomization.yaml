resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - backendtlspolicy.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: oauth2-provider
      app.kubernetes.io/instance: dex
      app.kubernetes.io/name: dex
      app.kubernetes.io/part-of: nishir-platform
      app.kubernetes.io/version: 2.45.0
secretGenerator:
  - name: dex-config
    files:
      - config.yaml=dex/config.enc.yaml
patches:
  - path: patch-httproute-dex.yaml
    target:
      name: dex
      kind: HTTPRoute
  - path: patch-httproute-dex-redirect.yaml
    target:
      name: dex-redirect
      kind: HTTPRoute
