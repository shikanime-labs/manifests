apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: temporal-postgres
      app.kubernetes.io/name: postgres
  serviceName: temporal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: temporal-postgres
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 180
            periodSeconds: 5
            timeoutSeconds: 5
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres
                  key: password
      securityContext:
        fsGroup: 999
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: temporal-postgres-data
