apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich
spec:
  template:
    spec:
      containers:
        - name: immich
          volumeMounts:
            - name: data
              mountPath: /usr/src/app/upload
              volumeName: data
            - name: timeline-data
              mountPath: /mnt/timeline
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-data
        - name: timeline-data
          persistentVolumeClaim:
            claimName: timeline-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        resources:
          requests:
            storage: 64Gi
        storageClassName: nishir-nearline
        accessModes:
          - ReadWriteOnce
