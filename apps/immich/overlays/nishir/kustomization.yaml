resources:
  - ../../base
namespace: shikanime
patches:
  - path: patch-deploy.yaml
secretGenerator:
  - name: immich
    envs:
      - immich/.enc.env
    options:
      disableNameSuffixHash: true
  - name: immich-config
    files:
      - config.yaml=immich/config.enc.yaml
    options:
      disableNameSuffixHash: true
