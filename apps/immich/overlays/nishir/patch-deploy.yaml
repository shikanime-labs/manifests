apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
spec:
  template:
    spec:
      containers:
        - name: immich
          volumeMounts:
            - name: timeline-data
              mountPath: /mnt/timeline
              readOnly: true
      volumes:
        - name: timeline-data
          persistentVolumeClaim:
            claimName: timeline-data
