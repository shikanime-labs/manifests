apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/qsv.enabled
                    operator: In
                    values:
                      - "true"
      containers:
        - name: immich
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
          volumeMounts:
            - name: timeline-data
              mountPath: /mnt/timeline
              readOnly: true
            - name: dev-dri
              mountPath: /dev/dri
      volumes:
        - name: timeline-data
          persistentVolumeClaim:
            claimName: timeline-data
        - name: dev-dri
          hostPath:
            type: Directory
            path: /dev/dri
