resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: photo-manager
      app.kubernetes.io/instance: immich
      app.kubernetes.io/name: immich
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: v1.118.0
secretGenerator:
  - name: immich-config
    files:
      - config.yaml=immich/config.enc.yaml
    options:
      disableNameSuffixHash: true
patches:
  - target:
      name: immich
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [immich.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: immich
            sectionName: https
  - target:
      name: immich-redirect
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [immich.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: immich
            sectionName: http
  - path: patch-netpol.yaml
    target:
      name: immich
      version: v1
      kind: NetworkPolicy
