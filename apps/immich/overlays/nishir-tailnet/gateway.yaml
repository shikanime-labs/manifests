apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: immich
spec:
  gatewayClassName: immich
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: immich-i-shikanime-studio-tls
            group: ""
            kind: Secret
