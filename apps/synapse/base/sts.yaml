apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synapse
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: synapse
      app.kubernetes.io/name: synapse
  serviceName: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: synapse
        app.kubernetes.io/name: synapse
    spec:
      containers:
        - name: synapse
          image: synapse
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 163m
              memory: 879Mi
          securityContext:
            capabilities:
              add:
                - SETUID
                - SETGID
      securityContext:
        fsGroup: 991
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        resources:
          requests:
            storage: 64Gi
        storageClassName: longhorn-standard
        volumeMode: Filesystem
        accessModes:
          - ReadWriteOncePod
