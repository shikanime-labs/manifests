---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix
spec:
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/matrix/mautrix
      filters:
        - type: ExtensionRef
          extensionRef:
            name: matrix-mautrix-wellknown
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Methods
                value: GET, OPTIONS
              - name: Access-Control-Allow-Headers
                value: Origin, Content-Type, Accept
              - name: Access-Control-Max-Age
                value: "86400"
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix/
        - path:
            type: PathPrefix
            value: /_matrix/
        - path:
            type: PathPrefix
            value: /_synapse/client/
      backendRefs:
        - name: synapse
          port: 8448
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: matrix.taila659a.ts.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-discord-media
spec:
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/matrix/server
        - path:
            type: PathPrefix
            value: /_matrix/federation/v1/media/download/
        - path:
            type: PathPrefix
            value: /_matrix/client/v1/media/
        - path:
            type: PathPrefix
            value: /_matrix/media/
        - path:
            type: PathPrefix
            value: /_matrix/key/
        - path:
            type: Exact
            value: /_matrix/federation/v1/version
      backendRefs:
        - name: mautrix-discord
          port: 29334
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix/
        - path:
            type: PathPrefix
            value: /_matrix/
        - path:
            type: PathPrefix
            value: /_synapse/client/
      backendRefs:
        - name: synapse
          port: 8448
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: matrix.taila659a.ts.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-redirect
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
