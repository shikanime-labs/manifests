resources:
  - ../../base
  - backendtlspolicy.yaml
  - cert.yaml
  - gateway.yaml
  - httproutefilter.yaml
namespace: shikanime
components:
  - ../../components/tls
  - ../../components/monitoring
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - matrix.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: synapse
          sectionName: https
    target:
      name: matrix
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - matrix-discord-media.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: synapse
          sectionName: https
    target:
      name: matrix-discord-media
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - matrix.i.shikanime.studio
        - matrix-discord-media.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: synapse
          sectionName: http
      - op: add
        path: /spec/rules/0/filters/0/requestRedirect/hostname
        value: matrix.taila659a.ts.net
    target:
      name: matrix-redirect
      kind: HTTPRoute
  - path: patch-sts.yaml
