resources:
  - ../../base
  - backendtlspolicy.yaml
  - cert.yaml
  - gateway.yaml
namespace: shikanime
components:
  - ../../components/tls
  - ../../components/monitoring
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - matrix.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: synapse
          sectionName: https
    target:
      kind: HTTPRoute
      name: matrix
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - matrix-discord-media.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: synapse
          sectionName: https
    target:
      kind: HTTPRoute
      name: matrix-discord-media
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - matrix.i.shikanime.studio
        - matrix-discord-media.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: synapse
          sectionName: http
    target:
      kind: HTTPRoute
      name: matrix-redirect
  - path: patch-pvc.yaml
  - path: patch-sts.yaml
