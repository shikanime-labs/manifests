apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: synapse-tls
spec:
  commonName: synapse
  dnsNames:
    - synapse
    - synapse.shikanime
    - synapse.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  secretName: synapse-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-matrix
  namespace: shikanime
spec:
  commonName: matrix.i.shikanime.studio
  dnsNames:
    - matrix.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-matrix
  usages:
    - digital signature
    - key encipherment
    - server auth
