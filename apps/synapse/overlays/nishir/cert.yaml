apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: synapse-tls
spec:
  commonName: synapse
  dnsNames:
    - synapse
    - synapse.shikanime
    - synapse.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  secretName: synapse-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
