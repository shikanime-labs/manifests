apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synapse
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: network.speed.2.5g
                    operator: In
                    values:
                      - "true"
              weight: 50
      containers:
        - name: synapse
          livenessProbe:
            failureThreshold: 15
            httpGet:
              port: https
              scheme: HTTPS
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 30
          readinessProbe:
            failureThreshold: 15
            httpGet:
              port: https
              scheme: HTTPS
            initialDelaySeconds: 80
            periodSeconds: 20
            timeoutSeconds: 20
          startupProbe:
            failureThreshold: 180
            httpGet:
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 15
          volumeMounts:
            - name: startup-config
              mountPath: /data/homeserver.yaml
              readOnly: true
              subPath: homeserver.yaml
      volumes:
        - name: startup-config
          projected:
            sources:
              - secret:
                  name: synapse
              - secret:
                  name: mautrix-discord
                  items:
                    - key: registration.yaml
                      path: appservices/matrix-discord.yaml
                    - key: doublepuppet.yaml
                      path: appservices/matrix-discord-doublepuppet.yaml
              - secret:
                  name: mautrix-googlechat
                  items:
                    - key: registration.yaml
                      path: appservices/matrix-googlechat.yaml
                    - key: doublepuppet.yaml
                      path: appservices/matrix-googlechat-doublepuppet.yaml
              - secret:
                  name: mautrix-linkedin
                  items:
                    - key: registration.yaml
                      path: appservices/matrix-linkedin.yaml
                    - key: doublepuppet.yaml
                      path: appservices/matrix-linkedin-doublepuppet.yaml
              - secret:
                  name: mautrix-meta
                  items:
                    - key: registration.yaml
                      path: appservices/matrix-meta.yaml
                    - key: doublepuppet.yaml
                      path: appservices/matrix-meta-doublepuppet.yaml
              - secret:
                  name: mautrix-signal
                  items:
                    - key: registration.yaml
                      path: appservices/matrix-signal.yaml
                    - key: doublepuppet.yaml
                      path: appservices/matrix-signal-doublepuppet.yaml
              - secret:
                  name: mautrix-slack
                  items:
                    - key: registration.yaml
                      path: appservices/matrix-slack.yaml
                    - key: doublepuppet.yaml
                      path: appservices/matrix-slack-doublepuppet.yaml
              - secret:
                  name: mautrix-twitter
                  items:
                    - key: registration.yaml
                      path: appservices/matrix-twitter.yaml
                    - key: doublepuppet.yaml
                      path: appservices/matrix-twitter-doublepuppet.yaml
              - secret:
                  name: mautrix-whatsapp
                  items:
                    - key: registration.yaml
                      path: appservices/matrix-whatsapp.yaml
                    - key: doublepuppet.yaml
                      path: appservices/matrix-whatsapp-doublepuppet.yaml
