resources:
  - ../nishir
  - envoyproxy.yaml
  - gatewayclass.yaml
  - httproutefilter.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: communication
      app.kubernetes.io/instance: synapse
      app.kubernetes.io/name: synapse
      app.kubernetes.io/part-of: nishir-office
      app.kubernetes.io/version: 1.158.0
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: matrix-discord-media.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: synapse
            sectionName: https
    target:
      name: matrix-discord-media
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: matrix.taila659a.ts.net
      - op: add
        path: /spec/hostnames/-
        value: matrix-discord-media.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: synapse
            sectionName: http
    target:
      name: matrix-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: matrix.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: synapse
            sectionName: https
    target:
      name: matrix
      kind: HTTPRoute
secretGenerator:
  - name: synapse
    files:
      - homeserver.yaml=synapse/homeserver.enc.yaml
      - synapse/matrix.taila659a.ts.net.log.config
