---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: synapse
  annotations:
    # Pin external-dns to a CNAME at the Tailscale hostname. Without this the
    # Gateway status exposes both an IPAddress and a Hostname, producing
    # conflicting A/CNAME record candidates.
    external-dns.alpha.kubernetes.io/target: synapse.taila659a.ts.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix
spec:
  hostnames:
    - matrix.i.shikanime.studio
    - matrix.taila659a.ts.net
  parentRefs:
    - name: synapse
      sectionName: https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-discord-media
spec:
  hostnames:
    - matrix-discord-media.i.shikanime.studio
    - matrix-discord-media.taila659a.ts.net
  parentRefs:
    - name: synapse
      sectionName: https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-redirect
spec:
  hostnames:
    - matrix.i.shikanime.studio
    - matrix-discord-media.i.shikanime.studio
    - matrix.taila659a.ts.net
    - matrix-discord-media.taila659a.ts.net
  parentRefs:
    - name: synapse
      sectionName: http
