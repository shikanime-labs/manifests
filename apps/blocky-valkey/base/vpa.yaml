apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: blocky-valkey
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blocky-valkey
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: valkey
        maxAllowed:
          memory: 1Gi
