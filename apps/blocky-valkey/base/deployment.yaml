apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky-valkey
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: blocky-valkey
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: blocky-valkey
        app.kubernetes.io/name: valkey
    spec:
      priorityClassName: shikanime-critical
      containers:
        - name: valkey
          image: valkey
          livenessProbe:
            initialDelaySeconds: 10
            tcpSocket:
              port: valkey
            timeoutSeconds: 5
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            initialDelaySeconds: 5
            tcpSocket:
              port: valkey
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 30
            tcpSocket:
              port: valkey
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 250Mi
          securityContext:
            capabilities:
              add:
                - CHOWN
                - FOWNER
                - SETUID
                - SETGID
                - DAC_OVERRIDE
