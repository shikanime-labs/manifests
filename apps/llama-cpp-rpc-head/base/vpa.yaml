apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: llama-cpp-rpc-head
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: llama-cpp-rpc-head
  updatePolicy:
    updateMode: InPlace
  resourcePolicy:
    containerPolicies:
      - containerName: llama-cpp
