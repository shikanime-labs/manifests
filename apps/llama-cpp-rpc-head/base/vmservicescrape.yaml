apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: llama-cpp-rpc-head
  labels:
    app.kubernetes.io/name: llama-cpp-rpc-head
    app.kubernetes.io/part-of: nishir-inference
spec:
  endpoints:
    - interval: 60s
      path: /metrics
      params:
        model:
          - qwen/qwen3.8-flash
      port: http
      scrapeTimeout: 30s
      relabelConfigs:
        - targetLabel: model
          replacement: qwen/qwen3.8-flash
        - targetLabel: instance
          replacement: llama-cpp-rpc-head-qwen3.8-flash
  namespaceSelector:
    matchNames:
      - shikanime
  selector:
    matchLabels:
      app.kubernetes.io/instance: llama-cpp-rpc-head
      app.kubernetes.io/name: llama-cpp-rpc-head
