---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp-rpc-head
spec:
  rules:
    - backendRefs:
        - name: llama-cpp-rpc-head
          port: 9931
      # 10m cap: generous for long generations, still bounds a stuck stream
      # (Envoy's default 15s cap resets mid-generation; 0s was effectively
      # infinite and let hung streams run forever).
      timeouts:
        request: 600s
---
# The router's OpenAI-compatible API is split off the UI route so a browser
# call answers with JSON instead of the OIDC redirect the UI route carries.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp-rpc-head-api
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: llama-cpp-rpc-head
          port: 9931
      # Same 10m cap as the UI route: /v1 carries the streaming chat
      # completions. 0s (infinite) let hung streams run forever.
      timeouts:
        request: 600s
---
# Deliberately absent from the llama-cpp-rpc-head-oidc-client SecurityPolicy
# targetRefs: /health has to answer without the SSO gate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp-rpc-head-health
spec:
  rules:
    - matches:
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: llama-cpp-rpc-head
          port: 9931
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp-rpc-head-redirect
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
