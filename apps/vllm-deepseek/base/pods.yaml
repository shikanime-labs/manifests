---
apiVersion: v1
kind: Pod
metadata:
  name: vllm-deepseek-head
  namespace: shikanime
  labels:
    app.kubernetes.io/instance: vllm-deepseek
    app.kubernetes.io/name: vllm-deepseek
    app.kubernetes.io/component: ray-head
spec:
  # Ray + RCCL need node-to-node reachability on dynamic ports; hostNetwork
  # bypasses pod CIDR NAT so both ranks see each other's LAN address.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    kubernetes.io/hostname: sashina
  containers:
    - name: vllm
      image: vllm-gfx1151
      # Gatekeeper set-pod-privileged-false mutator exempts explicit
      # securityContexts; /dev/kfd requires unrestricted device access.
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          ray start --head --port=6379 --node-ip-address=192.168.1.79 --block=false
          exec vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
            --tensor-parallel-size 2 \
            --enforce-eager \
            --host 0.0.0.0 --port 8000
      env:
        - name: NCCL_SOCKET_IFNAME
          value: br0
      ports:
        - name: http
          containerPort: 8000
          hostPort: 8000
      resources: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: vllm-deepseek-worker
  namespace: shikanime
  labels:
    app.kubernetes.io/instance: vllm-deepseek
    app.kubernetes.io/name: vllm-deepseek
    app.kubernetes.io/component: ray-worker
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    kubernetes.io/hostname: kushira
  containers:
    - name: ray
      image: vllm-gfx1151
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          ray start --address=192.168.1.90:6379 --node-ip-address=192.168.1.91 --block
      env:
        - name: NCCL_SOCKET_IFNAME
          value: br0
      resources: {}
