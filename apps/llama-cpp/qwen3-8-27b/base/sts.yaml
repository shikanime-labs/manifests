apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qwen3-8-27b
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: qwen3-8-27b
      app.kubernetes.io/name: qwen3-8-27b
  serviceName: qwen3-8-27b
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: qwen3-8-27b
        app.kubernetes.io/name: qwen3-8-27b
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/amd-gpu
                    operator: In
                    values:
                      - "true"
      containers:
        - name: qwen3-8-27b
          image: llama-cpp
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - -hf
            - unsloth/Qwen3.8-27B-GGUF:Q8_0
            - --hf-file
            - mmproj-Qwen3.8-27B-Q8_0.gguf
            - --ctx-size
            - "32000"
            - --gpu-layers
            - "99"
            - --no-mmap
            - --flash-attn
            - "on"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --batch-size
            - "2048"
            - --ubatch-size
            - "512"
            - --mtp-n
            - "1"
          env:
            - name: HF_HUB_CACHE
              value: /models
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 120
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 48Gi
            requests:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-dri
              mountPath: /dev/dri
      volumes:
        - name: models
          emptyDir: {}
        - name: dev-kfd
          hostPath:
            type: CharDevice
            path: /dev/kfd
        - name: dev-dri
          hostPath:
            type: Directory
            path: /dev/dri
