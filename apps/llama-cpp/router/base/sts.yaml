apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: inference
      app.kubernetes.io/name: inference
  serviceName: inference
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: inference
        app.kubernetes.io/name: inference
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/amd-gpu
                    operator: In
                    values:
                      - "true"
      containers:
        - name: inference
          image: llama-cpp
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --models-preset
            - /etc/llama-cpp/models-preset.ini
            - --models-dir
            - /models
          env:
            - name: HF_HUB_CACHE
              value: /models
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 120
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 110Gi
            requests:
              cpu: "6"
              memory: 16Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-dri
              mountPath: /dev/dri
            - name: models-preset
              mountPath: /etc/llama-cpp
              readOnly: true
      volumes:
        - name: models
          emptyDir: {}
        - name: dev-kfd
          hostPath:
            type: CharDevice
            path: /dev/kfd
        - name: dev-dri
          hostPath:
            type: Directory
            path: /dev/dri
        - name: models-preset
          configMap:
            name: inference-models-preset
