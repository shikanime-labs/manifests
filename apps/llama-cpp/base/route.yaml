apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: default
  namespace: shikanime
spec:
  rules:
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: qwen/qwen3.8-27b
      backendRefs:
        - name: llama-cpp
          priority: 0
          modelNameOverride: qwen/qwen3.8-27b
        - name: nous
          priority: 1
          modelNameOverride: qwen/qwen3.8-27b
        - name: openrouter
          priority: 2
          modelNameOverride: qwen/qwen3.8-27b
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: qwen/qwen3.8-flash
      backendRefs:
        - name: llama-cpp
          priority: 0
          modelNameOverride: qwen/qwen3.8-flash
        - name: nous
          priority: 1
          modelNameOverride: qwen/qwen3.8-flash
        - name: openrouter
          priority: 2
          modelNameOverride: qwen/qwen3.8-flash
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: deepseek/deepseek-v4-flash
      backendRefs:
        - name: llama-cpp
          priority: 0
          modelNameOverride: deepseek/deepseek-v4-flash-0731
        - name: nous
          priority: 1
          modelNameOverride: deepseek/deepseek-v4-flash-0731
        - name: openrouter
          priority: 2
          modelNameOverride: deepseek/deepseek-v4-flash-0731
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: z-ai/glm-5.3-flash
      backendRefs:
        # z-ai (coding-plan key) first, then the local floor so GLM stays on-cluster at z-ai quota.
        - name: z-ai
          priority: 0
          modelNameOverride: glm-5.3-flash
        - name: llama-cpp
          priority: 1
          modelNameOverride: z-ai/glm-5.3-flash
        - name: nous
          priority: 2
          modelNameOverride: z-ai/glm-5.3-flash
        - name: openrouter
          priority: 3
          modelNameOverride: z-ai/glm-5.3-flash
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: qwen/qwen3-embedding-8b
      backendRefs:
        - name: llama-cpp
          priority: 0
          modelNameOverride: qwen/qwen3-embedding-8b
        - name: nous
          priority: 1
          modelNameOverride: qwen/qwen3-embedding-8b
        - name: openrouter
          priority: 2
          modelNameOverride: qwen/qwen3-embedding-8b
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: mistral/mistral-large-latest
      backendRefs:
        - name: mistral
          priority: 0
          modelNameOverride: mistral-large-latest
        - name: nous
          priority: 1
          modelNameOverride: mistral/mistral-large-latest
        - name: openrouter
          priority: 2
          modelNameOverride: mistral/mistral-large-latest
    # No local floor: route unknown models (e.g. tencent/hy3:free) straight to the remote pool.
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: RegularExpression
              value: ".*"
      backendRefs:
        - name: nous
          priority: 0
          modelNameOverride: ${header.x-ai-eg-model}
        - name: openrouter
          priority: 1
          modelNameOverride: ${header.x-ai-eg-model}
