---
# Rewrites /mcp/z-ai/<server>/... to /api/mcp/<server>/... on api.z.ai.
# Regex capture keeps the rest of the path (JSON-RPC POSTs land on
# /api/mcp/<server>/mcp).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: z-ai-mcp-rewrite
  namespace: shikanime
spec:
  urlRewrite:
    path:
      type: ReplaceRegexMatch
      replaceRegexMatch:
        pattern: ^/mcp/z-ai/([^/]+)(/mcp.*)?$
        substitution: /api/mcp/\1/mcp
