---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
  namespace: shikanime
spec:
  selector:
    app.kubernetes.io/instance: llama-cpp
    app.kubernetes.io/name: llama-cpp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: llama-rpc
  namespace: shikanime
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: llama-cpp
    app.kubernetes.io/name: llama-cpp-rpc
  ports:
    - name: http
      port: 50052
      targetPort: http
