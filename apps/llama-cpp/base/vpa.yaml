# VPA targets the LeaderWorkerSet; LWS propagates resource requests to the
# StatefulSet it generates, so VPA admission binds to the LWS-owned pods.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: llama-cpp
spec:
  targetRef:
    apiVersion: leaderworkerset.x-k8s.io/v1
    kind: LeaderWorkerSet
    name: llama-cpp
  # Recommendations only: the RPC pair loads a 100 GiB+ GGUF, so InPlaceOrRecreate
  # churn would evict the model pod. Keep the VPA object (scale recs via status),
  # but never auto-apply.
  updatePolicy:
    updateMode: Off
