---
# Injects the Z.ai API key into requests forwarded to api.z.ai, replacing the
# MCPRoute per-backend securityPolicy that the bypassed MCP proxy used to
# provide. HTTPRouteFilter credentialInjection reads key `credential`; the
# secretGenerator suffix from kustomize is resolved via overlays/nishir/
# namereference.yaml. Value must be `Bearer <zai api key>` (see overlay env).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: z-ai-mcp-credential
  namespace: shikanime
spec:
  credentialInjection:
    overwrite: true
    credential:
      valueRef:
        name: inference-z-ai
