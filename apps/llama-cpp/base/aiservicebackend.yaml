---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: nous
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: nous
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openrouter
  namespace: shikanime
spec:
  schema:
    name: OpenAI
    # OpenRouter needs the /api/v1 base path; the default /v1 hits its web root.
    prefix: api/v1
  backendRef:
    name: openrouter
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: z-ai-openai
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: api.z.ai
        port: 443
  tls:
    wellKnownCACertificates: System
    sni: api.z.ai
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: z-ai
  namespace: shikanime
spec:
  schema:
    name: Anthropic
    # GLM-5.3 / glm-5.3-flash are served only on Z.ai's Anthropic /messages endpoint.
    prefix: api/anthropic/v1
  backendRef:
    name: z-ai
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: z-ai-openai
  namespace: shikanime
spec:
  schema:
    name: OpenAI
    # Z.ai's OpenAI-compatible endpoint (/api/paas/v4) serves glm-5.3-flash
    # for /v1/chat/completions; the Anthropic-schema backend above cannot
    # translate OpenAI chat requests.
    prefix: api/paas/v4
  backendRef:
    name: z-ai-openai
    kind: Backend
    group: gateway.envoyproxy.io

---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: mistral
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: mistral
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: llama-cpp
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: llama-cpp
    kind: Backend
    group: gateway.envoyproxy.io
