---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: nous
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: nous
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openrouter
  namespace: shikanime
spec:
  schema:
    name: OpenAI
    # OpenRouter needs the /api/v1 base path; the default /v1 hits its web root.
    prefix: api/v1
  backendRef:
    name: openrouter
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: z-ai
  namespace: shikanime
spec:
  schema:
    name: Anthropic
    # GLM-5.3 / glm-5.3-flash are served only on Z.ai's Anthropic /messages endpoint.
    prefix: api/anthropic/v1
  backendRef:
    name: z-ai
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: z-ai-openai
  namespace: shikanime
spec:
  schema:
    name: OpenAI
    # The fleet z-ai credential is a CODING-PLAN key: it is entitled on
    # api/coding/paas/v4 (verified live). The pay-as-you-go api/paas/v4
    # rejects it with 1113 "Insufficient balance or no resource package".
    prefix: api/coding/paas/v4
  backendRef:
    name: z-ai-openai
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: mistral
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: mistral
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: llama-cpp
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: llama-cpp
    kind: Backend
    group: gateway.envoyproxy.io
