apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: llama-cpp-local
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: llama-cpp-local
  updatePolicy:
    updateMode: InPlace
  resourcePolicy:
    containerPolicies:
      - containerName: llama-cpp
        minAllowed:
          memory: 64Gi
