apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: llama-cpp-cluster
  namespace: shikanime
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/instance: llama-cpp
          app.kubernetes.io/name: llama-cpp
      spec:
        nodeSelector:
          node.kubernetes.io/instance-type: minisforum-ms-s1
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: llama-cpp
                    app.kubernetes.io/name: llama-cpp
                topologyKey: kubernetes.io/hostname
        containers:
          # Router mode maps each model name to a HuggingFace repo:quant; the
          # server downloads it into --models-dir on the first request that
          # targets it and caches it there (autoload is the default, so a chat
          # request loads the model without a separate /models/load). The server
          # comes up instantly and only pulls the models actually used. Every
          # llama-server flag is passed via its LLAMA_ARG_* env equivalent.
          - name: llama-cpp
            image: llama-cpp
            command:
              - llama-server
            env:
              - name: LLAMA_ARG_HOST
                value: 0.0.0.0
              - name: LLAMA_ARG_PORT
                value: "8080"
              - name: LLAMA_ARG_MODELS_PRESET
                value: /etc/llama-cpp/preset/models-preset.ini
              - name: LLAMA_ARG_MODELS_DIR
                value: /models
              - name: LLAMA_ARG_MODELS_MAX
                value: "5"
              - name: LLAMA_ARG_MODELS_AUTOLOAD
                value: "true"
              - name: LLAMA_ARG_EMBEDDINGS
                value: ""
              - name: LLAMA_ARG_CTX_SIZE
                value: "32768"
              - name: LLAMA_ARG_FLASH_ATTN
                value: "on"
              - name: LLAMA_ARG_CACHE_TYPE_K
                value: q8_0
              - name: LLAMA_ARG_CACHE_TYPE_V
                value: q8_0
              - name: LLAMA_ARG_N_GPU_LAYERS
                value: "999"
              - name: LLAMA_ARG_RPC
                value: llama-cpp-cluster-0-1.llama-cpp-cluster.shikanime.svc.cluster.local:50052
              - name: LLAMA_ARG_MMAP
                value: "0"
            ports:
              - name: http
                containerPort: 8080
            livenessProbe:
              failureThreshold: 10
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
            readinessProbe:
              failureThreshold: 5
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 10
              periodSeconds: 15
              timeoutSeconds: 5
            startupProbe:
              failureThreshold: 120
              httpGet:
                path: /health
                port: http
              periodSeconds: 10
              timeoutSeconds: 5
            resources:
              limits:
                memory: 120Gi
              requests:
                cpu: "8"
                memory: 24Gi
            volumeMounts:
              - name: models
                mountPath: /models
              - name: cache-huggingface
                mountPath: /root/.cache/huggingface
              - name: models-preset
                mountPath: /etc/llama-cpp/preset
                readOnly: true
              - name: dev-kfd
                mountPath: /dev/kfd
              - name: dev-dri
                mountPath: /dev/dri
        volumes:
          - name: models
            emptyDir: {}
          - name: cache-huggingface
            emptyDir: {}
          - name: models-preset
            configMap:
              name: llama-cpp-models-preset
          - name: dev-kfd
            hostPath:
              type: CharDevice
              path: /dev/kfd
          - name: dev-dri
            hostPath:
              type: Directory
              path: /dev/dri
    # RPC llama.cpp: the leader loads the model and distributes layers to worker
    # compute nodes (ggml-rpc-server). LWS requires workerTemplate even though the
    # node stays Pending until GPU hardware lands. Workers own the GPU mounts.
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/instance: llama-cpp
          app.kubernetes.io/name: llama-cpp
      spec:
        nodeSelector:
          node.kubernetes.io/instance-type: minisforum-ms-s1
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: llama-cpp
                    app.kubernetes.io/name: llama-cpp
                topologyKey: kubernetes.io/hostname
        containers:
          - name: llama-cpp-rpc
            image: ghcr.io/ggml-org/llama.cpp:server-rocm@sha256:08f4f0497de99711614f40c849621df3d645fbc433cf61bca99a3251a6f1e949
            command: ["ggml-rpc-server"]
            args:
              - --host
              - 0.0.0.0
              - --port
              - "50052"
            volumeMounts:
              - name: dev-kfd
                mountPath: /dev/kfd
              - name: dev-dri
                mountPath: /dev/dri
            ports:
              - name: rpc
                containerPort: 50052
        volumes:
          - name: dev-kfd
            hostPath:
              type: CharDevice
              path: /dev/kfd
          - name: dev-dri
            hostPath:
              type: Directory
              path: /dev/dri
