apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: llama-cpp-cluster
  namespace: shikanime
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 3
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/instance: llama-cpp
          app.kubernetes.io/name: llama-cpp
      spec:
        securityContext:
          fsGroup: 65532
        initContainers:
          # llama-server aborts at startup when an RPC peer is unreachable, and
          # LWS recycles the whole group on leader exit - so gate the leader on
          # both workers answering on the RPC port first.
          - name: wait-for-rpc
            image: busybox:1.36
            command:
              - sh
              - -c
              - |
                for host in \
                  llama-cpp-cluster-0-1.llama-cpp-cluster.shikanime.svc.cluster.local \
                  llama-cpp-cluster-0-2.llama-cpp-cluster.shikanime.svc.cluster.local; do
                  until nc -z "$host" 50052; do
                    echo "waiting for $host:50052"
                    sleep 2
                  done
                done
        containers:
          # The main host holds the RPC backend client only, so it schedules
          # on any node; worker devices carry the model (tools/rpc README).
          - name: llama-cpp
            image: llama-cpp
            command:
              - llama-server
            env:
              - name: LLAMA_ARG_HOST
                value: 0.0.0.0
              - name: LLAMA_ARG_PORT
                value: "8080"
              - name: LLAMA_ARG_MODELS_PRESET
                value: /etc/llama-cpp/preset/models-preset.ini
              - name: LLAMA_ARG_MODELS_DIR
                value: /models
              - name: LLAMA_ARG_MODELS_MAX
                value: "5"
              - name: LLAMA_ARG_MODELS_AUTOLOAD
                value: "true"
              - name: LLAMA_ARG_EMBEDDINGS
                value: "true"
              - name: LLAMA_ARG_CTX_SIZE
                value: "262144"
              - name: LLAMA_ARG_FLASH_ATTN
                value: "on"
              - name: LLAMA_ARG_CACHE_TYPE_K
                value: q8_0
              - name: LLAMA_ARG_CACHE_TYPE_V
                value: q8_0
              - name: LLAMA_ARG_RPC
                value: llama-cpp-cluster-0-1.llama-cpp-cluster.shikanime.svc.cluster.local:50052,llama-cpp-cluster-0-2.llama-cpp-cluster.shikanime.svc.cluster.local:50052
            ports:
              - name: http
                containerPort: 8080
            livenessProbe:
              failureThreshold: 10
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
            readinessProbe:
              failureThreshold: 5
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 10
              periodSeconds: 15
              timeoutSeconds: 5
            startupProbe:
              failureThreshold: 120
              httpGet:
                path: /health
                port: http
              periodSeconds: 10
              timeoutSeconds: 5
            resources:
              limits:
                memory: 8Gi
              requests:
                cpu: "1"
                memory: 2Gi
            volumeMounts:
              - name: cache-huggingface
                mountPath: /.cache/huggingface
              - name: models
                mountPath: /models
              - name: models-preset
                mountPath: /etc/llama-cpp/preset
                readOnly: true
        volumes:
          - name: cache-huggingface
            emptyDir: {}
          - name: models
            emptyDir: {}
          - name: models-preset
            configMap:
              name: llama-cpp-models-preset
    # Workers run ggml-rpc-server on the UMA APU nodes; the leader
    # distributes layers across their devices per the tools/rpc README.
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/instance: llama-cpp
          app.kubernetes.io/name: llama-cpp-rpc
      spec:
        nodeSelector:
          node.kubernetes.io/instance-type: minisforum-ms-s1
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: llama-cpp
                    app.kubernetes.io/name: llama-cpp-rpc
                topologyKey: kubernetes.io/hostname
        containers:
          - name: llama-cpp-rpc
            image: llama-cpp
            command:
              - ggml-rpc-server
            securityContext:
              privileged: true
              allowPrivilegeEscalation: true
            args:
              - --host
              - 0.0.0.0
              - --port
              - "50052"
            volumeMounts:
              - name: dev-kfd
                mountPath: /dev/kfd
              - name: dev-dri
                mountPath: /dev/dri
            ports:
              - name: rpc
                containerPort: 50052
        volumes:
          - name: dev-kfd
            hostPath:
              type: CharDevice
              path: /dev/kfd
          - name: dev-dri
            hostPath:
              type: Directory
              path: /dev/dri
