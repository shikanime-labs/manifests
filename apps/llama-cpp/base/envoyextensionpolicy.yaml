---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: z-ai-peak-hours
  namespace: shikanime
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference
  lua:
    # Rewrites x-ai-eg-model z-ai/* -> peak/z-ai/* during the z-ai peak-rate
    # window, 09:00-12:00 Paris time (Europe/Paris = CET UTC+1 / CEST UTC+2).
    # Route rules for peak/z-ai/* live in aigatewayroute.yaml and carry the
    # same fallback chain minus the z-ai backend, so GLM traffic drains
    # llama-cpp/nous/openrouter during the window instead of hitting z-ai.
    # The Paris offset is computed from UTC using the EU DST rule (last Sunday
    # of March -> last Sunday of October, 01:00 UTC) with the Sakamoto
    # day-of-week formula; no tzdata dependency, correct year-round.
    - type: Inline
      inline: |
        function envoy_on_request(request_handle)
          local h = request_handle:headers()
          local model = h:get("x-ai-eg-model")
          if model == nil then return end
          if model ~= "z-ai/glm-5.3-flash" and model ~= "z-ai/glm-5.3" then
            return
          end

          -- UTC broken-down time from the Envoy Lua sandbox
          local t = os.date("!*t")
          local y, mo, d = t.year, t.month, t.day
          local hh = t.hour

          -- EU DST rule: DST from last Sunday of March 01:00 UTC
          -- to last Sunday of October 01:00 UTC.
          local function last_sunday_day(year, month)
            -- Sakamoto: day-of-week of the month's last day
            local t_ = {0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4}
            local yy = year
            if month < 3 then yy = yy - 1 end
            local dow =
              (yy + math.floor(yy / 4) - math.floor(yy / 100)
                + math.floor(yy / 400) + t_[mo] + 31) % 7
            -- dow: 0=Sunday; last day of month is day 31 (March) / 31 (Oct)
            local last = 31 - ((dow) % 7)
            return last
          end

          local in_dst = false
          if mo > 3 and mo < 10 then
            in_dst = true
          elseif mo == 3 then
            local ls = last_sunday_day(y, 3)
            if d > ls or (d == ls and hh >= 1) then
              in_dst = true
            end
          elseif mo == 10 then
            local ls = last_sunday_day(y, 10)
            if d < ls or (d == ls and hh < 1) then
              in_dst = true
            end
          end

          local offset = in_dst and 2 or 1
          local paris_hour = (hh + offset) % 24

          if paris_hour >= 9 and paris_hour < 12 then
            h:replace("x-ai-eg-model", "peak/" .. model)
          end
        end
