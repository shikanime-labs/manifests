---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: llama-cpp-oidc-client
  namespace: shikanime
spec:
  targetRefs:
    - name: llama-cpp
      kind: HTTPRoute
      group: gateway.networking.k8s.io
  oidc:
    provider:
      issuer: https://accounts.i.shikanime.studio
    # offline_access + refreshToken: Envoy silently refreshes the session at
    # access-token expiry instead of 302-ing live SPA fetches to authelia
    # (a cross-origin redirect Firefox reports as a fake CORS failure).
    scopes:
      - openid
      - offline_access
    refreshToken: true
    clientID: llama-cpp
    clientSecret:
      name: llama-cpp-oidc-client
    redirectURL: https://chat.i.shikanime.studio/oauth2/callback
---
# /v1 speaks API keys (the OIDC session cookie is not visible to cross-origin
# browser calls), so it rides its own route with apiKeyAuth + CORS. Origins
# stay exact — the wildcard form only ever matched a single segment.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: llama-cpp-apikey
  namespace: shikanime
spec:
  targetRefs:
    - name: llama-cpp-api
      kind: HTTPRoute
      group: gateway.networking.k8s.io
  apiKeyAuth:
    credentialRefs:
      # Same secret llama-server mounts as LLAMA_ARG_API_KEY_FILE: one key
      # authenticates both the gateway filter and the server itself.
      - name: inference-llama-cpp
        group: ""
        kind: Secret
    extractFrom:
      - headers:
          - Authorization
          - X-Api-Key
    # The credential must reach llama-server: it enforces its own key
    # (inference-llama-cpp secret), so one key authenticates both the gateway
    # filter and the server instead of two mismatched keys.
    sanitize: false
    forwardClientIDHeader: x-inference-client-id
  cors:
    allowOrigins:
      - "https://chat.i.shikanime.studio"
    allowMethods:
      - GET
      - POST
      - OPTIONS
    allowHeaders:
      - Authorization
      - X-Api-Key
      - Content-Type
---
# Inbound API-key gate layered on top of the existing mTLS client-cert
# requirement (ClientTrafficPolicy inference). A request must present both a
# CA-signed client certificate AND a valid key in the Authorization header
# (Bearer scheme) or the X-Api-Key header (Anthropic SDK style). The key lives
# in the generated Opaque Secret inference-key (one client id per
# Secret key; rotate by adding a key, not editing the live one). The value is
# the RAW key: Envoy strips the auth scheme before comparing, so a stored
# "Bearer <key>" value never matches. sanitize strips the header before it
# reaches the ai-gateway ext-proc and the upstream providers.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: inference-apikey
  namespace: shikanime
spec:
  targetRefs:
    - name: inference
      group: gateway.networking.k8s.io
      kind: Gateway
  apiKeyAuth:
    credentialRefs:
      - name: inference-key
        group: ""
        kind: Secret
    extractFrom:
      - headers:
          - Authorization
          - X-Api-Key
    sanitize: true
    forwardClientIDHeader: x-inference-client-id
