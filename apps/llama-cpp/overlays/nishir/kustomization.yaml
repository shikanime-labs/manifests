resources:
  - ../../base
  - ../../components/monitoring
  - clienttrafficpolicy.yaml
  - gateway.yaml
namespace: shikanime
configurations:
  - namereference.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: inference
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: "3.8"
secretGenerator:
  - name: inference-z-ai
    namespace: shikanime
    envs:
      - inference-z-ai/.enc.env
  - name: inference-nous
    namespace: shikanime
    envs:
      - inference-nous/.enc.env
  - name: inference-openrouter
    namespace: shikanime
    envs:
      - inference-openrouter/.enc.env
  - name: inference-mistral
    namespace: shikanime
    envs:
      - inference-mistral/.enc.env
patches:
  - path: patch-httproute.yaml
  - target:
      name: inference
      version: v1alpha2
      group: gateway.networking.k8s.io
      kind: AIGatewayRoute
    path: patch-aigatewayroute.yaml
