apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: inference
  namespace: shikanime
spec:
  connection:
    # ai-gateway ext_proc buffers responses (response_body_mode: BUFFERED);
    # embedding vectors exceed Envoy's default 32KiB and 500 with
    # response_payload_too_large. http2 windows must scale with the buffer.
    bufferLimit: 50Mi
  http2:
    initialStreamWindowSize: 16Mi
    initialConnectionWindowSize: 24Mi
