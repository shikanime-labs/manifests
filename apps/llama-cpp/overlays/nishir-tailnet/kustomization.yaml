resources:
  - ../nishir
  - gatewayclass.yaml
  - gateway.yaml
  - gatewayconfig.yaml
  - envoyproxy.yaml
  - ingress.yaml
  - netpol.yaml
namespace: shikanime
patches:
  - target:
      name: inference-tls
      kind: Certificate
      namespace: shikanime
    path: patch-cert.yaml
  - target:
      name: default
      kind: AIGatewayRoute
      namespace: shikanime
    path: patch-aigatewayroute.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: inference
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: "3.8"
