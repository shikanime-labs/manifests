resources:
  - ../nishir
  - gatewayclass.yaml
  - gatewayconfig.yaml
  - envoyproxy.yaml
  - httproute.yaml
  - netpol.yaml
  - securitypolicy.yaml
namespace: shikanime
patches:
  - path: patch-httproute-llama-cpp.yaml
    target:
      name: llama-cpp
      kind: HTTPRoute
  - target:
      name: inference
      kind: ClientTrafficPolicy
      namespace: shikanime
    path: patch-clienttrafficpolicy.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: inference
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: "3.8"
secretGenerator:
  - name: inference-gateway-apikey
    namespace: shikanime
    envs:
      - inference-gateway-apikey/.enc.env
