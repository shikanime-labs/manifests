resources:
  - ../nishir
  - envoyproxy.yaml
  - gatewayclass.yaml
  - gatewayconfig.yaml
  - httproute.yaml
  - netpol.yaml
  - securitypolicy.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: chat.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: llama-cpp
            sectionName: https
    target:
      name: llama-cpp
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - chat.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
          - name: llama-cpp
            sectionName: https
    target:
      name: llama-cpp-api
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - chat.i.shikanime.studio
          - chat.taila659a.ts.net
      - op: add
        path: /spec/parentRefs
        value:
          - name: llama-cpp
            sectionName: http
    target:
      name: llama-cpp-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/targetRefs
        value:
          - name: inference
            group: gateway.networking.k8s.io
            kind: Gateway
    target:
      name: inference
      kind: ClientTrafficPolicy
      namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: inference
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: "3.8"
secretGenerator:
  - name: inference-gateway-apikey
    namespace: shikanime
    envs:
      - inference-gateway-apikey/.enc.env
  - name: inference-llama-cpp
    namespace: shikanime
    envs:
      - inference-llama-cpp/.enc.env
