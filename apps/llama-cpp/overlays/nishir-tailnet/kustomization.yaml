resources:
  - ../nishir
  - gatewayclass.yaml
  - gatewayconfig.yaml
  - envoyproxy.yaml
  - httproute.yaml
  - netpol.yaml
  - securitypolicy.yaml
namespace: shikanime
patches:
  - target:
      name: inference
      kind: ClientTrafficPolicy
      namespace: shikanime
    path: patch-clienttrafficpolicy.yaml
  - target:
      name: llama-cpp
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [chat.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: llama-cpp
            sectionName: https
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: inference
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: "3.8"
secretGenerator:
  - name: inference-gateway-apikey
    namespace: shikanime
    envs:
      - inference-gateway-apikey/.enc.env
