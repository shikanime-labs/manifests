resources:
  - ../nishir
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: chat.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: llama-cpp
            sectionName: https
    target:
      name: llama-cpp
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: chat.taila659a.ts.net
    target:
      name: llama-cpp-api
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: chat.taila659a.ts.net
    target:
      name: llama-cpp-redirect
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: inference
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: "3.8"
