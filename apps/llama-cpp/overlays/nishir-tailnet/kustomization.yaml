resources:
  - ../nishir
  - gatewayclass.yaml
  - gateway.yaml
  - gatewayconfig.yaml
  - envoyproxy.yaml
  - netpol.yaml
  - securitypolicy.yaml
  - ui-gatewayclass.yaml
  - ui-gateway.yaml
  - ui-envoyproxy.yaml
  - ui-httproute-redirect.yaml
namespace: shikanime
patches:
  - target:
      name: inference
      kind: ClientTrafficPolicy
      namespace: shikanime
    path: patch-clienttrafficpolicy.yaml
  - target:
      name: default
      kind: AIGatewayRoute
      namespace: shikanime
    path: patch-aigatewayroute.yaml
  - target:
      name: llama-cpp
      version: v1
      kind: HTTPRoute
    path: patch-httproute.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: inference
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: "3.8"
secretGenerator:
  - name: inference-gateway-apikey
    namespace: shikanime
    envs:
      - inference-gateway-apikey/.enc.env
