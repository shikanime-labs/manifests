apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: inference
  namespace: shikanime
spec:
  # Minimal ext-proc config: enables the ai-gateway extension for the inference
  # Gateway (referenced via the aigateway.envoyproxy.io/gateway-config
  # annotation). The ai-gateway CRD requires extProc to be a non-null object, so
  # an empty kubernetes sub-object is the minimal valid form.
  extProc:
    kubernetes: {}
