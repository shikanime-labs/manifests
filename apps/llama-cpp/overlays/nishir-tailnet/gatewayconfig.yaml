apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: inference
  namespace: shikanime
spec:
  # Enables the ai-gateway ext-proc extension for the inference Gateway
  # (referenced via the aigateway.envoyproxy.io/gateway-config annotation).
  # The ai-gateway admission webhook requires extProc.kubernetes to be a
  # non-null, non-empty object; an empty map serializes as null and is
  # rejected, so a concrete env entry is the minimal valid form.
  extProc:
    kubernetes:
      env:
        - name: LOG_LEVEL
          value: info
  # Expose the Anthropic Messages endpoint so Anthropic-schema backends
  # (Z.ai GLM) can be reached without OpenAI->Anthropic translation.
  endpointConfig:
    anthropic: /anthropic