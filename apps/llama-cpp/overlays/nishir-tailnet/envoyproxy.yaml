apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: inference
  namespace: shikanime
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # The rpi4 nodes fushi/minish run a kernel/build that kills the envoy
      # data plane (CrashLoop). Pin OFF only those two; nemishi (arm64) and the
      # amd64 control-planes stay eligible so the pod can actually schedule.
      envoyDeployment:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: shikanime.dev/kernel-va
                        operator: NotIn
                        values:
                          - "39"
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      envoyService:
        # Stable name (default is envoy-<ns>-<name>-<hash>) so the tailnet
        # hostname below is independent of EG's generated names.
        name: inference
        # BYOD: expose the data plane straight through the Tailscale operator
        # (L4). Tailscale leads outside the cluster; the mTLS listener does
        # client-cert validation inside, which an L7 Ingress cannot carry.
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: inference
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: llama-cpp
  namespace: shikanime
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: shikanime.dev/kernel-va
                        operator: NotIn
                        values:
                          - "39"
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      envoyService:
        name: llama-cpp
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: llama-cpp
          tailscale.com/tags: "tag:web"
