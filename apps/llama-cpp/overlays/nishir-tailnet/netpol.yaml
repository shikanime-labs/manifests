apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama-cpp
  namespace: shikanime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp
  policyTypes:
    - Ingress
  ingress:
    # Envoy AI Gateway data plane proxies to the router. The inference
    # GatewayClass data plane runs in envoy-gateway-system (and forks into
    # envoy-system); it never runs in shikanime.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: metrics
