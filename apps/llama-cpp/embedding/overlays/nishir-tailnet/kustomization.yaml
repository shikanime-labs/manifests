apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shikanime
resources:
  - ../nishir
  - ingress.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: embedding-inference
      app.kubernetes.io/instance: qwen-embedding
      app.kubernetes.io/name: qwen-embedding
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: "3"
patches:
  - path: patch-netpol.yaml
    target:
      name: qwen-embedding
      version: v1
      kind: NetworkPolicy
