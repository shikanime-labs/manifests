version = 1

[*] n-gpu-layers = 99
flash-attn = on
no-mmap = on
ctx-size = 32000
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 2048
ubatch-size = 512
mtp-n = 1
jinja = true
stop-timeout = 2
sleep-idle-seconds = 300

[deepseek/v4-flash]
model = /models/deepseek-v4-flash-Q4_K_XL.gguf

[qwen/qwen3.8-flash]
model = /models/qwen3.8-flash-next-Q4_K_XL.gguf

[qwen/qwen3.8-27b]
model = /models/qwen3.8-27b-A15B-Q4_K_M.gguf

[z-ai/glm-5.3-flash]
model = /models/glm-5.3-flash-Q4_K_M.gguf
