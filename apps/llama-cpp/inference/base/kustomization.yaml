apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    automata.shikanime.studio/images:
      '[ { "name": "llama-cpp", "tag-regex": "^(?P<version>.+)$" } ]'
namespace: shikanime
resources:
  - netpol.yaml
  - lws.yaml
  - envoyproxy.yaml
  - gateway.yaml
  - gatewayclass.yaml
  - backend.yaml
  - aiservicebackend.yaml
  - backendsecuritypolicy.yaml
  - route.yaml
images:
  - name: llama-cpp
    newName: ghcr.io/ggml-org/llama.cpp
    newTag: server-rocm@sha256:08f4f0497de99711614f40c849621df3d645fbc433cf61bca99a3251a6f1e949
secretGenerator:
  - name: inference
    namespace: shikanime
    files:
      - inference/models-preset.ini
