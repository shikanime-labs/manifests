apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: inference
  namespace: shikanime
spec:
  replicas: 2
  leaderWorkerTemplate:
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/instance: inference
          app.kubernetes.io/name: inference
      spec:
        nodeSelector:
          feature.node.kubernetes.io/amd-gpu: "true"
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: inference
                      app.kubernetes.io/name: inference
                  topologyKey: kubernetes.io/hostname
        containers:
          - name: inference
            image: llama-cpp
            args:
              - --host
              - "0.0.0.0"
              - --port
              - "8080"
              - --models-preset
              - /etc/llama-cpp/models-preset.ini
              - --models-dir
              - /models
              - --models-max
              - "2"
            env:
              - name: HF_HUB_CACHE
                value: /models
            ports:
              - name: http
                containerPort: 8080
            readinessProbe:
              failureThreshold: 5
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 120
              periodSeconds: 15
              timeoutSeconds: 5
            resources:
              limits:
                memory: 110Gi
              requests:
                cpu: "6"
                memory: 16Gi
            volumeMounts:
              - name: dev-kfd
                mountPath: /dev/kfd
              - name: dev-dri
                mountPath: /dev/dri
              - name: models
                mountPath: /models
              - name: models-preset
                mountPath: /etc/llama-cpp
                readOnly: true
        volumes:
          - name: dev-kfd
            hostPath:
              type: CharDevice
              path: /dev/kfd
          - name: dev-dri
            hostPath:
              type: Directory
              path: /dev/dri
          - name: models
            emptyDir: {}
          - name: models-preset
            secret:
              secretName: inference
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/instance: inference
          app.kubernetes.io/name: inference
      spec:
        nodeSelector:
          feature.node.kubernetes.io/amd-gpu: "true"
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: inference
                      app.kubernetes.io/name: inference
                  topologyKey: kubernetes.io/hostname
        containers:
          - name: inference
            image: llama-cpp
            args:
              - --host
              - "0.0.0.0"
              - --port
              - "8080"
              - --models-preset
              - /etc/llama-cpp/models-preset.ini
              - --models-dir
              - /models
              - --models-max
              - "2"
            env:
              - name: HF_HUB_CACHE
                value: /models
            ports:
              - name: http
                containerPort: 8080
            readinessProbe:
              failureThreshold: 5
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 120
              periodSeconds: 15
              timeoutSeconds: 5
            resources:
              limits:
                memory: 110Gi
              requests:
                cpu: "6"
                memory: 16Gi
            volumeMounts:
              - name: dev-kfd
                mountPath: /dev/kfd
              - name: dev-dri
                mountPath: /dev/dri
              - name: models
                mountPath: /models
              - name: models-preset
                mountPath: /etc/llama-cpp
                readOnly: true
        volumes:
          - name: dev-kfd
            hostPath:
              type: CharDevice
              path: /dev/kfd
          - name: dev-dri
            hostPath:
              type: Directory
              path: /dev/dri
          - name: models
            emptyDir: {}
          - name: models-preset
            secret:
              secretName: inference
