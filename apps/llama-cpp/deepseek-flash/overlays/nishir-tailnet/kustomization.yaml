resources:
  - ../nishir
  - ingress.yaml
namespace: shikanime
labels:
  # includeTemplates:true adds the shared component/part-of/version labels to
  # pod templates. instance/name are deliberately omitted: this app dir has two
  # workloads (main + rpc-server) with distinct identities, and the label
  # transformer only sets the keys listed here — leaving each StatefulSet's own
  # instance/name untouched so spec.selector still matches its template.
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: llm-inference
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: v4-0731
patches:
  - path: patch-netpol.yaml
    target:
      name: deepseek-flash
      version: v1
      kind: NetworkPolicy
