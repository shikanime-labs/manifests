apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: deepseek-flash
  labels:
    app.kubernetes.io/name: deepseek-flash
    app.kubernetes.io/part-of: deepseek-flash
spec:
  endpoints:
    - interval: 60s
      path: /metrics
      port: http
      scrapeTimeout: 30s
  namespaceSelector:
    matchNames:
      - shikanime
  selector:
    matchLabels:
      app.kubernetes.io/instance: deepseek-flash
      app.kubernetes.io/name: deepseek-flash
