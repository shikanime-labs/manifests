apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: qwen-embedding
  labels:
    app.kubernetes.io/name: qwen-embedding
    app.kubernetes.io/part-of: qwen-embedding
spec:
  endpoints:
    - interval: 60s
      path: /metrics
      port: http
      scrapeTimeout: 30s
  namespaceSelector:
    matchNames:
      - shikanime
  selector:
    matchLabels:
      app.kubernetes.io/instance: qwen-embedding
      app.kubernetes.io/name: qwen-embedding
