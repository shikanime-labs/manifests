apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: llama-cpp-local
  labels:
    app.kubernetes.io/name: llama-cpp
    app.kubernetes.io/part-of: nishir-inference
spec:
  endpoints:
    - interval: 60s
      path: /metrics
      params:
        model:
          - qwen/qwen3.8-flash
        autoload:
          - "false"
      port: http
      scrapeTimeout: 30s
      relabelConfigs:
        - targetLabel: model
          replacement: qwen/qwen3.8-flash
        - targetLabel: instance
          replacement: llama-cpp-local-qwen3.8-flash
    - interval: 60s
      path: /metrics
      params:
        model:
          - qwen/qwen3.8-27b
        autoload:
          - "false"
      port: http
      scrapeTimeout: 30s
      relabelConfigs:
        - targetLabel: model
          replacement: qwen/qwen3.8-27b
        - targetLabel: instance
          replacement: llama-cpp-local-qwen3.8-27b
    - interval: 60s
      path: /metrics
      params:
        model:
          - qwen/qwen3-embedding-8b
        autoload:
          - "false"
      port: http
      scrapeTimeout: 30s
      relabelConfigs:
        - targetLabel: model
          replacement: qwen/qwen3-embedding-8b
        - targetLabel: instance
          replacement: llama-cpp-local-qwen3-embedding-8b
  namespaceSelector:
    matchNames:
      - shikanime
  selector:
    matchLabels:
      app.kubernetes.io/instance: llama-cpp-local
      app.kubernetes.io/name: llama-cpp
