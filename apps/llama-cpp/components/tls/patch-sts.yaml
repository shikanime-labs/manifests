apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llama-cpp
  namespace: shikanime
spec:
  template:
    spec:
      containers:
        - name: llama-cpp
          env:
            - name: LLAMA_ARG_CORS_ORIGINS
              value: https://inference.i.shikanime.studio
            - name: LLAMA_ARG_SSL_KEY_FILE
              value: /etc/ssl/private/tls.key
            - name: LLAMA_ARG_SSL_CERT_FILE
              value: /etc/ssl/private/tls.crt
          volumeMounts:
            - name: tls
              mountPath: /etc/ssl/private
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: llama-cpp-tls
