# Require client certificates signed by the nishir CA on the listener;
# the trust-manager Bundle mirrors that CA into every namespace.
# connection.bufferLimit raises EG's 32kiB default per-downstream buffer so
# large LLM request/response bodies don't stall on the listener.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: inference
  namespace: shikanime
spec:
  targetRefs:
    - name: inference
      group: gateway.networking.k8s.io
      kind: Gateway
  tls:
    clientValidation:
      caCertificateRefs:
        - name: nishir-ca-certificates.crt
          group: ""
          kind: ConfigMap
  connection:
    bufferLimit: 8Mi
