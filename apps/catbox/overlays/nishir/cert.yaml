apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-automata
  namespace: shikanime
spec:
  commonName: automata.i.shikanime.studio
  dnsNames:
    - automata.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-automata
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-automata-a2a
  namespace: shikanime
spec:
  commonName: a2a.automata.i.shikanime.studio
  dnsNames:
    - a2a.automata.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-automata-a2a
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-automata-api
  namespace: shikanime
spec:
  commonName: api.automata.i.shikanime.studio
  dnsNames:
    - api.automata.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-automata-api
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hermes-agent
spec:
  gatewayClassName: hermes-agent
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: studio-shikanime-i-automata
            group: ""
            kind: Secret
          - name: studio-shikanime-i-automata-api
            group: ""
            kind: Secret
          - name: studio-shikanime-i-automata-a2a
            group: ""
            kind: Secret
