resources:
  - httproutes.yaml
  - pvc.yaml
  - svc.yaml
  - vm.yaml
secretGenerator:
  - name: catbox-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/catbox:a6e257af@sha256:2de4080a3bf6f72ff8fde6acdad04214dc3a2d57457149ce92821f6f5b36a1fb
    target:
      name: catbox
      kind: VirtualMachine
