resources:
  - httproutes.yaml
  - pvc.yaml
  - svc.yaml
  - vm.yaml
secretGenerator:
  - name: catbox-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/catbox:d0087b6c@sha256:019489ff36c901bd206aaabb16019fc76c17d141f21f2e669dbb94eb60ae874c
    target:
      name: catbox
      kind: VirtualMachine
