resources:
  - httproutes.yaml
  - pvc.yaml
  - svc.yaml
  - vm.yaml
secretGenerator:
  - name: catbox-authorized-keys
    options:
      disableNameSuffixHash: true
    files:
      - authorized-keys/userdata
configurations:
  - namereference.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/containerDisk/image
        value: ghcr.io/shikanime-labs/machines/catbox:latest@sha256:c790de09faac6b16bd5ae78fb5492629acb59288f2bd31f08a5ef887feaa9280
    target:
      name: catbox
      kind: VirtualMachine
