apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: catbox
spec:
  # Always keeps the guest running and auto-restarts it on failure.
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: catbox
        app.kubernetes.io/name: catbox
    spec:
      networks:
        - name: default
          pod: {}
      # KubeVirt boots an x86_64 qcow2, so the guest is infeasible on arm64
      # nodes. Select amd64 generically rather than pinning one node.
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        - name: rootdisk
          containerDisk:
            image: catbox
        - name: workspaces
          persistentVolumeClaim:
            claimName: catbox-workspaces
        - name: sops-key
          secret:
            secretName: catbox-sops-key
      accessCredentials:
        - sshPublicKey:
            propagationMethod:
              noCloud:
                source:
                  secret:
                    secretName: catbox-authorized-keys
      domain:
        resources:
          requests:
            memory: 4Gi
            cpu: "1"
        machine:
          type: q35
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: workspaces
              disk:
                bus: virtio
          filesystems:
            - name: sops-key
              virtiofs: {}
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
                - name: mdns
                  port: 5353
                  protocol: UDP
