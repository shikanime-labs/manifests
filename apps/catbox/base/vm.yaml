apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: catbox
spec:
  # Always keeps the guest running and auto-restarts it on failure.
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: catbox
        app.kubernetes.io/name: catbox
    spec:
      networks:
        - name: default
          pod: {}
      # KubeVirt boots an x86_64 qcow2, so the guest is infeasible on arm64
      # nodes. Select amd64 generically rather than pinning one node.
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        # KubeVirt containerDisk: the NixOS qcow2 (nixos.qcow2) lives at /disk.
        # CDI is absent in this cluster, so the VM boots directly from the image.
        - name: rootdisk
          containerDisk:
            image: catbox
        - name: workspaces
          persistentVolumeClaim:
            claimName: catbox-workspaces
        - name: sops-key
          secret:
            secretName: catbox-sops-key
      domain:
        resources:
          requests:
            memory: 4Gi
            cpu: "1"
        machine:
          type: q35
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: workspaces
              disk:
                bus: virtio
          # The sops-key secret volume is exposed to the guest via virtiofs
          # (secret-as-filesystem is GA in KubeVirt 1.7); the guest mounts the
          # tag at /var/lib/sops-nix for sops-nix to read its age key.
          filesystems:
            - name: sops-key
              virtiofs: {}
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
                - name: mdns
                  port: 5353
                  protocol: UDP
