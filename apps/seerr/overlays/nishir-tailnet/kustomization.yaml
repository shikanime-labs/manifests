resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: seerr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: seerr
            sectionName: http
    target:
      name: seerr-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: seerr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: seerr
            sectionName: https
    target:
      name: seerr
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: library-manager
      app.kubernetes.io/instance: seerr
      app.kubernetes.io/name: seerr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 3.3.0
