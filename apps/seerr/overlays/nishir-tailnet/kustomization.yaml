resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
patches:
  - path: patch-httproute-seerr.yaml
    target:
      name: seerr
      kind: HTTPRoute
  - path: patch-httproute-seerr-redirect.yaml
    target:
      name: seerr-redirect
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: library-manager
      app.kubernetes.io/instance: seerr
      app.kubernetes.io/name: seerr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 3.3.0
