apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seerr
spec:
  template:
    spec:
      initContainers:
        - name: config-sync
          image: rclone
          args:
            - copyto
            - --copy-links
            - /mnt/startup-config/settings.json
            - /mnt/config/settings.json
          command:
            - rclone
          volumeMounts:
            - name: config
              mountPath: /mnt/config
            - name: startup-config
              mountPath: /mnt/startup-config
              readOnly: true
          securityContext:
            capabilities:
              add:
                - FOWNER
      volumes:
        - name: startup-config
          secret:
            secretName: seerr
