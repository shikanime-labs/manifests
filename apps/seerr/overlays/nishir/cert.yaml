  namespace: shikanime
spec:
  commonName: seerr.i.shikanime.studio
  dnsNames:
    - seerr.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-seerr
