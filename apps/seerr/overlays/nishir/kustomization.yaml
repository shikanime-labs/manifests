resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - path: patch-sts.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - seerr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: seerr
          sectionName: https
    target:
      name: seerr
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - seerr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: seerr
          sectionName: https
    target:
      name: seerr-redirect
      kind: HTTPRoute
secretGenerator:
  - name: seerr
    files:
      - settings.json=seerr/config.enc.yaml
