resources:
  - ../../base
  - gateway.yaml
namespace: shikanime
patches:
  - path: patch-pvc.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - seerr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: seerr
          sectionName: https
    target:
      kind: HTTPRoute
      name: seerr
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - seerr.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: seerr
          sectionName: http
    target:
      kind: HTTPRoute
      name: seerr-redirect
