apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seerr
spec:
  template:
    spec:
      containers:
        - name: seerr
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-certificates.crt
      volumes:
        - name: startup-config
          secret:
            secretName: seerr
      initContainers:
        - name: config-sync
          volumeMounts:
            - name: startup-config
              mountPath: /mnt/startup-config
              readOnly: true
