resources:
  - ../../base
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: inference
      app.kubernetes.io/instance: llama-cpp-leader
      app.kubernetes.io/name: llama-cpp-leader
      app.kubernetes.io/part-of: nishir-inference
      app.kubernetes.io/version: 0.0.0
patches:
  - patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: envoy-gateway-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
          ports:
            - port: http
    target:
      name: llama-cpp-leader
      kind: NetworkPolicy
  - patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: vmagent
          ports:
            - port: http
    target:
      name: llama-cpp-leader
      kind: NetworkPolicy
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LLAMA_ARG_CORS_ORIGINS
          value: https://inference.i.shikanime.studio
    target:
      name: llama-cpp-leader
      kind: StatefulSet
secretGenerator:
  - name: llama-cpp-leader-key
    namespace: shikanime
    options:
      disableNameSuffixHash: true
    envs:
      - llama-cpp-leader-key/.enc.env
