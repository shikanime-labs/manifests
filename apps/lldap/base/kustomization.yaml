apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    automata.shikanime.studio/images:
      '[ { "name": "lldap", "tag-regex": "^(?P<version>.+)$" } ]'
resources:
  - netpol.yaml
  - sts.yaml
  - svc.yaml
  - pvc.yaml
  - vpa.yaml
images:
  - name: lldap
    newName: lldap/lldap
    newTag: 2026-08-08-debian
