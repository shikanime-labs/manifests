apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: lldap
      app.kubernetes.io/name: lldap
  serviceName: lldap
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: lldap
        app.kubernetes.io/name: lldap
    spec:
      containers:
        - name: lldap
          image: lldap
          ports:
            - name: ldap
              containerPort: 3890
          livenessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 5
            timeoutSeconds: 5
          env:
            - name: TZ
              value: Europe/Paris
          envFrom:
            - secretRef:
                name: lldap
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lldap-data
