apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lldap
spec:
  template:
    spec:
      containers:
        - name: lldap
          ports:
            - name: ldaps
              containerPort: 6360
          volumeMounts:
            - name: tls
              mountPath: /data/ldap_tls
              readOnly: true
          env:
            - name: LLDAP_LDAPS_OPTIONS__ENABLED
              value: "true"
            - name: LLDAP_LDAPS_OPTIONS__CERT_FILE
              value: /data/ldap_tls/tls.crt
            - name: LLDAP_LDAPS_OPTIONS__KEY_FILE
              value: /data/ldap_tls/tls.key
      volumes:
        - name: tls
          secret:
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                mode: 416
                path: tls.key
            secretName: lldap-tls
