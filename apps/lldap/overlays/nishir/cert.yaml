apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lldap-tls
spec:
  commonName: lldap
  dnsNames:
    - lldap
    - lldap.shikanime
    - lldap.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  secretName: lldap-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
