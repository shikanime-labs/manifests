resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
namespace: shikanime
components:
  - ../../components/tls
patches:
  - path: patch-pvc.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - lldap.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: lldap
          sectionName: https
    target:
      kind: HTTPRoute
      name: lldap
secretGenerator:
  - name: lldap
    envs:
      - lldap/.enc.env
