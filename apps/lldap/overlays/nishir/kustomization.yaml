resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
namespace: shikanime
components:
  - ../../components/tls
patches:
  - path: patch-pvc.yaml
  - patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: envoy-gateway-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
          ports:
            - port: http
    target:
      name: lldap
      kind: NetworkPolicy
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - lldap.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: lldap
          sectionName: https
    target:
      name: lldap
      kind: HTTPRoute
secretGenerator:
  - name: lldap
    envs:
      - lldap/.enc.env
