resources:
  - ../nishir
  - envoyproxy.yaml
  - gatewayclass.yaml
  - httproute.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: lldap.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: lldap
            sectionName: http
    target:
      name: lldap-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: lldap.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: lldap
            sectionName: https
    target:
      name: lldap
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: ldap-provider
      app.kubernetes.io/instance: lldap
      app.kubernetes.io/name: lldap
      app.kubernetes.io/part-of: nishir-platform
      app.kubernetes.io/version: 2026-08-08-debian
