resources:
  - ../nishir
  - gateway.yaml
  - gatewayclass.yaml
  - envoyproxy.yaml
  - httproute.yaml
namespace: shikanime
patches:
  - path: patch-httproute.yaml
    target:
      name: lldap
      version: v1
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: ldap-provider
      app.kubernetes.io/instance: lldap
      app.kubernetes.io/name: lldap
      app.kubernetes.io/part-of: nishir-platform
      app.kubernetes.io/version: 2026-08-08-debian
