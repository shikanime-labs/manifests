resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
  - tcproute.yaml
  - httproute.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: version-control-server
      app.kubernetes.io/instance: forgejo
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/part-of: nishir-platform
      app.kubernetes.io/version: 15.0.6-rootless
patches:
  - path: patch-netpol.yaml
    target:
      name: forgejo
      version: v1
      kind: NetworkPolicy
secretGenerator:
  - name: forgejo-config
    files:
      - app.ini=forgejo/app.enc.ini
