resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: version-control-server
      app.kubernetes.io/instance: forgejo
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/part-of: nishir-platform
      app.kubernetes.io/version: 15.0.6-rootless
patches:
  - path: patch-httproute-forgejo.yaml
    target:
      name: forgejo
      kind: HTTPRoute
  - path: patch-httproute-forgejo-redirect.yaml
    target:
      name: forgejo-redirect
      kind: HTTPRoute
secretGenerator:
  - name: forgejo-config
    files:
      - app.ini=forgejo/app.enc.ini
