apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: network.speed.2.5g
                    operator: In
                    values:
                      - "true"
              weight: 50
      volumes:
        - name: startup-config
          secret:
            secretName: forgejo-config
      containers:
        - name: forgejo
          volumeMounts:
            - name: startup-config
              mountPath: /var/lib/gitea/custom/conf/app.ini
              readOnly: true
              subPath: app.ini
