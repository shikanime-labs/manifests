apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forgejo-tls
spec:
  commonName: forgejo
  dnsNames:
    - forgejo
    - forgejo.shikanime
    - forgejo.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  secretName: forgejo-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
