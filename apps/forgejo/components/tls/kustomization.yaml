apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - backendtlspolicy.yaml
patches:
  - path: patch-sts.yaml
  - path: patch-svc.yaml
  - patch: |-
      - op: add
        path: /spec/rules
        value:
        - backendRefs:
          - name: forgejo
            port: 443
    target:
      kind: HTTPRoute
      name: forgejo
