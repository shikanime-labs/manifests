apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-env
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-env
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-env
                  key: password
