apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: immich-postgres
      app.kubernetes.io/name: postgres
  serviceName: immich-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: immich-postgres
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres
          args:
            - -c
            - shared_preload_libraries=vectors.so
            - -c
            - search_path="$user", public, vectors
            - -c
            - logging_collector=on
            - -c
            - max_wal_size=2GB
            - -c
            - wal_compression=on
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run-postgresql
              mountPath: /var/run/postgresql
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$(POSTGRES_USER)" -d "$(POSTGRES_DB)"
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$(POSTGRES_USER)" -d "$(POSTGRES_DB)"
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            capabilities:
              add:
                - CHOWN
                - FOWNER
                - SETUID
                - SETGID
                - DAC_OVERRIDE
            runAsGroup: 999
            runAsUser: 999
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$(POSTGRES_USER)" -d "$(POSTGRES_DB)"
            failureThreshold: 180
            periodSeconds: 5
            timeoutSeconds: 5
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: db-database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: db-password
      initContainers:
        - name: init-chown
          image: immich-postgres
          command:
            - sh
            - -c
            - chown -R 999:999 /var/lib/postgresql/data /var/run/postgresql
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run-postgresql
              mountPath: /var/run/postgresql
          securityContext:
            capabilities:
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
              drop:
                - ALL
            runAsUser: 0
      securityContext:
        fsGroup: 999
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres-data
        - name: run-postgresql
          emptyDir: {}
