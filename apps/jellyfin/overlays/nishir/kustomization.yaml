resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
namespace: shikanime
components:
  - ../../components/tls
  - ../../components/ldap
  - ../../components/gpu
configurations:
  - namereference.yaml
images:
  - name: rclone
    newName: rclone/rclone
    newTag: 1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
patches:
  - path: patch-pvc.yaml
  - path: patch-sts.yaml
  - path: patch-httproute.yaml
secretGenerator:
  - name: jellyfin-pkcs12-password
    envs:
      - jellyfin-pkcs12-password/.enc.env
  - name: jellyfin-ldap
    files:
      - LDAP-Auth.xml=jellyfin-ldap/LDAP-Auth.enc.xml
