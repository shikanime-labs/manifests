apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
spec:
  template:
    spec:
      containers:
        - name: jellyfin
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: 100.64.0.0/10=jellyfin.i.shikanime.studio,10.0.0.0/8=jellyfin.i.shikanime.studio,192.168.0.0/16=jellyfin.i.shikanime.studio
            - name: JELLYFIN_EnableHttps
              value: "true"
            - name: JELLYFIN_RequireHttps
              value: "true"
            - name: JELLYFIN_CertificatePath
              value: /etc/ssl/private/keystore.p12
            - name: JELLYFIN_PublicHttpPort
              value: "80"
            - name: JELLYFIN_PublicHttpsPort
              value: "443"
