resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - backendtlspolicy.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: media-server
      app.kubernetes.io/instance: jellyfin
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 10.11.11
patches:
  - path: patch-httproute-jellyfin.yaml
    target:
      name: jellyfin
      kind: HTTPRoute
  - path: patch-httproute-jellyfin-https.yaml
    target:
      name: jellyfin-https
      kind: HTTPRoute
  - path: patch-httproute-jellyfin-redirect.yaml
    target:
      name: jellyfin-redirect
      kind: HTTPRoute
