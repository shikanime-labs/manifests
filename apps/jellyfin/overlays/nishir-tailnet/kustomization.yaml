resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - backendtlspolicy.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: media-server
      app.kubernetes.io/instance: jellyfin
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 10.11.11
patches:
  - target:
      name: jellyfin
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [jellyfin.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: jellyfin
            sectionName: http
  - target:
      name: jellyfin-https
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [jellyfin.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: jellyfin
            sectionName: https
  - target:
      name: jellyfin-redirect
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [jellyfin.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: jellyfin
            sectionName: http
  - path: patch-sts.yaml
    target:
      name: jellyfin
      version: v1
      kind: StatefulSet
