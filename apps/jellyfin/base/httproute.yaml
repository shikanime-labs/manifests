---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
spec:
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
      # it mid-body.
      timeouts:
        request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-api
spec:
  rules:
    - matches:
        - headers:
            - name: X-Api-Key
              type: RegularExpression
              value: .+
      backendRefs:
        - name: jellyfin
          port: 8096
      timeouts:
        request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-redirect
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
