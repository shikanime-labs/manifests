apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authelia-postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: authelia-postgres-env
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: authelia-postgres-env
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authelia-postgres-env
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
