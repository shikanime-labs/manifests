apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-postgres
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: authelia
      ports:
        - port: postgres
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: authelia-postgres
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
