apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-bazarr
  namespace: shikanime
spec:
  commonName: bazarr.i.shikanime.studio
  dnsNames:
    - bazarr.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-bazarr
  usages:
    - digital signature
    - key encipherment
    - server auth
