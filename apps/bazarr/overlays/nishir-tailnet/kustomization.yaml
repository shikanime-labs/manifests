resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: bazarr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: bazarr
            sectionName: http
    target:
      name: bazarr-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: bazarr.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: bazarr
            sectionName: https
    target:
      name: bazarr
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: library-manager
      app.kubernetes.io/instance: bazarr
      app.kubernetes.io/name: bazarr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 1.5.6
