resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
patches:
  - path: patch-httproute-bazarr.yaml
    target:
      name: bazarr
      kind: HTTPRoute
  - path: patch-httproute-bazarr-redirect.yaml
    target:
      name: bazarr-redirect
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: library-manager
      app.kubernetes.io/instance: bazarr
      app.kubernetes.io/name: bazarr
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 1.5.6
