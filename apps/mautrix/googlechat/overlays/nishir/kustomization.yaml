resources:
  - ../../base
patches:
  - path: patch-pvc.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - mautrix-googlechat.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: googlechat
          sectionName: https
    target:
      kind: HTTPRoute
      name: googlechat
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - mautrix-googlechat.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
