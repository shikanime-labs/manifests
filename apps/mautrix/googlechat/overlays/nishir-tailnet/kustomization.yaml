resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
  - vmservicescrape.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: mautrix-googlechat.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: googlechat
            sectionName: http
    target:
      name: googlechat-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: mautrix-googlechat.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: googlechat
            sectionName: https
    target:
      name: googlechat
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: communication
      app.kubernetes.io/instance: mautrix-googlechat
      app.kubernetes.io/name: mautrix-googlechat
      app.kubernetes.io/part-of: nishir-office
      app.kubernetes.io/version: 0.5.2
secretGenerator:
  - name: mautrix-googlechat
    files:
      - config.yaml=matrix-googlechat/config.enc.yaml
      - doublepuppet.yaml=matrix-googlechat/doublepuppet.enc.yaml
      - registration.yaml=matrix-googlechat/registration.enc.yaml
    options:
      disableNameSuffixHash: true
