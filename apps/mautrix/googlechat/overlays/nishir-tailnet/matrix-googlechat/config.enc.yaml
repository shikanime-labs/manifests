  bot_avatar: mxc://maunium.net/BDIWAQcbpPGASPUUBuEGWXnQ
  bot_displayname: Google Chat bridge bot
  bot_username: googlechatbot
  database: sqlite:/data/googlechat.db
  ephemeral_events: true
  hostname: 0.0.0.0
  hs_token: ENC[AES256_GCM,data:ryxLNYbb+xOfF+Ko4QxoRzIdZR0wEmsXMXMWLzCO3VU+Hn99yZrNUI2VOo8I7XECjB4uMMdUxfpD1+qLYoVmmQ==,iv:GVs1uxb/QUBo1B0kG9tJWxZU9LgjmHLZ8zeQNg5QmYk=,tag:MvyGaAUPmLiCx9V7m5pF2g==,type:str]
  max_body_size: 1
  port: 29320
  database_opts:
    max_size: 10
    min_size: 1
bridge:
  backfill:
    disable_notifications: false
    initial_nonthread_limit: 100
    initial_thread_limit: 10
    initial_thread_reply_limit: 500
    invite_own_puppet: true
    missed_event_limit: 5000
    missed_event_page_size: 100
  command_prefix: "!gc"
  delivery_error_reports: true
  delivery_receipts: false
  disable_bridge_notices: false
  displayname_template: "{full_name} (Google Chat)"
  double_puppet_allow_discovery: false
  double_puppet_server_map:
    anotherserver.example.org: https://matrix.anotherserver.example.org
  encryption:
    allow: true
    allow_key_sharing: false
    appservice: false
    default: true
    delete_keys:
      delete_fully_used_on_decrypt: true
      delete_on_device_delete: true
      delete_outbound_on_ack: false
      delete_outdated_inbound: true
      delete_prev_on_new_session: true
      dont_store_outbound: true
      periodically_delete_expired: true
      ratchet_on_decrypt: true
    require: false
    rotation:
      disable_device_change_key_rotation: false
      enable_custom: false
      messages: 100
      milliseconds: 6.048e+08
    self_sign: true
    verification_levels:
      receive: cross-signed-tofu
      send: cross-signed-tofu
      share: cross-signed-tofu
  federate_rooms: true
  initial_chat_sync: 10
  invite_own_puppet_to_pm: false
  login_shared_secret_map:
    matrix.i.shikanime.studio: ENC[AES256_GCM,data:1+lqtj/QeQYa+R7Y9jOTM5h8kZAcoRcXJV3MKecnZaSEUqtaP9rdCNih23QYq3WPdS/IeQ7jzr6WEPIdd+A4Ug==,iv:+Zfl5O4D6KwT6IxnVQVMtNsO+QzUSN21qjCGvxM99gk=,tag:1t/QIx+EsM577IgEh165kQ==,type:str]
  message_status_events: false
  permissions:
    "@root:matrix.i.shikanime.studio": admin
    matrix.i.shikanime.studio: user
  private_chat_portal_meta: default
  provisioning:
    prefix: /_matrix/provision
    shared_secret: ENC[AES256_GCM,data:r2+YcLPOItXpv4LA87ELajEdG/ImiqusLa2r8UkDeH1z457pEeOmGu8IA8xhN3Jt/3KuVOb7VV//W+l3jqaQvA==,iv:c9fonHGwpZZphMHDsjV+qOPcVXQIPTLsAQzI6V3WI2Q=,tag:ePjY/Ecyevrc8OGeZSaluA==,type:str]
  resend_bridge_info: false
  sync_direct_chat_list: false
  sync_with_custom_puppets: false
  unimportant_bridge_notices: false
  update_avatar_initial_sync: true
  username_template: googlechat_{userid}
homeserver:
  address: https://synapse.shikanime.svc.cluster.local:8448
  async_media: false
  domain: matrix.i.shikanime.studio
  http_retry_count: 4
  message_send_checkpoint_endpoint: null
  software: standard
  status_endpoint: null
  verify_ssl: true
logging:
  version: 1
  formatters:
    colored:
      (): mautrix_googlechat.util.ColorFormatter
      format: "[%(asctime)s] [%(levelname)s@%(name)s] %(message)s"
    normal:
      format: "[%(asctime)s] [%(levelname)s@%(name)s] %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      formatter: colored
  loggers:
    aiohttp:
      level: INFO
    mau:
      level: DEBUG
    maugclib:
      level: INFO
  root:
    handlers:
      - console
    level: DEBUG
manhole:
  enabled: true
  path: /var/tmp/mautrix-googlechat.manhole
  whitelist:
    - 0
metrics:
  enabled: true
  listen_port: 9100
