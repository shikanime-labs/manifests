---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: googlechat
spec:
  rules:
    - backendRefs:
        - name: mautrix-googlechat
          port: 29320
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: googlechat-redirect
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
