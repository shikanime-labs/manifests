resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
  - httproute-redirect.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: communication
      app.kubernetes.io/instance: mautrix-signal
      app.kubernetes.io/name: mautrix-signal
      app.kubernetes.io/part-of: nishir-office
      app.kubernetes.io/version: 0.2607.0
patches:
  - path: patch-httproute.yaml
    target:
      name: signal
      version: v1
      kind: HTTPRoute
secretGenerator:
  - name: mautrix-signal
    files:
      - config.yaml=matrix-signal/config.enc.yaml
      - doublepuppet.yaml=matrix-signal/doublepuppet.enc.yaml
      - registration.yaml=matrix-signal/registration.enc.yaml
    options:
      disableNameSuffixHash: true
patches:
  - path: patch-httproute.yaml
    target:
      name: signal
      version: v1
      kind: HTTPRoute
