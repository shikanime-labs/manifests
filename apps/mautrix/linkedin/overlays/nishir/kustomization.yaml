resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
patches:
  - path: patch-pvc.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - mautrix-linkedin.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: linkedin
          sectionName: https
    target:
      name: linkedin
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - mautrix-linkedin.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: linkedin
          sectionName: http
    target:
      name: linkedin-redirect
      kind: HTTPRoute
