resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - target:
      name: linkedin
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [mautrix-linkedin.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: linkedin
            sectionName: https
  - target:
      name: linkedin-redirect
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [mautrix-linkedin.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: linkedin
            sectionName: http
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: communication
      app.kubernetes.io/instance: mautrix-linkedin
      app.kubernetes.io/name: mautrix-linkedin
      app.kubernetes.io/part-of: nishir-office
      app.kubernetes.io/version: 0.2604.0
secretGenerator:
  - name: mautrix-linkedin
    files:
      - config.yaml=matrix-linkedin/config.enc.yaml
      - doublepuppet.yaml=matrix-linkedin/doublepuppet.enc.yaml
      - registration.yaml=matrix-linkedin/registration.enc.yaml
    options:
      disableNameSuffixHash: true
