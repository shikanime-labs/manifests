- op: add
  path: /spec/ingress/-
  value:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: envoy-gateway-system
        podSelector:
          matchLabels:
            app.kubernetes.io/name: envoy
    ports:
      - port: http
- op: add
  path: /spec/ingress/-
  value:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: flux-system
        podSelector:
          matchLabels:
            app.kubernetes.io/component: vmagent
            app.kubernetes.io/instance: victoriametrics
