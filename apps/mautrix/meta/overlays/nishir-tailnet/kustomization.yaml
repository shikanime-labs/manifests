resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - path: patch-httproute.yaml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: communication
      app.kubernetes.io/instance: mautrix-meta
      app.kubernetes.io/name: mautrix-meta
      app.kubernetes.io/part-of: nishir-office
      app.kubernetes.io/version: 0.2607.0
secretGenerator:
  - name: mautrix-meta
    files:
      - config.yaml=matrix-meta/config.enc.yaml
      - doublepuppet.yaml=matrix-meta/doublepuppet.enc.yaml
      - registration.yaml=matrix-meta/registration.enc.yaml
    options:
      disableNameSuffixHash: true
