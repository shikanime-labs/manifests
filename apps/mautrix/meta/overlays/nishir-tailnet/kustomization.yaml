resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - target:
      name: meta
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [mautrix-meta.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: meta
            sectionName: https
  - target:
      name: meta-redirect
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [mautrix-meta.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: meta
            sectionName: http
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: communication
      app.kubernetes.io/instance: mautrix-meta
      app.kubernetes.io/name: mautrix-meta
      app.kubernetes.io/part-of: nishir-office
      app.kubernetes.io/version: 0.2607.0
secretGenerator:
  - name: mautrix-meta
    files:
      - config.yaml=matrix-meta/config.enc.yaml
      - doublepuppet.yaml=matrix-meta/doublepuppet.enc.yaml
      - registration.yaml=matrix-meta/registration.enc.yaml
    options:
      disableNameSuffixHash: true
