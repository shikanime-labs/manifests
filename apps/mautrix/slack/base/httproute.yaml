---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slack
spec:
  rules:
    - backendRefs:
        - name: mautrix-slack
          port: 29335
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slack-redirect
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
