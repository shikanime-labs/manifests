apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: slack
spec:
  gatewayClassName: slack
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: studio-shikanime-i-slack
            group: ""
            kind: Secret
