        delete_on_device_delete: true
        delete_outbound_on_ack: false
        delete_outdated_inbound: true
        delete_prev_on_new_session: true
        dont_store_outbound: true
        periodically_delete_expired: true
        ratchet_on_decrypt: true
    msc4190: false
    pickle_key: ENC[AES256_GCM,data:+Ti/98PZXTVHHnVtiPBSpBrwVgPSFhzVHvqgwIjAfMZKywjt/cEuKaEuUysKUSAd3jsTtLUF7y8+dSLJX0Mx4A==,iv:PQNqnu9VKKBqS6h1q5b6jupdSprmQXmWvx5z92BdojM=,tag:hQSgROJoFtVtmvvwuoC0Jg==,type:str]
