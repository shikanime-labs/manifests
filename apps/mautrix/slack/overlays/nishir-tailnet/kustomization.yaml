resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames
        value: [mautrix-slack.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: slack
            sectionName: http
    target:
      name: slack-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value: [mautrix-slack.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: slack
            sectionName: https
    target:
      name: slack
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: communication
      app.kubernetes.io/instance: mautrix-slack
      app.kubernetes.io/name: mautrix-slack
      app.kubernetes.io/part-of: nishir-office
      app.kubernetes.io/version: 0.2607.0
secretGenerator:
  - name: mautrix-slack
    files:
      - config.yaml=matrix-slack/config.enc.yaml
      - doublepuppet.yaml=matrix-slack/doublepuppet.enc.yaml
      - registration.yaml=matrix-slack/registration.enc.yaml
    options:
      disableNameSuffixHash: true
