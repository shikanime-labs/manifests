resources:
  - ../../base
patches:
  - path: patch-pvc.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - mautrix-twitter.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: twitter
          sectionName: https
    target:
      kind: HTTPRoute
      name: twitter
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - mautrix-twitter.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: twitter
          sectionName: http
    target:
      kind: HTTPRoute
      name: twitter-redirect
