resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - target:
      name: discord
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [mautrix-discord.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: discord
            sectionName: https
  - target:
      name: discord-redirect
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [mautrix-discord.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: discord
            sectionName: http
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: communication
      app.kubernetes.io/instance: mautrix-discord
      app.kubernetes.io/name: mautrix-discord
      app.kubernetes.io/part-of: nishir-office
      app.kubernetes.io/version: 0.7.6
secretGenerator:
  - name: mautrix-discord
    files:
      - config.yaml=matrix-discord/config.enc.yaml
      - doublepuppet.yaml=matrix-discord/doublepuppet.enc.yaml
      - registration.yaml=matrix-discord/registration.enc.yaml
    options:
      disableNameSuffixHash: true
