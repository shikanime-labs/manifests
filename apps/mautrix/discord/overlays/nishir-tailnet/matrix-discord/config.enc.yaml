bridge:
  animated_sticker:
    args:
      fps: 25
      height: 320
      width: 320
    target: webp
  autojoin_thread_on_open: true
  avatar_proxy_key: ENC[AES256_GCM,data:hFxubuBC8W8mAeba7C/dDr9GjIluuJsY7dA+yclpqd8=,iv:7VKr5A4hEK3Bea88Hg9UhI7PRE+QtRIMb3wqe2yRdhI=,tag:4pPLbuPQ5ScLX5raXbSn7A==,type:str]
