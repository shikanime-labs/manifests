bridge:
  animated_sticker:
    args:
      fps: 25
      height: 320
      width: 320
    target: webp
  autojoin_thread_on_open: true
  avatar_proxy_key: ENC[AES256_GCM,data:bLyMcR/yxS1yeHJkOTxaFlhoNtij0RZgDYDoLXIUBpg=,iv:aP1wGnaq88X9Sx8Cyuj556ATncRPDfWMJkBcZPwXcSI=,tag:/p3+ORT3goiL2ia7IEhHiw==,type:str]
