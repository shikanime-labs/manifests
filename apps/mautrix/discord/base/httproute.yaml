---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: discord
spec:
  rules:
    - backendRefs:
        - name: mautrix-discord
          port: 29334
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: discord-redirect
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
