apiVersion: v1
kind: PersistentVolume
metadata:
  name: llama-cpp-worker-cache
spec:
  capacity:
    storage: 256Gi
  accessModes:
    - ReadWriteOncePod
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/cache/llama-cpp
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kushira
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-worker-cache
spec:
  volumeName: llama-cpp-worker-cache
  accessModes:
    - ReadWriteOncePod
  storageClassName: ""
  resources:
    requests:
      storage: 256Gi
