apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llama-cpp-worker
  namespace: shikanime
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  serviceName: llama-cpp-worker
  replicas: 1
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        resources:
          requests:
            storage: 256Gi
        storageClassName: nishir-ephemeral
        accessModes:
          - ReadWriteOncePod
  selector:
    matchLabels:
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: llama-cpp
        app.kubernetes.io/name: llama-cpp-worker
    spec:
      securityContext:
        fsGroup: 65532
      nodeSelector:
        feature.node.kubernetes.io/pci-0380_1002.present: "true"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: feature.node.kubernetes.io/network.speed.10g
                    operator: In
                    values:
                      - "true"
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: llama-cpp-leader
              topologyKey: kubernetes.io/hostname
      containers:
        - name: llama-cpp-worker
          image: llama-cpp-rpc
          command:
            - ggml-rpc-server
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          args:
            - --host
            - 0.0.0.0
            - --port
            - "50052"
            - --cache
          env:
            - name: LLAMA_CACHE
              value: /cache
          ports:
            - name: rpc
              containerPort: 50052
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-dri
              mountPath: /dev/dri
      volumes:
        - name: dev-kfd
          hostPath:
            type: CharDevice
            path: /dev/kfd
        - name: dev-dri
          hostPath:
            type: Directory
            path: /dev/dri
