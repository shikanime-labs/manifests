# Deterministic addresses for the Multus thunderbolt attachments. Whereabouts
# honors an OverlappingRangeIPReservation named after the IP by excluding it
# from dynamic allocation and assigning it to the reserved pod. The llama-cpp
# leader dials rpc servers by these literal addresses (LLAMA_ARG_RPC), so the
# podref pins are the contract that keeps the dial string correct across any
# pod recreation order.
apiVersion: whereabouts.cni.cncf.io/v1alpha1
kind: OverlappingRangeIPReservation
metadata:
  name: 10.66.0.3
spec:
  podref: shikanime/llama-cpp-0
---
apiVersion: whereabouts.cni.cncf.io/v1alpha1
kind: OverlappingRangeIPReservation
metadata:
  name: 10.66.0.4
spec:
  podref: shikanime/llama-cpp-rpc-0
---
apiVersion: whereabouts.cni.cncf.io/v1alpha1
kind: OverlappingRangeIPReservation
metadata:
  name: 10.66.0.5
spec:
  podref: shikanime/llama-cpp-rpc-1
