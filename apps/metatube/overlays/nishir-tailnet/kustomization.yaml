resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - gateway.yaml
  - httproute.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: media-server
      app.kubernetes.io/instance: metatube
      app.kubernetes.io/name: metatube
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 1.4.0
patches:
  - path: patch-netpol.yaml
    target:
      name: metatube
      version: v1
      kind: NetworkPolicy
