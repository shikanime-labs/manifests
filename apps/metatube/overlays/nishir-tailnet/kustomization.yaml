resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
patches:
  - target:
      name: metatube
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [metatube.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: metatube
            sectionName: https
  - target:
      name: metatube-redirect
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [metatube.taila659a.ts.net]
      - op: replace
        path: /spec/parentRefs
        value:
          - name: metatube
            sectionName: http
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: media-server
      app.kubernetes.io/instance: metatube
      app.kubernetes.io/name: metatube
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 1.4.0
