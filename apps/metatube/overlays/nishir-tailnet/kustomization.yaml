resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
namespace: shikanime
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: metatube.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: metatube
            sectionName: http
    target:
      name: metatube-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: metatube.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: metatube
            sectionName: https
    target:
      name: metatube
      kind: HTTPRoute
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: media-server
      app.kubernetes.io/instance: metatube
      app.kubernetes.io/name: metatube
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 1.4.0
