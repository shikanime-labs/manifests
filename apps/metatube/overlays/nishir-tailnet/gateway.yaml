apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: metatube
spec:
  gatewayClassName: metatube
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: metatube-i-shikanime-studio-tls
            group: ""
            kind: Secret
