resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - path: patch-pvc.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - metatube.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: metatube
          sectionName: https
    target:
      name: metatube
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - metatube.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: metatube
          sectionName: http
    target:
      name: metatube-redirect
      kind: HTTPRoute
secretGenerator:
  - name: metatube
    envs:
      - metatube/.enc.env
