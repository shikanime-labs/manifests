resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
namespace: shikanime
patches:
  - patch: "- op: add\n  path: /spec/hostnames\n  value:\n  - metatube.i.shikanime.studio\n- op: add\n  path: /spec/parentRefs\n  value:\n  - name: metatube\n    sectionName: https"
    target:
      name: metatube
      kind: HTTPRoute
  - patch: "- op: add\n  path: /spec/hostnames\n  value:\n  - metatube.i.shikanime.studio\n- op: add\n  path: /spec/parentRefs\n  value:\n  - name: metatube\n    sectionName: http"
    target:
      name: metatube-redirect
      kind: HTTPRoute
secretGenerator:
  - name: metatube
    envs:
      - metatube/.enc.env
