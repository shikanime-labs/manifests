resources:
  - ../nishir
  - gatewayclass.yaml
  - envoyproxy.yaml
  - backendtlspolicy.yaml
namespace: shikanime
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: torrent-downloader
      app.kubernetes.io/instance: qbittorrent
      app.kubernetes.io/name: qbittorrent
      app.kubernetes.io/part-of: nishir-media
      app.kubernetes.io/version: 5.2.3-1
patches:
  - path: patch-httproute-qbittorrent.yaml
    target:
      name: qbittorrent
      kind: HTTPRoute
  - path: patch-httproute-qbittorrent-redirect.yaml
    target:
      name: qbittorrent-redirect
      kind: HTTPRoute
