apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent-redirect
spec:
  hostnames:
      - qbittorrent.i.shikanime.studio
  parentRefs:
    - name: qbittorrent
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
