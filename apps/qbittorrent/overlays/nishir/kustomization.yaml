resources:
  - ../../base
  - cert.yaml
  - gateway.yaml
namespace: shikanime
components:
  - ../../components/tls
patches:
  - path: patch-pvc.yaml
  - path: patch-sts.yaml
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - qbittorrent.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: qbittorrent
          sectionName: https
    target:
      kind: HTTPRoute
      name: qbittorrent
  - patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - qbittorrent.i.shikanime.studio
      - op: add
        path: /spec/parentRefs
        value:
        - name: qbittorrent
          sectionName: http
    target:
      kind: HTTPRoute
      name: qbittorrent-redirect
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
        - name: qbittorrent
          sectionName: bittorrent
    target:
      kind: TCPRoute
      name: qbittorrent
  - patch: |-
      - op: add
        path: /spec/parentRefs
        value:
        - name: qbittorrent
          sectionName: bittorrent-udp
    target:
      kind: UDPRoute
      name: qbittorrent
secretGenerator:
  - name: qbittorrent
    files:
      - qBittorrent.ini=qbittorrent/qBittorrent.enc.conf
