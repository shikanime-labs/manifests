apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: qbittorrent-tls
spec:
  commonName: qbittorrent
  dnsNames:
    - qbittorrent
    - qbittorrent.shikanime.svc.cluster.local
  issuerRef:
    name: nishir
    kind: ClusterIssuer
  secretName: qbittorrent-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
