---
# Free-tier remote backends. Each free model = one AIServiceBackend so the
# AIGatewayRoute can fan out across providers and fail over on 429/5xx.
# API keys come from the SOPS-secret-mounted env (secretGenerator -> env file).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: nous-free
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: nous-free
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: nous-free
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: api.nousresearch.com
        port: 443
    - fqdn:
        hostname: api.together.xyz
        port: 443
  # ponytail: Nous API is aggregated; single FQDN approximates. Expand per-key
  # Backend when key rotation is needed (one Backend per key+host).
  tls:
    insecure: false
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: nous-free-key
  namespace: shikanime
spec:
  type: APIKey
  targetRefs:
    - name: nous-free
      group: aigateway.envoyproxy.io
      kind: AIServiceBackend
  apiKey:
    secretRef:
      name: envoy-ai-gateway-api-keys
      key: nous-api-key
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openrouter-free
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: openrouter-free
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openrouter-free
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: openrouter.ai
        port: 443
  tls:
    insecure: false
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openrouter-free-key
  namespace: shikanime
spec:
  type: APIKey
  targetRefs:
    - name: openrouter-free
      group: aigateway.envoyproxy.io
      kind: AIServiceBackend
  apiKey:
    secretRef:
      name: envoy-ai-gateway-api-keys
      key: openrouter-api-key
---
# Local floor: in-cluster llama-cpp serving (no API key, never 429s).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ishtar-local
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: ishtar-local
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ishtar-local
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: qwen3-8b.ishtar.svc.cluster.local
        port: 8000
  tls:
    insecure: true
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: telsha-local
  namespace: shikanime
spec:
  schema:
    name: OpenAI
  backendRef:
    name: telsha-local
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: telsha-local
  namespace: shikanime
spec:
  endpoints:
    - fqdn:
        hostname: gemma-4-e2b.telsha.svc.cluster.local
        port: 8000
  tls:
    insecure: true
