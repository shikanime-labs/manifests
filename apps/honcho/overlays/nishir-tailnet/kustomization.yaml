resources:
  - ../nishir
  - envoyproxy.yaml
  - gatewayclass.yaml
namespace: shikanime
images:
  - name: honcho
    newName: ghcr.io/plastic-labs/honcho
    newTag: v3.6.0@sha256:eb906a2d251aa48b22347e4465b40785ea7a84e2bfd1105780416bf1f0121099
configMapGenerator:
  - name: honcho
    files:
      - honcho/config.toml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: agent
      app.kubernetes.io/instance: honcho
      app.kubernetes.io/name: honcho
      app.kubernetes.io/part-of: nishir-automata
      app.kubernetes.io/version: 3.0.12
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: honcho-gateway.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: honcho
            sectionName: http
    target:
      name: honcho-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: honcho-gateway.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: honcho
            sectionName: https
    target:
      name: honcho
      kind: HTTPRoute
