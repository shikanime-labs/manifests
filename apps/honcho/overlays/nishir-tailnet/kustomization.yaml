resources:
  - ../nishir
  - envoyproxy.yaml
  - gatewayclass.yaml
namespace: shikanime
images:
  - name: honcho
    newName: ghcr.io/plastic-labs/honcho
    newTag: v3.5.0@sha256:23ff96bf62ab2ca14928e6766db1a30a7729f5b7c9e2285af0cd4a179c0d393d
configMapGenerator:
  - name: honcho
    files:
      - honcho/config.toml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: agent
      app.kubernetes.io/instance: honcho
      app.kubernetes.io/name: honcho
      app.kubernetes.io/part-of: nishir-automata
      app.kubernetes.io/version: 3.0.12
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: honcho-gateway.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: honcho
            sectionName: http
    target:
      name: honcho-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: honcho-gateway.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: honcho
            sectionName: https
    target:
      name: honcho
      kind: HTTPRoute
