resources:
  - ../nishir
  - envoyproxy.yaml
  - gatewayclass.yaml
namespace: shikanime
images:
  - name: honcho
    newName: ghcr.io/plastic-labs/honcho
    newTag: v3.3.0@sha256:5bb8cf7a60845e08f83fed66f01907afa0969dd1d02e414ed576102f3b12dfe8
configMapGenerator:
  - name: honcho
    files:
      - honcho/config.toml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: agent
      app.kubernetes.io/instance: honcho
      app.kubernetes.io/name: honcho
      app.kubernetes.io/part-of: nishir-automata
      app.kubernetes.io/version: 3.0.12
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: honcho.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: honcho
            sectionName: http
    target:
      name: honcho-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: honcho.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: honcho
            sectionName: https
    target:
      name: honcho
      kind: HTTPRoute
