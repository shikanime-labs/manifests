resources:
  - ../nishir
  - envoyproxy.yaml
  - gatewayclass.yaml
namespace: shikanime
images:
  - name: honcho
    newName: ghcr.io/plastic-labs/honcho
    newTag: v3.3.0@sha256:22ef9951be7868b1af455bd2b7d35ba0dbdae75f48f1c0d2ca9d00fbd3f43559
configMapGenerator:
  - name: honcho
    files:
      - honcho/config.toml
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/component: agent
      app.kubernetes.io/instance: honcho
      app.kubernetes.io/name: honcho
      app.kubernetes.io/part-of: nishir-automata
      app.kubernetes.io/version: 3.0.12
patches:
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: honcho.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: honcho
            sectionName: http
    target:
      name: honcho-redirect
      kind: HTTPRoute
  - patch: |-
      - op: add
        path: /spec/hostnames/-
        value: honcho.taila659a.ts.net
      - op: replace
        path: /spec/parentRefs
        value:
          - name: honcho
            sectionName: https
    target:
      name: honcho
      kind: HTTPRoute
