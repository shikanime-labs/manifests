apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: studio-shikanime-i-honcho
  namespace: shikanime
spec:
  commonName: honcho.i.shikanime.studio
  dnsNames:
    - honcho.i.shikanime.studio
  issuerRef:
    name: studio-shikanime
    kind: ClusterIssuer
  secretName: studio-shikanime-i-honcho
  usages:
    - digital signature
    - key encipherment
    - server auth
