---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: honcho
spec:
  rules:
    - backendRefs:
        - name: honcho
          port: 8000
      timeouts:
        request: 600s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: honcho-redirect
spec:
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
